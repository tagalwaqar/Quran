  refresh:'<polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2-9.4L23 10"/>'
};
const ic = (n,s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 inline-block align-middle" aria-hidden="true">${I[n]||''}</svg>`;
const app = $('#app'), layer = $('#layer');
const loader = t => `<div class="min-h-[60vh] flex items-center justify-center gap-3 text-pine-800"><span class="spin dark"></span> ${t}</div>`;

function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = (type==='ok'?ic('check'):type==='err'?ic('alert'):ic('chat')) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),350); }, 4200);
}
function modal(html){ layer.innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`; document.body.style.overflow='hidden'; }
function closeLayer(){ layer.innerHTML=''; document.body.style.overflow=''; }
async function copyText(t,msg){
  try { await navigator.clipboard.writeText(t); toast(msg,'ok'); }
  catch(e){ modal(`<div class="m-head">انسخ يدويًا</div><div class="m-body"><div class="link-out" style="user-select:all">${esc(t)}</div></div><div class="m-actions"><button class="btn btn-outline" data-close>إغلاق</button></div>`); }
}

/* ---------- تحميل الإعدادات من قاعدة البيانات ---------- */
async function loadPublic(){
  const { data, error } = await sb.from('app_settings').select('key,value');
  if (error) throw error;
  (data||[]).forEach(r => {
    if (r.key==='site')    S.site    = { ...SITE_DEFAULTS, ...r.value };
    if (r.key==='levels')  S.levels  = (Array.isArray(r.value)&&r.value.length) ? r.value : LEVELS_DEFAULT;
    if (r.key==='config')  S.config  = { registration_open:false, age_ref_date:null, ...r.value };
  });
}

/* ---------- التوجيه ---------- */
async function route(){
  const page = ((location.hash||'#/').slice(2)) || 'home';
  window.scrollTo(0,0);
  document.title = ({register:'التسجيل — ',terms:'شروط المسابقة — ',admin:'لوحة الإدارة — '}[page]||'') + 'المسابقة الكبرى لحفظ القرآن الكريم';
  if (!sb) return renderNotConfigured();
  try {
    if (S.site === null) await loadPublic();
    if (page==='admin')    return await renderAdmin();
    if (page==='register') return renderRegister();
    if (page==='terms')    return renderTerms();
    return renderHome();
  } catch(e){ renderFatal(e); }
}
window.addEventListener('hashchange', route);

function collectForm(){
  const v = id => (($('#'+id)||{}).value||'').trim();
  return {
    full_name:v('full_name'), birth_date:v('birth_date'), level_id:+v('level_id')||0,
    memorized:v('memorized'), governorate:v('governorate'), city:v('city'), village:v('village'),
    center_name:v('center_name'), guardian_name:v('guardian_name'), guardian_phone:v('guardian_phone'),
    notes:v('notes'), agree1:$('#agree1').checked, agree2:$('#agree2').checked
  };
}
function validateForm(d){
  const e = {};
  if (!d.full_name) e.full_name='هذا الحقل مطلوب';
  else if (d.full_name.split(/\s+/).length<4) e.full_name='اكتب الاسم رباعيًا (أربع كلمات على الأقل)';
  if (!d.birth_date) e.birth_date='هذا الحقل مطلوب';
  else if (d.birth_date>todayISO()) e.birth_date='تاريخ الميلاد لا يمكن أن يكون في المستقبل';
  if (!d.level_id) e.level_id='اختر مستوى المشاركة';
  else {
    const lv=S.levels.find(l=>l.id===d.level_id), age=calcAge(d.birth_date,S.config.age_ref_date);
    if (lv&&age!=null&&age>lv.max_age) e.level_id=`العمر المحسوب (${arNum(age)} عامًا) يتجاوز الحد الأقصى للمستوى «${lv.name}» (${arNum(lv.max_age)} عامًا) — اختر مستوى آخر`;
  }
  if (!d.memorized) e.memorized='اذكر مقدار ما حفظه المتسابق حتى الآن';
  if (!d.governorate) e.governorate='اختر المحافظة';
  if (!d.city) e.city='هذا الحقل مطلوب';
  if (!d.village) e.village='هذا الحقل مطلوب';
  if (!d.guardian_name) e.guardian_name='هذا الحقل مطلوب';
  if (!/^01[0125]\d{8}$/.test(d.guardian_phone)) e.guardian_phone='أدخل رقمًا مصريًا صحيحًا (11 رقمًا يبدأ بـ 010 أو 011 أو 012 أو 015)';
  if (!d.agree1) e.agree1='يلزم الإقرار بصحة البيانات لإتمام التسجيل';
  if (!d.agree2) e.agree2='يلزم الموافقة على سياسة الخصوصية';
  return e;
}
function paintErrs(errs){
  $$('#regForm .field').forEach(f=>{
    const p=f.querySelector('.err');
    if (errs[f.dataset.f]){ f.classList.add('invalid'); if(p){p.textContent=errs[f.dataset.f];p.classList.remove('hidden');} }
    else { f.classList.remove('invalid'); if(p)p.classList.add('hidden'); }
  });
}
function updateAge(){
  const el=$('#age_display'); if(!el)return;
  const a=calcAge($('#birth_date').value,S.config.age_ref_date);
  el.value=(a==null||a<0)?'':(arNum(a)+' عامًا');
}
function updateElig(){
  const box=$('#elig'); if(!box)return;
  const b=$('#birth_date').value, lid=+$('#level_id').value;
  box.className='elig'; box.innerHTML='';
  if(!b||!lid)return;
  const age=calcAge(b,S.config.age_ref_date), lv=S.levels.find(l=>l.id===lid);
  if(age==null||!lv)return;
  if(age<=lv.max_age){ box.className='elig good'; box.innerHTML=ic('check',15)+` مؤهل — العمر المحسوب ${arNum(age)} عامًا والحد الأقصى للمستوى ${arNum(lv.max_age)} عامًا`; }
  else { box.className='elig bad'; box.innerHTML=ic('alert',15)+` العمر ${arNum(age)} عامًا يتجاوز الحد الأقصى للمستوى «${esc(lv.name)}» (${arNum(lv.max_age)} عامًا) — اختر مستوى آخر`; }
}
function wireRegForm(){
  $('#birth_date').addEventListener('change',()=>{updateAge();updateElig();});
  $('#level_id').addEventListener('change',updateElig);
  $('#regForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const d=collectForm(), errs=validateForm(d);
    paintErrs(errs); $('#formErr').classList.add('hidden');
    if (Object.keys(errs).length){
      const first=$('#regForm .field.invalid');
      if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
      toast('يرجى مراجعة الحقول المحددة بالأحمر','err'); return;
    }
    const btn=$('#submitBtn'), old=btn.innerHTML;
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ إرسال الطلب…';
    try {
      const payload={full_name:d.full_name,birth_date:d.birth_date,level_id:d.level_id,memorized:d.memorized,
        governorate:d.governorate,city:d.city,village:d.village,center_name:d.center_name||null,
        guardian_name:d.guardian_name,guardian_phone:d.guardian_phone,notes:d.notes||null};
      const {data,error}=await sb.rpc('register_participant',{r:payload});
      if(error)throw error;
      window.scrollTo({top:0});
      renderRegSuccess(d,data);
      toast('تم استلام طلب التسجيل بنجاح','ok');
    } catch(err){
      const box=$('#formErr');
      box.textContent='تعذّر إتمام التسجيل: '+(err.message||'خطأ غير متوقع — حاول مرة أخرى');
      box.classList.remove('hidden'); box.scrollIntoView({behavior:'smooth',block:'center'});
      toast('تعذّر إتمام التسجيل','err');
      btn.disabled=false; btn.innerHTML=old;
    }
  });
}

  const rows=filteredRegs();
  if(!rows.length) return toast('لا توجد نتائج للتصدير','err');
  const H=['رقم التسجيل','تاريخ التقديم','الاسم الرباعي','تاريخ الميلاد','العمر','المستوى','مقدار الحفظ','المحافظة','المركز/المدينة','القرية/المنطقة','مركز التحفيظ/المحفظ','اسم ولي الأمر','هاتف ولي الأمر','ملاحظات المتسابق','الحالة','ملاحظات الإدارة'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const line=r=>[r.reg_no,r.created_at,r.full_name,r.birth_date,r.age,r.level_name,r.memorized,r.governorate,r.city,r.village,r.center_name,r.guardian_name,r.guardian_phone,r.notes,STATUS[r.status],r.admin_notes].map(q).join(',');
  const csv='\uFEFF'+[H.map(q).join(','),...rows.map(line)].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='تسجيلات-المسابقة-'+todayISO()+'.csv';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('تم تنزيل الملف — يفتح مباشرة في Excel بترميز عربي سليم','ok');
}

/* ----- تبويب المستويات ----- */
function readLevelsDom(){
  $$('.lv-k').forEach(el=>{ const i=+el.dataset.i; S.levels[i][el.dataset.k]=el.dataset.k==='max_age'?+el.value:el.value.trim(); });
}
function paintLevels(){
  $('#lvBox').innerHTML=S.levels.map((l,i)=>`
  <div class="card p-3 grid gap-2 items-center md:grid-cols-[auto_1fr_2fr_7rem_2.2rem]">
    <div class="flex items-center gap-1">
      <button class="ibtn js-lvup" data-i="${i}" title="تقديم">${ic('up',13)}</button>
      <b class="font-amiri text-pine-800 w-5 text-center">${arNum(i+1)}</b>
      <button class="ibtn js-lvdown" data-i="${i}" title="تأخير">${ic('down',13)}</button>
    </div>
    <input class="input lv-k" data-i="${i}" data-k="name" value="${esc(l.name)}" placeholder="اسم المستوى">
    <input class="input lv-k" data-i="${i}" data-k="desc" value="${esc(l.desc)}" placeholder="المطلوب حفظه">
    <input class="input lv-k" data-i="${i}" data-k="max_age" type="number" min="3" max="99" value="${esc(l.max_age)}" title="الحد الأقصى للعمر">
    <button class="ibtn ibtn-red js-lvdel" data-i="${i}" title="حذف">${ic('trash',15)}</button>
  </div>`).join('');
}
function renderLevelsTab(){
  $('#dashMain').innerHTML=`
  <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
    <h2 class="font-amiri text-2xl text-pine-800">المستويات وحدود الأعمار</h2>
    <button id="addLevel" class="btn btn-outline btn-sm">${ic('plus')} إضافة مستوى</button>
  </div>
  <p class="text-xs text-ink/55 mb-4 leading-loose">عدّل الاسم أو المطلوب أو الحد الأقصى للعمر ورتّب المستويات بالأسهم — تُنشر التعديلات فور الحفظ على صفحة المتسابقين، ويعتمدها التحقق داخل قاعدة البيانات نفسها.</p>
  <div id="lvBox" class="space-y-2.5"></div>
  <button id="saveLevels" class="btn btn-primary mt-5">${ic('check')} حفظ المستويات</button>`;
  paintLevels();
}
async function saveLevels(){
  readLevelsDom();
  if (S.levels.some(l=>!l.name||!l.max_age)) return toast('كل مستوى يحتاج اسمًا وحدًا أقصى للعمر','err');
  const btn=$('#saveLevels'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ الحفظ…';
  try{
    const levels=S.levels.map((l,i)=>({id:i+1,name:l.name,desc:l.desc||'',max_age:l.max_age}));
    const {error}=await sb.from('app_settings').upsert({key:'levels',value:levels},{onConflict:'key'});
    if(error)throw error;
    S.levels=levels;
    toast('تم حفظ المستويات ونشرها فورًا','ok');
    renderLevelsTab();
  }catch(e){ toast('تعذّر الحفظ: '+e.message,'err'); btn.disabled=false; btn.innerHTML=ic('check')+' حفظ المستويات'; }
}

/* ----- تبويب الإعدادات ----- */
const stIn=(id,label,val,o={})=>`<div><label class="label">${label}</label><input id="${id}" ${o.tel?'type="tel" dir="ltr"':''} class="input" value="${esc(val||'')}" ${o.ph?`placeholder="${o.ph}"`:''}></div>`;
function renderSettingsTab(){
  const s=S.site, c=S.config;
  const hasHttp=location.protocol.startsWith('http');
  const regLink=hasHttp?location.origin+location.pathname.replace(/[^/]*$/,'')+'#/register':'(سيظهر الرابط هنا بعد نشر المنصة على استضافة)';
  $('#dashMain').innerHTML=`
  <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
    <h2 class="font-amiri text-2xl text-pine-800">الإعدادات العامة</h2>
    <button id="saveSettings" class="btn btn-primary btn-sm">${ic('check')} حفظ ونشر</button>
  </div>
  <div class="card p-5 mb-5">
    <h3 class="font-amiri text-xl text-pine-800 mb-4">ضبط التسجيل وتاريخ احتساب العمر</h3>
    <div class="grid md:grid-cols-2 gap-5">
      <div>
        <label class="label">تاريخ احتساب العمر (مرجع الأهلية) <span class="text-red-700">*</span></label>
        <input id="st_ref" type="date" class="input" value="${esc(c.age_ref_date||'')}">
        <p class="text-xs text-ink/55 mt-1.5 leading-loose">${c.age_ref_date?`يُحتسب عمر كل متسابق حتى ${fmtDate(c.age_ref_date)} — عدّله متى قررت اللجنة، وينعكس فورًا على التحقق في الواجهة وقاعدة البيانات.`
          :'<b class="text-red-800">التسجيل النهائي متوقف حتى تحديد هذا التاريخ.</b> اختر التاريخ الذي تُحتسب عنده الأعمار (مثال: تاريخ أول الاختبارات أو الإعلان).'}</p>
      </div>
      <div>
        <label class="label">حالة استقبال التسجيلات</label>
        <label class="check !mt-0"><input type="checkbox" id="st_open" ${c.registration_open?'checked':''}><span>فتح التسجيل أمام المتسابقين</span></label>
        <p class="text-xs text-ink/55 mt-1.5 leading-loose">إغلاق التسجيل يُخفي الاستمارة في الواجهة ويرفض أي طلب مباشر على قاعدة البيانات في آن واحد.</p>
      </div>
    </div>
  </div>
  <div class="card p-5 mb-5">
    <h3 class="font-amiri text-xl text-pine-800 mb-4">هوية المنصة والتواصل</h3>
    <div class="grid md:grid-cols-2 gap-5">
      ${stIn('st_org','اسم الجهة المنظمة',s.org_name)}
      ${stIn('st_partner','الجهة المتعاونة',s.partner)}
      ${stIn('st_season','الموسم',s.season)}
      ${stIn('st_title','عنوان المسابقة',s.title)}
      <div class="md:col-span-2">${stIn('st_ayah','الآية أعلى العنوان',s.ayah)}</div>
      <div class="md:col-span-2"><label class="label">العبارة الترحيبية</label><textarea id="st_welcome" rows="3" class="input">${esc(s.welcome)}</textarea></div>
      ${stIn('st_phone','هاتف الإدارة',s.phone,{tel:1,ph:'01XXXXXXXXX'})}
      ${stIn('st_wa','رقم واتساب (بصيغة دولية)',s.whatsapp,{tel:1,ph:'2010XXXXXXXX'})}
      <div class="md:col-span-2">${stIn('st_addr','العنوان / مكتب الاستفسار',s.address)}</div>
    </div>
  </div>
  <div class="card p-5 mb-5">
    <h3 class="font-amiri text-xl text-pine-800 mb-4">نصوص الشروط والخصوصية</h3>
    <p class="text-xs text-ink/55 mb-3">كل سطر في «الشروط» يظهر فقرة مستقلة في صفحة الشروط.</p>
    <div class="space-y-5">
      <div><label class="label">شروط المسابقة</label><textarea id="st_terms" rows="9" class="input leading-loose">${esc(s.terms)}</textarea></div>
      <div><label class="label">سياسة الخصوصية</label><textarea id="st_privacy" rows="5" class="input leading-loose">${esc(s.privacy)}</textarea></div>
    </div>
  </div>
  <div class="card p-5">
    <h3 class="font-amiri text-xl text-pine-800 mb-4">رابط التسجيل العام (للمشاركة في واتساب وفيسبوك)</h3>
    <div class="link-out">${esc(regLink)}</div>
    <div class="flex gap-2 flex-wrap mt-3">
      <button id="copyRegLink" class="btn btn-outline btn-sm">${ic('copy')} نسخ الرابط</button>
      <button id="copyInvite" class="btn btn-outline btn-sm">${ic('chat')} نسخ نص دعوة جاهز</button>
    </div>
  </div>
  <button id="saveSettings" class="btn btn-primary mt-5">${ic('check')} حفظ ونشر</button>`;
}
async function saveSettings(){
  const btns=$$('#saveSettings');
  btns.forEach(b=>{b.disabled=true;b.innerHTML='<span class="spin"></span> جارٍ الحفظ…';});
  const site={...S.site,
    org_name:$('#st_org').value.trim()||S.site.org_name, partner:$('#st_partner').value.trim(),
    season:$('#st_season').value.trim()||S.site.season, title:$('#st_title').value.trim()||S.site.title,
    ayah:$('#st_ayah').value.trim(), welcome:$('#st_welcome').value.trim(),
    phone:$('#st_phone').value.trim(), whatsapp:$('#st_wa').value.trim(), address:$('#st_addr').value.trim(),
    terms:$('#st_terms').value.trim()||SITE_DEFAULTS.terms, privacy:$('#st_privacy').value.trim()||SITE_DEFAULTS.privacy};
  const config={registration_open:$('#st_open').checked, age_ref_date:$('#st_ref').value||null};
  try{
    const {error}=await sb.from('app_settings').upsert([{key:'site',value:site},{key:'config',value:config}],{onConflict:'key'});
    if(error)throw error;
    S.site=site; S.config=config;
    let msg='تم حفظ الإعدادات ونشرها فورًا';
    if(config.registration_open&&!config.age_ref_date) msg+=' — تنبيه: يظل التسجيل موقوفًا حتى تحديد تاريخ احتساب العمر';
    toast(msg, config.registration_open&&!config.age_ref_date?'':'ok');
    renderSettingsTab();
  }catch(e){
    toast('تعذّر الحفظ: '+e.message,'err');
    btns.forEach(b=>{b.disabled=false;b.innerHTML=ic('check')+' حفظ ونشر';});
  }
}

/* ================================================================
   تفويض الأحداث
   ================================================================ */
document.addEventListener('click', async e=>{
  const t=e.target;
  if (t.closest('[data-close]')||t.classList.contains('overlay')){ closeLayer(); return; }
  if (t.closest('#openPrivacy')){
    modal(`<div class="m-head">سياسة الخصوصية</div><div class="m-body">${esc(S.site.privacy)}</div>
      <div class="m-actions"><button class="btn btn-outline" data-close>إغلاق</button></div>`);
    return;
  }
  const btn=t.closest('button'); if(!btn)return;

  if (btn.dataset.tab){ A.tab=btn.dataset.tab; renderDash(); return; }

  if (btn.id==='logoutBtn'){ A.regs=null; await sb.auth.signOut(); if((location.hash||'').includes('admin')) renderAdmin(); return; }

  if (btn.id==='refreshRegs'){
    btn.disabled=true;
    try{ await loadRegs(); renderDash(); toast('تم التحديث','ok'); }catch(err){ toast(err.message,'err'); btn.disabled=false; }
    return;
  }
  if (btn.id==='exportCsv'){ exportCsv(); return; }
  if (btn.classList.contains('js-view')){ openDetail(btn.dataset.id); return; }

  if (btn.id==='dSave'){
    const id=btn.dataset.id;
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ الحفظ…';
    try{
      const {error}=await sb.from('registrations').update({admin_notes:$('#dNote').value.trim(),status:$('#dStatus').value}).eq('id',id);
      if(error)throw error;
      const r=A.regs.find(x=>x.id===id); if(r){r.admin_notes=$('#dNote').value.trim();r.status=$('#dStatus').value;}
      toast('تم حفظ الملاحظة والحالة','ok'); closeLayer(); renderTab();
    }catch(err){ toast('تعذّر الحفظ: '+err.message,'err'); btn.disabled=false; btn.innerHTML=ic('check',15)+' حفظ'; }
    return;
  }

  if (btn.classList.contains('js-del')){
    const id=btn.dataset.id, r=A.regs.find(x=>x.id===id)||{};
    closeLayer();
    modal(`<div class="m-head">حذف التسجيل نهائيًا</div>
      <div class="m-body">هل أنت متأكد من حذف تسجيل <b>${esc(r.full_name||'')}</b> رقم <b>${esc(r.reg_no||'')}</b>؟ لا يمكن التراجع عن هذا الإجراء.</div>
      <div class="m-actions"><button class="btn btn-danger" id="mDelOk">${ic('trash',15)} حذف نهائي</button><button class="btn btn-outline" data-close>إلغاء</button></div>`);
    $('#mDelOk').onclick=async()=>{
      const b=$('#mDelOk'); b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ الحذف…';
      try{
        const {error}=await sb.from('registrations').delete().eq('id',id);
        if(error)throw error;
        A.regs=A.regs.filter(x=>x.id!==id);
        toast('تم الحذف نهائيًا','ok'); closeLayer(); renderDash();
      }catch(err){ toast('تعذّر الحذف: '+err.message,'err'); b.disabled=false; }
    };
    return;
  }

  if (btn.id==='addLevel'){ readLevelsDom(); S.levels.push({name:'مستوى جديد',desc:'',max_age:10}); paintLevels(); return; }
  if (btn.classList.contains('js-lvup')){ readLevelsDom(); const i=+btn.dataset.i; if(i>0){const tmp=S.levels[i];S.levels[i]=S.levels[i-1];S.levels[i-1]=tmp;paintLevels();} return; }
  if (btn.classList.contains('js-lvdown')){ readLevelsDom(); const i=+btn.dataset.i; if(i<S.levels.length-1){const tmp=S.levels[i];S.levels[i]=S.levels[i+1];S.levels[i+1]=tmp;paintLevels();} return; }
  if (btn.classList.contains('js-lvdel')){ readLevelsDom(); if(S.levels.length<=1)return toast('أبقِ مستوى واحدًا على الأقل','err'); S.levels.splice(+btn.dataset.i,1); paintLevels(); return; }
  if (btn.id==='saveLevels'){ saveLevels(); return; }
  if (btn.id==='saveSettings'){ saveSettings(); return; }

  if (btn.id==='copyRegLink'||btn.id==='copyInvite'){
    if(!location.protocol.startsWith('http')) return toast('الرابط متاح بعد نشر المنصة على استضافة','err');
    const link=location.origin+location.pathname.replace(/[^/]*$/,'')+'#/register';
    if(btn.id==='copyRegLink') return copyText(link,'تم نسخ رابط التسجيل');
    const inv=`المسابقة الكبرى لحفظ القرآن الكريم — موسم ${S.site.season}\n${S.site.org_name}\n${S.site.partner}\nخمسة مستويات تناسب مقدار الحفظ والعمر — التسجيل متاح عبر الرابط:\n${link}`;
    return copyText(inv,'تم نسخ نص الدعوة — الصقه في واتساب أو فيسبوك');
  }
});
document.addEventListener('change', async e=>{
  const sel=e.target.closest('select.js-status'); if(!sel)return;
  sel.disabled=true;
  try{
    const {error}=await sb.from('registrations').update({status:sel.value}).eq('id',sel.dataset.id);
    if(error)throw error;
    const r=A.regs.find(x=>x.id===sel.dataset.id); if(r)r.status=sel.value;
    toast('تم تحديث الحالة إلى: '+STATUS[sel.value],'ok');
    renderTab();
  }catch(err){ toast('تعذّر التحديث: '+err.message,'err'); sel.disabled=false; }
});
if (sb) sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'&&(location.hash||'').includes('admin')) renderAdmin(); });

/* انطلاق التطبيق */
route();
</script>
