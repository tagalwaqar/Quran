/* ---------- الثيمات ---------- */
let THEME_PENDING = null;
const THEME_BASE = {

/* ---------- ألوان المستويات وأدوات الصور ---------- */
const LEVEL_COLORS = ['#0F3D2C','#0E7490','#1E40AF','#B45309','#86198F'];
const lvColor = (l,i) => (l && l.color) || LEVEL_COLORS[(i||0) % LEVEL_COLORS.length];
const lvColorById = id => { const i = (S.levels||[]).findIndex(l=>l.id===id); return i>-1 ? lvColor(S.levels[i],i) : '#0F3D2C'; };
const hexA = (hex,a) => { const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; };
function patBg(c){
  const s = encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="84" height="84"><g fill="none" stroke="#E0C468" stroke-opacity=".28"><rect x="24" y="24" width="36" height="36"/><rect x="24" y="24" width="36" height="36" transform="rotate(45 42 42)"/></g><circle cx="42" cy="42" r="3.5" fill="#E0C468" fill-opacity=".3"/></svg>`);
  return `background-color:${c};background-image:url('data:image/svg+xml,${s}');background-size:84px 84px`;
}
function pickImage(file, maxW, png){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      try{
        const sc = Math.min(1, maxW / (img.naturalWidth||maxW));
        const w = Math.max(1, Math.round(img.naturalWidth*sc)), h = Math.max(1, Math.round(img.naturalHeight*sc));
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        const ctx = c.getContext('2d');
        if(!png){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); }
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        res(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', .78));
      }catch(err){ URL.revokeObjectURL(url); rej(err); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('ملف صورة غير صالح')); };
    img.src = url;
  });
}

/* ---------- أدوات QR ---------- */
function qrImgTag(text, cell, margin){
  if (typeof qrcode !== 'function') return '';
  try{
    const q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    return q.createImgTag(cell, margin);
  }catch(e){ return ''; }
}
function downloadQrPng(text, name){
  if (typeof qrcode !== 'function') return toast('مكتبة QR غير محمّلة','err');
  try{
    const q = qrcode(0,'M'); q.addData(text); q.make();
    const img = new Image();
    img.onload = ()=>{
      try{
        const c = document.createElement('canvas');
        c.width = img.width||480; c.height = img.height||480;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
        ctx.drawImage(img,0,0);
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = name;
        a.click();
        toast('تم تحميل صورة QR بصيغة PNG','ok');
      }catch(err){ toast('تعذر إنشاء الصورة — يمكن تصوير الشاشة','err'); }
    };
    img.onerror = ()=>toast('تعذر إنشاء الصورة','err');
    img.src = q.createDataURL(10, 20);
  }catch(e){ toast('تعذر إنشاء QR','err'); }
}

function calcAge(b, ref){
  if(!b || !ref) return null;
  const bd = new Date(b+'T00:00:00'), rd = new Date(ref+'T00:00:00');
  if (isNaN(bd) || isNaN(rd)) return null;
  let a = rd.getFullYear() - bd.getFullYear();
  const m = rd.getMonth() - bd.getMonth();
  if (m < 0 || (m === 0 && rd.getDate() < bd.getDate())) a--;
  return a;
}

function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = (type==='ok'?ic('check'):type==='err'?ic('alert'):ic('chat')) + `<span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),350); }, 4200);
}

function parsePhones(v){
  const arr = Array.isArray(v) ? v : String(v||'').split(/\r?\n|,/);
  return arr.map(x=>String(x).trim()).filter(Boolean).map(line=>{
    let label='', num=line;
    const m = line.match(/^(.*?)[:：]\s*(.+)$/);
    if (m){ label=m[1].trim(); num=m[2].trim(); }
    return {label, num, digits:num.replace(/\D/g,'')};
  });
}
function waLink(d){ let x=String(d||''); if(/^01\d{9}$/.test(x)) x='2'+x; return 'https://wa.me/'+x; }

async function loadPublic(){
  const { data, error } = await sb.from('app_settings').select('key,value');
  if (error) throw error;
  (data||[]).forEach(r => {
    if (r.key==='site')    S.site    = { ...SITE_DEFAULTS, ...r.value };
    if (r.key==='levels')  S.levels  = (Array.isArray(r.value)&&r.value.length) ? r.value : [...LEVELS_DEFAULT];
    if (r.key==='config')  S.config  = { registration_open:false, age_ref_date:null, ...r.value };
  });
}

async function route(){
  const raw   = (location.hash||'#/').slice(2);
  const parts = raw.split('/');
  const page  = parts[0] || 'home';
  const param = parts[1] ? decodeURIComponent(parts[1]) : null;
  window.scrollTo(0,0);
  document.title = ({register:'التسجيل — ',terms:'شروط المسابقة — ',admin:'لوحة الإدارة — ',track:'متابعة الطلب — '}[page]||'') + 'المسابقة الكبرى لحفظ القرآن الكريم';
  if (!sb) return renderNotConfigured();
  try {
    if (S.site === null) await loadPublic();
    if (page==='admin')    return await renderAdmin();
    if (page==='register') return renderRegister(param);
    if (page==='track')    return renderTrack();
    if (page==='terms')    return renderTerms();
    return renderHome();
  } catch(e){ renderFatal(e); }
}

function contactCards(s){
  const cards=[];
  const ph=parsePhones(s.phone), wa=parsePhones(s.whatsapp);
  if (ph.length) cards.push(`<div class="card p-6 text-center">
    <span class="w-12 h-12 rounded-full bg-pine-800 text-gold-400 inline-flex items-center justify-center">${ic('phone',22)}</span>
    <p class="text-xs text-ink/50 mt-3">${ph.length>1?'هواتف الإدارة':'هاتف الإدارة'}</p>
    <div class="mt-1 space-y-1.5">${ph.map(p=>`<a href="tel:${p.digits}" class="font-semibold text-pine-800 hover:underline block">${p.label?esc(p.label)+' · ':''}<span dir="ltr">${esc(p.num)}</span></a>`).join('')}</div>
  </div>`);
  if (wa.length) cards.push(`<div class="card p-6 text-center">
    <span class="w-12 h-12 rounded-full bg-pine-800 text-gold-400 inline-flex items-center justify-center">${ic('chat',22)}</span>
    <p class="text-xs text-ink/50 mt-3">واتساب</p>
    <div class="mt-1 space-y-1.5">${wa.map(p=>`<a href="${waLink(p.digits)}" target="_blank" rel="noopener" class="font-semibold text-pine-800 hover:underline block">${p.label?esc(p.label)+' · ':''}<span dir="ltr">${esc(p.num)}</span></a>`).join('')}</div>
  </div>`);
  if (s.address) cards.push(`<div class="card p-6 text-center">
    <span class="w-12 h-12 rounded-full bg-pine-800 text-gold-400 inline-flex items-center justify-center">${ic('pin',22)}</span>

  if (!cards.length) cards.push(`<div class="card p-6 text-center">
    <span class="w-12 h-12 rounded-full bg-pine-800 text-gold-400 inline-flex items-center justify-center">${ic('chat',22)}</span>

function renderTrack(){
  app.innerHTML = pubShell(`
  <section class="bg-cream-50 border-b border-cream-200 py-10 text-center">
    <p class="text-xs text-ink/50 mb-2"><a href="#/" class="link">الرئيسية</a> / متابعة الطلب والنتيجة</p>

    <p class="text-sm text-ink/60 mt-1">أدخل الرقم القومي للمتسابق للاستعلام عن حالة طلبه ونتيجته</p>
  </section>
  <section class="max-w-xl mx-auto px-4 py-10">
    <div class="card border-t-4 border-t-gold-500 p-6 md:p-8">
      <label class="label">الرقم القومي للمتسابق <span class="text-red-700">*</span></label>
      <input id="trkNid" dir="ltr" inputmode="numeric" maxlength="14" class="input !text-lg tracking-widest" placeholder="١٤ رقمًا">
      <button id="trkGo" class="btn btn-primary w-full !py-3 mt-4">${ic('search')} استعلام</button>
      <p class="text-xs text-ink/55 mt-3 leading-loose text-center">تظهر حالة الطلب وسبب الرفض إن وُجد، ولجنة الاختبار والدرجات عند اعتمادها.</p>
      <div id="trkOut" class="mt-6"></div>
    </div>
  </section>`);
  const inp = $('#trkNid');
  inp.addEventListener('input', ()=>{ inp.value = inp.value.replace(/\D/g,'').slice(0,14); });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') $('#trkGo').click(); });
  $('#trkGo').addEventListener('click', doTrack);
}
async function doTrack(){
  const nid = $('#trkNid').value.trim();
  const out = $('#trkOut'), btn = $('#trkGo');
  if(!/^[23]\d{13}$/.test(nid)){
    out.innerHTML = `<p class="text-sm bg-amber-50 border border-amber-300 text-amber-900 rounded-xl px-4 py-3 leading-loose">${ic('alert',16)} أدخل رقمًا قوميًا صحيحًا — ١٤ رقمًا يبدأ بـ ٢ أو ٣.</p>`;
    return;
  }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> جارٍ الاستعلام…';
  try{
    const { data, error } = await sb.rpc('lookup_application', { p_national_id: nid });
    if (error) throw error;
    if (!data){
      out.innerHTML = `<p class="text-sm bg-amber-50 border border-amber-300 text-amber-900 rounded-xl px-4 py-3 leading-loose">${ic('alert',16)} لا يوجد طلب تسجيل بهذا الرقم القومي — تأكد من الرقم، أو تواصل مع إدارة المسابقة.</p>`;
    } else {
      const hasScores = data.oral_score!=null || data.written_score!=null || data.result_status;
      const comm=[data.examiner_1_name, data.examiner_2_name].filter(Boolean).join(' و ');
      out.innerHTML = `
      <div class="bg-cream-100 border border-cream-200 rounded-xl p-5 text-sm space-y-1.5">
        <p>المتسابق: <b>${esc(data.full_name)}</b></p>
        <p>رقم التسجيل: <b class="text-gold-600">${esc(data.reg_no)}</b></p>
        <p>المستوى: <b>${esc(data.level_name)}</b></p>
        <p>تاريخ التقديم: ${fmtDateTime(data.created_at)}</p>
      </div>
      <div class="mt-3 flex items-center gap-2 flex-wrap">
        <span class="text-xs text-ink/55">حالة الطلب:</span>
        <span class="tag tag-${esc(data.status)}">${STATUS[data.status]||esc(data.status)}</span>
      </div>
      ${data.status==='rejected'&&data.rejection_reason?`
      <div class="mt-3 bg-red-50 border border-red-300 rounded-xl p-4 leading-loose">
        <b class="text-red-800">${ic('alert',15)} سبب رفض الطلب:</b>
        <p class="text-red-900 mt-1">${esc(data.rejection_reason)}</p>
      </div>`:''}
      ${comm?`<p class="text-xs text-ink/55 mt-3">${ic('users',14)} لجنة الاختبار: ${esc(comm)}</p>`:''}
      <div class="mt-5 pt-4 border-t border-cream-200">
        <p class="font-amiri text-lg text-pine-800 mb-2">نتيجة الاختبارات</p>
        ${hasScores?`
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-white border border-cream-200 rounded-xl p-3"><small class="text-xs text-ink/55 block">الشفوي</small><b class="font-amiri text-xl text-pine-800">${data.oral_score!=null?arNum(data.oral_score):'—'}</b></div>
          <div class="bg-white border border-cream-200 rounded-xl p-3"><small class="text-xs text-ink/55 block">التحريري</small><b class="font-amiri text-xl text-pine-800">${data.written_score!=null?arNum(data.written_score):'—'}</b></div>
          <div class="bg-white border border-cream-200 rounded-xl p-3"><small class="text-xs text-ink/55 block">النتيجة</small>
            ${data.result_status==='pass'?'<span class="tag tag-approved">ناجح</span>':data.result_status==='fail'?'<span class="tag tag-rejected">راسب</span>':'<b class="font-amiri text-xl text-pine-800">—</b>'}
          </div>
        </div>
        ${data.result_status==='pass'?'<p class="text-center text-sm text-pine-700 font-bold mt-3">تقبّل الله منكم — بالتوفيق في بقية المشوار 🎉</p>':''}
        `:`<p class="text-sm text-ink/60 leading-loose">لم تُعتمد النتائج بعد — تظهر الدرجات هنا فور إدخالها واعتمادها من لجنة التحكيم.</p>`}
      </div>`;
    }
  }catch(err){
    out.innerHTML = `<p class="text-sm bg-red-50 border border-red-300 text-red-800 rounded-xl px-4 py-3 leading-loose">تعذر الاستعلام: ${esc(err.message||'حاول مرة أخرى')}</p>`;
  }finally{
    btn.disabled = false; btn.innerHTML = ic('search')+' استعلام';
  }
}

function collectForm(){
  const v = id => (($('#'+id)||{}).value||'').trim();
  return {
    full_name:v('full_name'), birth_date:v('birth_date'), national_id:v('national_id'),
    level_id:+v('level_id')||0, memorized:v('memorized'), governorate:v('governorate'),
    city:v('city'), village:v('village'), center_name:v('center_name'),
    guardian_name:v('guardian_name'), guardian_phone:v('guardian_phone'),
    notes:v('notes'), agree1:$('#agree1').checked, agree2:$('#agree2').checked
  };
}
function validateForm(d){
  const e = {};
  if (!d.full_name) e.full_name='هذا الحقل مطلوب';
  else if (d.full_name.split(/\s+/).length<4) e.full_name='اكتب الاسم رباعيًا (أربع كلمات على الأقل)';
  if (!d.birth_date) e.birth_date='هذا الحقل مطلوب';
  else if (d.birth_date>todayISO()) e.birth_date='تاريخ الميلاد لا يمكن أن يكون في المستقبل';
  if (!d.national_id) e.national_id='الرقم القومي مطلوب';
  else if (!/^[23]\d{13}$/.test(d.national_id)) e.national_id='الرقم القومي ١٤ رقمًا ويبدأ بـ ٢ أو ٣';
  else {
    const mm=+d.national_id.slice(3,5), dd=+d.national_id.slice(5,7);
    if(mm<1||mm>12||dd<1||dd>31) e.national_id='الرقم القومي غير صالح — تحقق من الأرقام';
  }
  if (!d.level_id) e.level_id='اختر مستوى المشاركة';
  else {
    const lv=S.levels.find(l=>l.id===d.level_id), age=calcAge(d.birth_date,S.config.age_ref_date);
    if (lv&&age!=null&&age>lv.max_age) e.level_id=`العمر المحسوب (${arNum(age)} عامًا) يتجاوز الحد الأقصى للمستوى «${lv.name}» (${arNum(lv.max_age)} عامًا) — اختر مستوى آخر`;
  }
  if (!d.memorized) e.memorized='اذكر مقدار ما حفظه المتسابق حتى الآن';
  if (!d.governorate) e.governorate='اختر المحافظة';
  if (!d.city) e.city='هذا الحقل مطلوب';
  if (!d.village) e.village='هذا الحقل مطلوب';
  if (!d.guardian_name) e.guardian_name='هذا الحقل مطلوب';
  if (!/^01[0125]\d{8}$/.test(d.guardian_phone)) e.guardian_phone='أدخل رقمًا مصريًا صحيحًا (11 رقمًا يبدأ بـ 010 أو 011 أو 012 أو 015)';
  if (!d.agree1) e.agree1='يلزم الإقرار بصحة البيانات لإتمام التسجيل';
  if (!d.agree2) e.agree2='يلزم الموافقة على سياسة الخصوصية';
  return e;
}
function paintErrs(errs){
  $$('#regForm .field').forEach(f=>{
    const p=f.querySelector('.err');
    if (errs[f.dataset.f]){ f.classList.add('invalid'); if(p){p.textContent=errs[f.dataset.f];p.classList.remove('hidden');} }
    else { f.classList.remove('invalid'); if(p)p.classList.add('hidden'); }
  });
}
function updateAge(){
  const el=$('#age_display'); if(!el)return;
  const a=calcAge($('#birth_date').value,S.config.age_ref_date);
  el.value=(a==null||a<0)?'':(arNum(a)+' عامًا');
}
function updateElig(){
  const box=$('#elig'); if(!box)return;
  const b=$('#birth_date').value, lid=+$('#level_id').value;
  box.className='elig'; box.innerHTML='';
  if(!b||!lid)return;
  const age=calcAge(b,S.config.age_ref_date), lv=S.levels.find(l=>l.id===lid);
  if(age==null||!lv)return;
  if(age<=lv.max_age){ box.className='elig good'; box.innerHTML=ic('check',15)+` مؤهل — العمر المحسوب ${arNum(age)} عامًا والحد الأقصى للمستوى ${arNum(lv.max_age)} عامًا`; }
  else { box.className='elig bad'; box.innerHTML=ic('alert',15)+` العمر ${arNum(age)} عامًا يتجاوز الحد الأقصى للمستوى «${esc(lv.name)}» (${arNum(lv.max_age)} عامًا) — اختر مستوى آخر`; }
}
function wireRegForm(preLevel){
  const nid = $('#national_id');
  nid.addEventListener('input', ()=>{
    nid.value = nid.value.replace(/\D/g,'').slice(0,14);
    const v = nid.value;
    if (v.length===14 && /^[23]/.test(v)){
      const yy=+v.slice(1,3), mm=+v.slice(3,5), dd=+v.slice(5,7);
      const year = (v[0]==='2'?1900:2000)+yy;
      if (mm>=1&&mm<=12&&dd>=1&&dd<=31 && !$('#birth_date').value){
        $('#birth_date').value = `${year}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
        updateAge(); updateElig();
        toast('تم تعبئة تاريخ الميلاد تلقائيًا من الرقم القومي — تأكد منه');
      }
    }
  });
  $('#birth_date').addEventListener('change',()=>{updateAge();updateElig();});
  $('#level_id').addEventListener('change',updateElig);
  if (preLevel){ updateAge(); updateElig(); }
  $('#regForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const d=collectForm(), errs=validateForm(d);
    paintErrs(errs); $('#formErr').classList.add('hidden');
    if (Object.keys(errs).length){
      const first=$('#regForm .field.invalid');
      if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
      toast('يرجى مراجعة الحقول المحددة بالأحمر','err'); return;
    }
    const btn=$('#submitBtn'), old=btn.innerHTML;
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ إرسال الطلب…';
    try {
      const payload={full_name:d.full_name,birth_date:d.birth_date,national_id:d.national_id,level_id:d.level_id,memorized:d.memorized,
        governorate:d.governorate,city:d.city,village:d.village,center_name:d.center_name||null,
        guardian_name:d.guardian_name,guardian_phone:d.guardian_phone,notes:d.notes||null};
      const {data,error}=await sb.rpc('register_participant',{r:payload});
      if(error)throw error;
      window.scrollTo({top:0});
      renderRegSuccess(d,data);
      toast('تم استلام طلب التسجيل بنجاح','ok');
    } catch(err){
      const box=$('#formErr');
      box.textContent='تعذّر إتمام التسجيل: '+(err.message||'خطأ غير متوقع — حاول مرة أخرى');
      box.classList.remove('hidden'); box.scrollIntoView({behavior:'smooth',block:'center'});
      toast('تعذّر إتمام التسجيل','err');
      btn.disabled=false; btn.innerHTML=old;
    }
  });
}

function exportCsv(){
  const rows=filteredRegs();
  if(!rows.length) return toast('لا توجد نتائج للتصدير','err');
  const H=['رقم التسجيل','تاريخ التقديم','الاسم الرباعي','الرقم القومي','تاريخ الميلاد','العمر','المستوى','مقدار الحفظ','المحافظة','المركز/المدينة','القرية/المنطقة','مركز التحفيظ/المحفظ','اسم ولي الأمر','هاتف ولي الأمر','ملاحظات المتسابق','الحالة','سبب الرفض','الممتحن الأول','الممتحن الثاني','درجة الشفوي','درجة التحريري','النتيجة النهائية','ملاحظات الإدارة'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const line=r=>[r.reg_no,r.created_at,r.full_name,r.national_id,r.birth_date,r.age,r.level_name,r.memorized,r.governorate,r.city,r.village,r.center_name,r.guardian_name,r.guardian_phone,r.notes,STATUS[r.status],r.rejection_reason,exName(r.examiner_id),exName(r.examiner_id_2),r.oral_score,r.written_score,RESULT_AR[r.result_status]||'',r.admin_notes].map(q).join(',');
  const csv='\uFEFF'+[H.map(q).join(','),...rows.map(line)].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='تسجيلات-المسابقة-'+todayISO()+'.csv';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('تم تنزيل الملف — يفتح مباشرة في Excel بترميز عربي سليم','ok');
}

async function doAssignCommittee(){
  const lv=+$('#asgLv').value, e1=+$('#asgEx1').value, e2=+$('#asgEx2').value;
  if(!lv) return toast('اختر المستوى','err');
  if(!e1||!e2) return toast('اختر ممتحنَين اثنين للجنة','err');
  if(e1===e2) return toast('لا يمكن اختيار الشيخ نفسه مرتين في اللجنة','err');
  const only=$('#asgOnly').checked;
  const affected=A.regs.filter(r=>r.level_id===lv && r.status!=='rejected' && (!only || (!r.examiner_id && !r.examiner_id_2)));
  if(!affected.length) return toast('لا يوجد متسابقون مطابقون في هذا المستوى','err');
  const lvName=(S.levels.find(l=>l.id===lv)||{}).name||'المستوى';
  modal(`<div class="m-head">تأكيد الإسناد الجماعي</div>
    <div class="m-body">سيتم إسناد لجنة الاختبار (<b>${esc(exName(e1))}</b> و<b>${esc(exName(e2))}</b>) إلى <b>${arNum(affected.length)}</b> متسابقًا في ${esc(lvName)}${only?' — مع تجاوز من لديه لجنة معينة بالفعل':''}. هل تريد المتابعة؟</div>
    <div class="m-actions"><button class="btn btn-primary" id="asgOk">تأكيد الإسناد</button><button class="btn btn-outline" data-close>إلغاء</button></div>`);
  $('#asgOk').onclick=async()=>{
    const b=$('#asgOk'); b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ الإسناد…';
    try{
      const {data,error}=await sb.rpc('assign_committee_to_level',{p_level_id:lv,p_ex1:e1,p_ex2:e2,p_only_missing:only});
      if(error)throw error;
      await loadRegs();
      closeLayer(); renderDash();
      toast('تم إسناد اللجنة إلى '+arNum(data??affected.length)+' متسابقًا','ok');
    }catch(err){ toast('تعذّر الإسناد: '+err.message,'err'); b.disabled=false; }
  };
}
async function saveExaminers(){
  readExDom();
  if ((A.examiners||[]).some(x=>!x.name)) return toast('اكتب اسم كل شيخ ممتحن','err');
  const btn=$('#saveExaminers'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ الحفظ…';
  try{
    const { data:cur, error:e1 } = await sb.from('examiners').select('id');
    if (e1) throw e1;
    const keepIds = A.examiners.filter(x=>x.id).map(x=>x.id);
    const delIds = (cur||[]).map(x=>x.id).filter(id=>!keepIds.includes(id));
    if (delIds.length){
      const { error:e2 } = await sb.from('examiners').delete().in('id', delIds);
      if (e2) throw e2;
    }
    for (const x of A.examiners.filter(x=>x.id)){
      const { error:e3 } = await sb.from('examiners').update({name:x.name, level_id:x.level_id||null, phone:x.phone||null}).eq('id', x.id);
      if (e3) throw e3;
    }
    const news = A.examiners.filter(x=>!x.id).map(x=>({name:x.name, level_id:x.level_id||null, phone:x.phone||null}));
    if (news.length){
      const { error:e4 } = await sb.from('examiners').insert(news);
      if (e4) throw e4;
    }
    await loadExaminers();
    toast('تم حفظ المشايخ الممتحنين','ok');
    renderExaminersTab();
  }catch(e){ toast('تعذّر الحفظ: '+e.message,'err'); btn.disabled=false; btn.innerHTML=ic('check')+' حفظ المشايخ'; }
}

async function saveSettings(){
  const btns=$$('#saveSettings');
  btns.forEach(b=>{b.disabled=true;b.innerHTML='<span class="spin"></span> جارٍ الحفظ…';});
  const site={...S.site,
    theme: THEME_PENDING || S.site.theme || 'taqwa',
    org_name:$('#st_org').value.trim()||S.site.org_name, partner:$('#st_partner').value.trim(),
    season:$('#st_season').value.trim()||S.site.season, title:$('#st_title').value.trim()||S.site.title,
    ayah:$('#st_ayah').value.trim(), welcome:$('#st_welcome').value.trim(),
    phone:$('#st_phone').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),
    whatsapp:$('#st_wa').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),
    address:$('#st_addr').value.trim(),
    terms:$('#st_terms').value.trim()||SITE_DEFAULTS.terms, privacy:$('#st_privacy').value.trim()||SITE_DEFAULTS.privacy};
  const config={registration_open:$('#st_open').checked, age_ref_date:$('#st_ref').value||null};
  try{
    const {error}=await sb.from('app_settings').upsert([{key:'site',value:site},{key:'config',value:config}],{onConflict:'key'});
    if(error)throw error;
    S.site=site; S.config=config; THEME_PENDING=null;
    let msg='تم حفظ الإعدادات ونشرها فورًا لجميع الزوار';
    if(config.registration_open&&!config.age_ref_date) msg+=' — تنبيه: يظل التسجيل موقوفًا حتى تحديد تاريخ احتساب العمر';
    toast(msg, config.registration_open&&!config.age_ref_date?'':'ok');
    renderSettingsTab();
  }catch(e){
    toast('تعذّر الحفظ: '+e.message,'err');
    btns.forEach(b=>{b.disabled=false;b.innerHTML=ic('check')+' حفظ ونشر';});
  }
}

document.addEventListener('click', async e=>{
  const t=e.target;
  if (t.closest('[data-close]')||t.classList.contains('overlay')){ closeLayer(); return; }
  if (t.closest('#openPrivacy')){
    modal(`<div class="m-head">سياسة الخصوصية</div><div class="m-body">${esc(S.site.privacy)}</div>
      <div class="m-actions"><button class="btn btn-outline" data-close>إغلاق</button></div>`);
    return;
  }
  const sw = t.closest('button[data-theme]');
  if (sw && sw.classList.contains('theme-swatch')){
    THEME_PENDING = sw.dataset.theme;
    applyThemeVars(THEME_PENDING);
    paintThemes();
    toast('تمت المعاينة — اضغط «حفظ ونشر» لتثبيته لجميع الزوار','ok');
    return;
  }
  const btn=t.closest('button'); if(!btn)return;

  if (btn.dataset.tab){ A.tab=btn.dataset.tab; renderDash(); return; }
  if (btn.id==='logoutBtn'){ A.regs=null; await sb.auth.signOut(); if((location.hash||'').includes('admin')) renderAdmin(); return; }

  if (btn.id==='logoBtn'){ const f=$('#logoFile'); if(f)f.click(); return; }
  if (btn.id==='logoDel'){ S.site.logo=null; updateLogoPrev(); toast('سيُحذف الشعار بعد ضغط «حفظ ونشر»'); return; }

  if (btn.classList.contains('js-lvimgbtn')){ const f=document.querySelector(`.js-lvimgfile[data-i="${btn.dataset.i}"]`); if(f)f.click(); return; }
  if (btn.classList.contains('js-lvimgdel')){ readLevelsDom(); S.levels[+btn.dataset.i].image=null; paintLevels(); return; }

  if (btn.id==='addExaminer'){ readExDom(); A.examiners.push({name:'',level_id:null,phone:''}); paintExaminers(); return; }
  if (btn.classList.contains('js-exdel')){ readExDom(); A.examiners.splice(+btn.dataset.i,1); paintExaminers(); return; }
  if (btn.id==='saveExaminers'){ saveExaminers(); return; }

  if (btn.id==='refreshRegs'){
    btn.disabled=true;
    try{ await loadRegs(); await loadExaminers().catch(()=>{}); renderDash(); toast('تم التحديث','ok'); }catch(err){ toast(err.message,'err'); btn.disabled=false; }
    return;
  }
  if (btn.id==='exportCsv'){ exportCsv(); return; }
  if (btn.classList.contains('js-view')){ openDetail(btn.dataset.id); return; }

  if (btn.id==='dSave'){
    const id=btn.dataset.id;
    const st=$('#dStatus').value;
    const rej=$('#dRej').value.trim();
    if (st==='rejected' && !rej){ toast('اكتب سبب الرفض قبل الحفظ','err'); return; }
    const ex1=+$('#dExm').value||null, ex2=+$('#dExm2').value||null;
    if (ex1&&ex2&&ex1===ex2){ toast('اختر شيخين مختلفين للجنة الاختبار','err'); return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ الحفظ…';
    try{
      const patch={
        status: st,
        rejection_reason: st==='rejected' ? rej : null,
        admin_notes: $('#dNote').value.trim(),
        national_id: $('#dNid').value.replace(/\D/g,'') || null,
        examiner_id: ex1,
        examiner_id_2: ex2,
        oral_score: $('#dOral').value==='' ? null : +$('#dOral').value,
        written_score: $('#dWritten').value==='' ? null : +$('#dWritten').value,
        result_status: $('#dRes').value || null
      };
      const {error}=await sb.from('registrations').update(patch).eq('id',id);
      if(error)throw error;
      const r=A.regs.find(x=>x.id===id); if(r) Object.assign(r,patch);
      toast('تم حفظ التفاصيل — تظهر فورًا في بوابة المتابعة','ok'); closeLayer(); renderTab();
    }catch(err){ toast('تعذّر الحفظ: '+err.message,'err'); btn.disabled=false; btn.innerHTML=ic('check',15)+' حفظ'; }
    return;
  }

  if (btn.classList.contains('js-del')){
    const id=btn.dataset.id, r=A.regs.find(x=>x.id===id)||{};
    closeLayer();
    modal(`<div class="m-head">حذف التسجيل نهائيًا</div>
      <div class="m-body">هل أنت متأكد من حذف تسجيل <b>${esc(r.full_name||'')}</b> رقم <b>${esc(r.reg_no||'')}</b>؟ لا يمكن التراجع.</div>
      <div class="m-actions"><button class="btn btn-danger" id="mDelOk">${ic('trash',15)} حذف نهائي</button><button class="btn btn-outline" data-close>إلغاء</button></div>`);
    $('#mDelOk').onclick=async()=>{
      const b=$('#mDelOk'); b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ الحذف…';
      try{
        const {error}=await sb.from('registrations').delete().eq('id',id);
        if(error)throw error;
        A.regs=A.regs.filter(x=>x.id!==id);
        toast('تم الحذف نهائيًا','ok'); closeLayer(); renderDash();
      }catch(err){ toast('تعذّر الحذف: '+err.message,'err'); b.disabled=false; }
    };
    return;
  }

  if (btn.id==='addLevel'){ readLevelsDom(); S.levels.push({name:'مستوى جديد',desc:'',max_age:10,color:LEVEL_COLORS[S.levels.length%LEVEL_COLORS.length],image:null}); paintLevels(); return; }
  if (btn.classList.contains('js-lvup')){ readLevelsDom(); const i=+btn.dataset.i; if(i>0){const tmp=S.levels[i];S.levels[i]=S.levels[i-1];S.levels[i-1]=tmp;paintLevels();} return; }
  if (btn.classList.contains('js-lvdown')){ readLevelsDom(); const i=+btn.dataset.i; if(i<S.levels.length-1){const tmp=S.levels[i];S.levels[i]=S.levels[i+1];S.levels[i+1]=tmp;paintLevels();} return; }
  if (btn.classList.contains('js-lvdel')){ readLevelsDom(); if(S.levels.length<=1)return toast('أبقِ مستوى واحدًا على الأقل','err'); S.levels.splice(+btn.dataset.i,1); paintLevels(); return; }
  if (btn.id==='saveLevels'){ saveLevels(); return; }
  if (btn.id==='saveSettings'){ saveSettings(); return; }

  const base = siteBase();
  if (btn.id==='copyRegLink'||btn.id==='copyTrackLink'||btn.id==='copyInvite'){
    if(!base) return toast('الروابط متاحة بعد نشر المنصة على استضافة','err');
    if(btn.id==='copyRegLink') return copyText(base+'#/register','تم نسخ رابط التسجيل');
    if(btn.id==='copyTrackLink') return copyText(base+'#/track','تم نسخ رابط بوابة المتابعة');
    const inv=`المسابقة الكبرى لحفظ القرآن الكريم — موسم ${S.site.season}\n${S.site.org_name}\n${S.site.partner}\nخمسة مستويات تناسب مقدار الحفظ والعمر — التسجيل متاح عبر الرابط:\n${base}#/register`;
    return copyText(inv,'تم نسخ نص الدعوة — الصقه في واتساب أو فيسبوك');
  }
});
document.addEventListener('change', async e=>{
  const t=e.target;
  if(!t||!t.closest)return;
  const sel=t.closest('select.js-status');
  if (sel){
    const rid=sel.dataset.id, val=sel.value;
    const r=A.regs.find(x=>x.id===rid)||{};
    if (val==='rejected'){
      sel.value = r.status || 'pending';
      modal(`<div class="m-head">سبب رفض الطلب</div>
        <div class="m-body">المتسابق: <b>${esc(r.full_name||'')}</b><br>اكتب سبب الرفض — سيظهر لولي الأمر في بوابة المتابعة بالرقم القومي:</div>
        <textarea id="mRejReason" rows="3" class="input mt-3" placeholder="مثال: تجاوز الحد العمري للمستوى المختار"></textarea>
        <div class="m-actions"><button class="btn btn-danger" id="mRejOk">${ic('x',15)} رفض الطلب</button><button class="btn btn-outline" data-close>إلغاء</button></div>`);
      $('#mRejOk').onclick=async()=>{
        const reason=($('#mRejReason').value||'').trim();
        if(!reason){ toast('اكتب سبب الرفض أولًا','err'); return; }
        const b=$('#mRejOk'); b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ…';
        try{
          const {error}=await sb.from('registrations').update({status:'rejected',rejection_reason:reason}).eq('id',rid);
          if(error)throw error;
          const rr=A.regs.find(x=>x.id===rid); if(rr){rr.status='rejected';rr.rejection_reason=reason;}
          toast('تم رفض الطلب مع تسجيل السبب','ok'); closeLayer(); renderTab();
        }catch(err){ toast('تعذّر: '+err.message,'err'); b.disabled=false; }
      };
      return;
    }
    sel.disabled=true;
    try{
      const patch={status:val}; if(val!=='rejected') patch.rejection_reason=null;
      const {error}=await sb.from('registrations').update(patch).eq('id',rid);
      if(error)throw error;
      const rr=A.regs.find(x=>x.id===rid); if(rr){rr.status=val;if(val!=='rejected')rr.rejection_reason=null;}
      toast('تم تحديث الحالة إلى: '+STATUS[val],'ok');
      renderTab();
    }catch(err){ toast('تعذّر التحديث: '+err.message,'err'); sel.disabled=false; }
    return;
  }
  if (t.id==='logoFile' && t.files && t.files[0]){
    try{ S.site.logo=await pickImage(t.files[0],360,true); updateLogoPrev(); toast('تم تجهيز الشعار — اضغط «حفظ ونشر» لتثبيته','ok'); }
    catch(err){ toast((err&&err.message)||'تعذر قراءة الصورة','err'); }
    t.value=''; return;
  }
  const lvf=t.closest('.js-lvimgfile');
  if (lvf && lvf.files && lvf.files[0]){
    const i=+lvf.dataset.i;
    try{ readLevelsDom(); S.levels[i].image=await pickImage(lvf.files[0],640,false); paintLevels(); toast('تم تجهيز الصورة — اضغط «حفظ المستويات» لتثبيتها','ok'); }
    catch(err){ toast((err&&err.message)||'تعذر قراءة الصورة','err'); }
    lvf.value=''; return;
  }
});
if (sb) sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT'&&(location.hash||'').includes('admin')) renderAdmin(); });
