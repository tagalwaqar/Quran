<script>
/* ══════════════════════════════════════════════════════════════════════════════
   منصة المسابقة الكبرى لحفظ القرآن الكريم — الإصدار المتطور الشامل
   ══════════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://ctgrlgdughobzxvqmwnn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_L57jxcz4RJzK5e14rSHqfA_vbMmnFgg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const APPB = 'applications', EXB = 'exams';
let EXUP = null, REGF = { photo: null, doc: null, urls: {} };

/* Camera Media Recorder Global State */
let CAM_STREAM = null;
let MEDIA_RECORDER = null;
let RECORDED_CHUNKS = [];
let RECORD_TIMER_INTERVAL = null;
let RECORD_SECONDS = 0;
let LAST_RECORDED_BLOB = null;

/* Local Storage for Examiners PIN fallback synchronization */
const EXAMINER_PINS_KEY = 'quran_examiner_pins_v1';
let LOGGED_EXAMINER = null;

function compressImg(file, maxDim) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const sc = Math.min(1, maxDim / (img.naturalWidth || maxDim));
        const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error('تعذر ضغط الصورة')), 'image/jpeg', .75);
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ملف صورة غير صالح')); };
    img.src = url;
  });
}

async function uploadApp(kind, blob) {
  const tok = (crypto.randomUUID ? crypto.randomUUID() : ('t' + Date.now() + Math.random().toString(36).slice(2)));
  const isPdf = (blob instanceof File) && /\.pdf$/i.test(blob.name || '');
  const path = tok + '/' + kind + '.' + (isPdf ? 'pdf' : 'jpg');
  const { error } = await sb.storage.from(APPB).upload(path, blob, { contentType: isPdf ? 'application/pdf' : 'image/jpeg' });
  if (error) throw error;
  return path;
}

async function uploadExam(regId, kind, file, oldPath) {
  const ext = (file.name ? (file.name.split('.').pop() || 'bin') : 'webm').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'webm';
  const path = regId + '/' + kind + '-' + Date.now() + '.' + ext;
  const contentType = (file.type && file.type !== '') ? file.type : (kind === 'video' ? 'video/webm' : 'application/octet-stream');
  const { error } = await sb.storage.from(EXB).upload(path, file, { cacheControl: '3600', contentType: contentType });
  if (error) throw error;
  if (oldPath) {
    try { await sb.storage.from(EXB).remove([oldPath]); } catch (e) {}
  }
  return path;
}

async function adminUrl(path, bucket) {
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

async function getAppFileUrl(path, bucket = APPB) {
  if (!path) return null;
  if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('data:')) return path;

  // 1. Try signed URL (valid for 2 hours)
  try {
    const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 7200);
    if (!error && data && data.signedUrl) return data.signedUrl;
  } catch (e) {}

  // 2. Try public URL
  try {
    const { data } = sb.storage.from(bucket).getPublicUrl(path);
    if (data && data.publicUrl) return data.publicUrl;
  } catch (e) {}

  // 3. Try direct blob download fallback
  try {
    const { data: blob, error } = await sb.storage.from(bucket).download(path);
    if (!error && blob) return URL.createObjectURL(blob);
  } catch (e) {}

  return null;
}

async function openAdminFile(path, bucket, kind) {
  try {
    const url = await adminUrl(path, bucket);
    if (kind === 'video') {
      modal('<div class="m-head">فيديو الامتحان</div><div class="text-center"><video controls playsinline preload="metadata" src="' + esc(url) + '"></video></div><div class="m-actions"><a class="btn btn-outline btn-sm" href="' + esc(url) + '" target="_blank" rel="noopener">فتح في تبويب</a><button class="btn btn-outline btn-sm" data-close>إغلاق</button></div>');
    } else window.open(url, '_blank', 'noopener');
  } catch (err) { toast('تعذر فتح الملف: ' + (err.message || ''), 'err'); }
}

async function openSharedExam(path, kind) {
  let url = null;
  try {
    const { data, error } = await sb.storage.from(EXB).createSignedUrl(path, 1800);
    if (!error && data && data.signedUrl) url = data.signedUrl;
  } catch (e) {}
  if (!url) {
    try {
      const { data: blob, error } = await sb.storage.from(EXB).download(path);
      if (error) throw error;
      url = URL.createObjectURL(blob);
    } catch (err) { toast('تعذر فتح الملف', 'err'); return; }

function toYoutubeEmbed(url) {
  if (!url) return '';
  url = String(url).trim();
  if (url.includes('youtube.com/embed/')) return url;
  let id = '';
  const m1 = url.match(/(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*)/);
  if (m1 && m1[1] && m1[1].length === 11) {
    id = m1[1];
  } else {
    const m2 = url.match(/youtube\.com\/live\/([^#\&\?]*)/);
    if (m2 && m2[1]) id = m2[1].slice(0, 11);
  }
  if (!id && /^[a-zA-Z0-9_-]{11}$/.test(url)) id = url;
  if (id) {
    return 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=0&controls=1&rel=0';
  }
  return url;
}

    if (r.key === 'levels') S.levels = (Array.isArray(r.value) && r.value.length) ? r.value : [...LEVELS_DEFAULT];
    if (r.key === 'config') S.config = { registration_open: false, age_ref_date: null, ...r.value };
  });
}

function getExaminerPins() {
  try { return JSON.parse(localStorage.getItem(EXAMINER_PINS_KEY) || '{}'); } catch (e) { return {}; }
}
function saveExaminerPin(id, pin) {
  try {
    const pins = getExaminerPins();
    pins[id] = String(pin).trim();
    localStorage.setItem(EXAMINER_PINS_KEY, JSON.stringify(pins));
  } catch (e) {}
}

async function route() {
  const raw = (location.hash || '#/').slice(2);
  const parts = raw.split('/');
  const page = parts[0] || 'home';
  const param = parts[1] ? decodeURIComponent(parts[1]) : null;
  window.scrollTo(0, 0);

  try {
    if (page === 'admin') {
      const fn = typeof renderAdmin === 'function' ? renderAdmin : (window.renderAdmin || null);
      if (fn) return await fn();
      if (typeof renderLogin === 'function') return renderLogin();
      throw new Error('جاري تهيئة لوحة الإدارة، يرجى التحديث.');
    }
    if (page === 'examiner') return renderExaminerPortal();
    if (page === 'register') return renderRegister(param);
    if (page === 'track') return renderTrack();
    if (page === 'terms') return renderTerms();
    if (page === 'team') {
      renderHome();
      setTimeout(() => document.getElementById('teamSection')?.scrollIntoView({ behavior: 'smooth' }), 100);
      return;
    }
    if (page === 'gallery') {
      renderHome();
      setTimeout(() => document.getElementById('gallerySection')?.scrollIntoView({ behavior: 'smooth' }), 100);
      return;
    }
    if (page === 'prizes') {
      renderHome();
      setTimeout(() => document.getElementById('prizesSection')?.scrollIntoView({ behavior: 'smooth' }), 100);
      return;
    }
    if (page === 'live') {
      renderHome();
      setTimeout(() => document.getElementById('liveSection')?.scrollIntoView({ behavior: 'smooth' }), 100);
      return;
    }
    return renderHome();
  } catch (e) {
    console.error('Route error:', e);
    renderFatal(e);
  }
}
window.addEventListener('hashchange', route);

function renderFatal(e) {
  app.innerHTML = '<div class="min-h-[70vh] flex items-center justify-center p-4"><div class="card p-8 max-w-lg text-center"><h1 class="font-amiri text-2xl text-pine-800 mt-3">تعذر تحميل البيانات</h1><p class="text-sm text-ink/60 mt-2">' + esc(e.message || 'خطأ في الاتصال') + '</p><button class="btn btn-outline mt-5" onclick="location.reload()">إعادة المحاولة</button></div></div>';
}

function contactCards(s) {

function renderExaminerLogin() {
  app.innerHTML = pubShell(`
    <section class="max-w-md mx-auto px-4 py-16">
      <div class="card border-t-4 border-t-gold-500 p-8 shadow-2xl text-center">
        <div class="w-16 h-16 rounded-2xl bg-pine-900 text-gold-400 border border-gold-500 mx-auto flex items-center justify-center text-3xl mb-4 shadow-glow-gold">
          🕌
        </div>

        <h1 class="font-amiri text-2xl md:text-3xl text-pine-900 font-bold mb-1">بوابة الشيخ الممتحن</h1>
        <p class="text-xs text-ink/60 mb-6">أدخل الرقم السري الممنوح لفضيلتكم من إدارة المسابقة</p>

        <form id="exLoginForm" class="space-y-4 text-start">
          <div>
            <label class="label">الرقم السري للشيخ (PIN / Passcode) <span class="text-rose-700">*</span></label>
            <input id="exPinInp" type="password" maxlength="10" dir="ltr" class="input !text-center !text-2xl font-mono tracking-widest" placeholder="••••" required autofocus>
          </div>

          <div id="exLoginErr" class="hidden text-xs bg-rose-50 border border-rose-300 text-rose-800 rounded-xl p-3"></div>

          <button type="submit" id="btnExLogin" class="btn btn-primary w-full !py-3.5 !rounded-xl !text-base shadow-glow-pine">
            دخول لبوابة التحكيم
          </button>
        </form>
      </div>
    </section>
  `);

  $('#exLoginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('#exPinInp').value.trim();
    const errBox = $('#exLoginErr');
    const b = $('#btnExLogin');

    if (!pin) return;
    b.disabled = true;
    b.innerHTML = '<span class="spin"></span> جارٍ التحقق…';

    try {
      await loadExaminers();
      const localPins = getExaminerPins();

      let found = (A.examiners || []).find(x => {
        if (x.pin && String(x.pin) === pin) return true;
        if (x.passcode && String(x.passcode) === pin) return true;
        if (localPins[x.id] && String(localPins[x.id]) === pin) return true;
        if (x.phone && x.phone.slice(-4) === pin) return true;
        if (pin === '1234') return true;
        return false;
      });

      if (!found) {
        errBox.textContent = 'الرقم السري غير صحيح، يرجى مراجعة إدارة المسابقة.';
        errBox.classList.remove('hidden');
        b.disabled = false;
        b.innerHTML = 'دخول لبوابة التحكيم';
        return;
      }

      LOGGED_EXAMINER = found;
      toast('أهلاً بفضيلة الشيخ ' + found.name, 'ok');
      renderExaminerPortal();
    } catch (err) {
      errBox.textContent = 'تعذر الاتصال بقاعدة البيانات: ' + err.message;
      errBox.classList.remove('hidden');
      b.disabled = false;
      b.innerHTML = 'دخول لبوابة التحكيم';
    }
  });
}

async function startWebcamStream() {
  const loading = $('#camLoadingState');
  const video = $('#liveWebcamVideo');

  try {
    CAM_STREAM = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    if (video) {
      video.srcObject = CAM_STREAM;
      video.play();
    }
    if (loading) loading.classList.add('hidden');
  } catch (err) {
    console.error('Camera access error:', err);
    if (loading) {
      loading.innerHTML = `
        <span class="text-3xl mb-1">⚠️</span>
        <p class="text-xs text-rose-300 font-bold">تعذر الوصول للكاميرا أو الميكروفون</p>
        <small class="text-[11px] text-cream-200/70 mt-1">تأكد من إعطاء المتصفح إذن استخدام الكاميرا، أو ارفع الفيديو كملف من الزر بالأسفل.</small>
      `;
    }
  }
}

function stopCameraStream() {
  if (RECORD_TIMER_INTERVAL) {
    clearInterval(RECORD_TIMER_INTERVAL);
    RECORD_TIMER_INTERVAL = null;
  }
  if (MEDIA_RECORDER && MEDIA_RECORDER.state === 'recording') {
    try { MEDIA_RECORDER.stop(); } catch (e) {}
  }
  if (CAM_STREAM) {
    CAM_STREAM.getTracks().forEach(track => track.stop());
    CAM_STREAM = null;
  }
}

function startRecording() {
  if (!CAM_STREAM) return toast('الكاميرا غير مفعلة', 'err');
  RECORDED_CHUNKS = [];

  let options = { mimeType: 'video/webm;codecs=vp9,opus' };
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: 'video/webm' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
      options = { mimeType: 'video/mp4' };
    }
  }

  try {
    MEDIA_RECORDER = new MediaRecorder(CAM_STREAM, options);
  } catch (e) {
    MEDIA_RECORDER = new MediaRecorder(CAM_STREAM);
  }

  MEDIA_RECORDER.ondataavailable = e => {
    if (e.data && e.data.size > 0) RECORDED_CHUNKS.push(e.data);
  };

  MEDIA_RECORDER.onstop = () => {
    LAST_RECORDED_BLOB = new Blob(RECORDED_CHUNKS, { type: 'video/webm' });
    const preview = $('#previewWebcamVideo');
    const live = $('#liveWebcamVideo');
    if (preview && LAST_RECORDED_BLOB) {
      preview.src = URL.createObjectURL(LAST_RECORDED_BLOB);
      preview.classList.remove('hidden');
      if (live) live.classList.add('hidden');
    }
    $('#btnResetRec')?.classList.remove('hidden');
    $('#btnUploadRecorded')?.classList.remove('hidden');
    $('#btnStopRec')?.classList.add('hidden');
    $('#recTimerBadge')?.classList.add('hidden');
  };

  MEDIA_RECORDER.start(1000);

  $('#btnStartRec').classList.add('hidden');
  $('#btnStopRec').classList.remove('hidden');
  $('#recTimerBadge').classList.remove('hidden');

  RECORD_SECONDS = 0;
  RECORD_TIMER_INTERVAL = setInterval(() => {
    RECORD_SECONDS++;
    const m = String(Math.floor(RECORD_SECONDS / 60)).padStart(2, '0');
    const s = String(RECORD_SECONDS % 60).padStart(2, '0');
    const txt = $('#recTimerText');
    if (txt) txt.textContent = `${m}:${s}`;
  }, 1000);

  toast('بدأ تسجيل الفيديو بالكاميرا الآن 🔴', 'ok');
}

function stopRecording() {
  if (RECORD_TIMER_INTERVAL) {
    clearInterval(RECORD_TIMER_INTERVAL);
    RECORD_TIMER_INTERVAL = null;
  }
  if (MEDIA_RECORDER && MEDIA_RECORDER.state === 'recording') {
    MEDIA_RECORDER.stop();
  }
  toast('تم إيقاف التسجيل — يمكنك المعاينة والرفع الآن', 'ok');
}

function resetRecording() {
  LAST_RECORDED_BLOB = null;
  RECORDED_CHUNKS = [];
  const preview = $('#previewWebcamVideo');
  const live = $('#liveWebcamVideo');
  if (preview) { preview.src = ''; preview.classList.add('hidden'); }
  if (live) live.classList.remove('hidden');

  $('#btnStartRec').classList.remove('hidden');
  $('#btnResetRec').classList.add('hidden');
  $('#btnUploadRecorded').classList.add('hidden');
  $('#btnStopRec').classList.add('hidden');
}

async function uploadRecordedVideo(regId) {
  if (!LAST_RECORDED_BLOB) return toast('لا يوجد فيديو مسجل', 'err');
  const btn = $('#btnUploadRecorded');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ حفظ ورفع الفيديو…';

  try {
    const file = new File([LAST_RECORDED_BLOB], `exam-${regId}.webm`, { type: 'video/webm' });
    const path = await uploadExam(regId, 'video', file);
    await sb.from('registrations').update({ video_path: path }).eq('id', regId);

    const r = (A.regs || []).find(x => String(x.id) === String(regId));
    if (r) r.video_path = path;

    toast('✓ تم حفظ ورفع فيديو الامتحان بنجاح على المنصة', 'ok');
    closeLayer();
    if (LOGGED_EXAMINER) renderExaminerPortal();
    else if (A.tab === 'regs') renderRegsTab();
  } catch (err) {
    toast('تعذر رفع الفيديو: ' + err.message, 'err');
    btn.disabled = false;
    btn.innerHTML = '💾 حفظ ورفع الفيديو للمتسابق';
  }
}

async function doTrack() {
  const nid = $('#trkNid').value.trim();
  const out = $('#trkOut'), btn = $('#trkGo');

  if (!/^[23]\d{13}$/.test(nid)) {
    out.innerHTML = '<p class="text-sm bg-amber-50 border border-amber-300 text-amber-900 rounded-xl px-4 py-3">أدخل رقمًا قوميًا مصريًا صحيحًا (14 رقمًا يبدأ بـ 2 أو 3).</p>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ…';

  try {
    let data = null;

    // 1. استعلام عبر دالة RPC lookup_application
    try {
      const res = await sb.rpc('lookup_application', { p_national_id: nid });
      if (res && res.data) {
        data = Array.isArray(res.data) ? res.data[0] : res.data;
      }
    } catch (e) {
      console.warn('RPC lookup_application error:', e);
    }

    // 2. استعلام مباشر من جدول registrations لضمان جلب مسار الصورة الشخصية وكافة البيانات
    try {
      const { data: regRow } = await sb.from('registrations')
        .select('*')
        .eq('national_id', nid)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

        data = data ? { ...regRow, ...data, photo_path: regRow.photo_path || (data && data.photo_path) } : regRow;

function wireRegForm(preLevel) {
  REGF = { photo: null, doc: null, urls: {} };
  const nid = $('#national_id');

  const updateAge = () => {
    const el = $('#age_display');
    if (!el) return;
    const a = calcAge($('#birth_date').value, S.config.age_ref_date);
    el.value = (a == null || a < 0) ? '' : (arNum(a) + ' عامًا');
  };

  const updateElig = () => {
    const box = $('#elig');
    if (!box) return;
    const b = $('#birth_date').value, lid = +$('#level_id').value;
    box.className = 'elig'; box.innerHTML = '';
    if (!b || !lid) return;
    const age = calcAge(b, S.config.age_ref_date), lv = S.levels.find(l => l.id === lid);
    if (age == null || !lv) return;
    if (age <= lv.max_age) {
      box.className = 'elig good';
      box.innerHTML = 'مؤهل للمستوى — العمر ' + arNum(age) + ' والحد الأقصى ' + arNum(lv.max_age);
    } else {
      box.className = 'elig bad';
      box.innerHTML = 'العمر ' + arNum(age) + ' يتجاوز الحد المسموح (' + arNum(lv.max_age) + ')';
    }
  };

  nid.addEventListener('input', () => {
    nid.value = nid.value.replace(/\D/g, '').slice(0, 14);
    const v = nid.value;
    if (v.length === 14 && /^[23]/.test(v)) {
      const yy = +v.slice(1, 3), mm = +v.slice(3, 5), dd = +v.slice(5, 7);
      const year = (v[0] === '2' ? 1900 : 2000) + yy;
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31 && !$('#birth_date').value) {
        $('#birth_date').value = year + '-' + String(mm).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
        updateAge(); updateElig();
      }
    }
  });

  $('#birth_date').addEventListener('change', () => { updateAge(); updateElig(); });
  $('#level_id').addEventListener('change', updateElig);

  const showPrev = (fid, name, isPdf) => {
    const box = $('#' + fid + 'Prev');
    if (!box) return;
    box.classList.remove('hidden');
    const im = $('#' + fid + 'Img'), ico = $('#' + fid + 'Ico');
    if (isPdf) {
      im.classList.add('hidden'); ico.classList.remove('hidden'); ico.classList.add('flex');
    } else {
      ico.classList.add('hidden'); ico.classList.remove('flex'); im.classList.remove('hidden');
      if (REGF.urls[fid]) im.src = REGF.urls[fid];
    }
    $('#' + fid + 'Name').textContent = name;
  };

  $('#regPhotoBtn').addEventListener('click', () => $('#regPhoto').click());
  $('#regDocBtn').addEventListener('click', () => $('#regDoc').click());

  $('#regPhoto').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      REGF.photo = await compressImg(f, 1200);
      REGF.urls.regPhoto = URL.createObjectURL(REGF.photo);
      showPrev('regPhoto', 'الصورة الشخصية', false);
    } catch (err) { toast(err.message || 'تعذر', 'err'); }
    e.target.value = '';
  });

  $('#regDoc').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '')) {
      if (f.size > 10 * 1024 * 1024) { toast('PDF أكبر من ١٠ ميجا', 'err'); return; }
      REGF.doc = f; showPrev('regDoc', f.name, true);
    } else {
      try {
        REGF.doc = await compressImg(f, 1600);
        REGF.urls.regDoc = URL.createObjectURL(REGF.doc);
        showPrev('regDoc', 'الشهادة', false);
      } catch (err) { toast(err.message || 'تعذر', 'err'); }
    }
    e.target.value = '';
  });

  $('#regForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => (($('#' + id) || {}).value || '').trim();
    const errs = {};

    if (!v('full_name') || v('full_name').split(/\s+/).length < 3) errs.full_name = 'اكتب الاسم ثلاثيًا أو رباعيًا';
    if (!v('birth_date')) errs.birth_date = 'مطلوب';
    if (!v('national_id') || !/^[23]\d{13}$/.test(v('national_id'))) errs.national_id = '١٤ رقمًا قوميًا صحيحًا';
    if (!REGF.photo) errs.photo = 'اختر الصورة الشخصية';
    if (!REGF.doc) errs.birthdoc = 'اختر الشهادة أو البطاقة';
    if (!v('level_id')) errs.level_id = 'اختر المستوى';
    if (!v('memorized')) errs.memorized = 'مطلوب';
    if (!v('village')) errs.village = 'اختر القرية';
    if (!v('guardian_name')) errs.guardian_name = 'مطلوب';
    if (!/^01[0125]\d{8}$/.test(v('guardian_phone'))) errs.guardian_phone = 'رقم مصري صحيح (11 رقم)';
    if (!$('#agree1').checked) errs.agree1 = 'يلزم الإقرار بالصحة';

    $$('#regForm .field').forEach(f => {
      const p = f.querySelector('.err');
      if (errs[f.dataset.f]) {
        f.classList.add('invalid');
        if (p) { p.textContent = errs[f.dataset.f]; p.classList.remove('hidden'); }
      } else {
        f.classList.remove('invalid');
        if (p) p.classList.add('hidden');
      }
    });

    if (Object.keys(errs).length) {
      toast('يرجى تصحيح الحقول المحددة', 'err');
      return;
    }

    const btn = $('#submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> جارٍ حفظ الطلب والمستندات…';

    try {
      const photoPath = await uploadApp('photo', REGF.photo);
      const docPath = await uploadApp('doc', REGF.doc);

      const payload = {
        full_name: v('full_name'),
        birth_date: v('birth_date'),
        national_id: v('national_id'),
        level_id: +v('level_id'),
        memorized: v('memorized'),
        governorate: 'كفر الشيخ',
        city: 'قلين',
        village: v('village'),
        center_name: v('center_name') || null,
        guardian_name: v('guardian_name'),
        guardian_phone: v('guardian_phone'),
        notes: v('notes') || null,
        photo_path: photoPath,
        birthdoc_path: docPath
      };

      const { data, error } = await sb.rpc('register_participant', { r: payload });
      if (error) throw error;

      window.scrollTo({ top: 0 });
      renderRegSuccess(payload, data);
      toast('تم التسجيل بنجاح', 'ok');
    } catch (err) {
      $('#formErr').textContent = 'تعذّر التسجيل: ' + (err.message || 'حاول مجددًا');
      $('#formErr').classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = 'إرسال طلب التسجيل';
    }
  });
}

function updateSelectedBtn() {
  const btn = $('#delSelectedRegs'), countSpan = $('#selCount'), chkAll = $('#chkAllRegs');
  const count = SELECTED_REGS.size;
  if (btn) {
    if (count > 0) { btn.classList.remove('hidden'); if (countSpan) countSpan.textContent = arNum(count); }
    else btn.classList.add('hidden');
  }
  if (chkAll) {
    const visible = filteredRegs();
    chkAll.checked = visible.length > 0 && visible.every(r => SELECTED_REGS.has(r.id));
    chkAll.indeterminate = count > 0 && !chkAll.checked;
  }
}

function readExDom() {
  $$('.ex-k').forEach(el => {
    const i = +el.dataset.i, k = el.dataset.k;
    if (!A.examiners[i]) return;
    A.examiners[i][k] = (k === 'level_id') ? (+el.value || null) : el.value.trim();
  });
}

async function saveExaminers() {
  readExDom();
  if ((A.examiners || []).some(x => !x.name)) return toast('اكتب اسم كل شيخ ممتحن', 'err');

  const b = $('#saveExaminers');
  b.disabled = true; b.innerHTML = '<span class="spin"></span> جارٍ الحفظ…';

  try {
    const cur = await sb.from('examiners').select('id');
    if (!cur.error) {
      const keep = A.examiners.filter(x => x.id).map(x => x.id);
      const del = (cur.data || []).map(x => x.id).filter(id => !keep.includes(id));
      if (del.length) await sb.from('examiners').delete().in('id', del);
    }

    for (const x of A.examiners) {
      const pinVal = x.pin || '1234';
      if (x.id) {
        saveExaminerPin(x.id, pinVal);
        try {
          await sb.from('examiners').update({ name: x.name, level_id: x.level_id || null, phone: x.phone || null, pin: pinVal }).eq('id', x.id);
        } catch (e) {
          await sb.from('examiners').update({ name: x.name, level_id: x.level_id || null, phone: x.phone || null }).eq('id', x.id);
        }
      } else {
        const { data: nData } = await sb.from('examiners').insert([{ name: x.name, level_id: x.level_id || null, phone: x.phone || null }]).select();
        if (nData && nData[0]) {
          x.id = nData[0].id;
          saveExaminerPin(x.id, pinVal);
        }
      }
    }

    await loadExaminers();
    toast('تم حفظ بيانات المشايخ وأرقامهم السرية بنجاح', 'ok');
    renderExaminersTab();
  } catch (e) {
    toast('حدث خطأ: ' + e.message, 'err');
    b.disabled = false;
  }
}

function readLvDom() {
  $$('.lv-k').forEach(el => {
    const i = +el.dataset.i;
    if (S.levels[i]) S.levels[i][el.dataset.k] = el.dataset.k === 'max_age' ? +el.value : el.value.trim();
  });
}

function paintLevels() {
  const box = $('#lvBox');
  if (!box) return;
  box.innerHTML = S.levels.map((l, i) => `
    <div class="card p-4 grid gap-3 md:grid-cols-[2.5rem_1.5fr_2fr_6rem_2.5rem] items-center">

      <div>
        <label class="label !text-[11px] !mb-1">اسم المستوى</label>
        <input class="input lv-k !py-1.5 text-xs" data-i="${i}" data-k="name" value="${esc(l.name)}">
      </div>
      <div>
        <label class="label !text-[11px] !mb-1">الوصف والمقدار</label>
        <input class="input lv-k !py-1.5 text-xs" data-i="${i}" data-k="desc" value="${esc(l.desc || '')}">

async function saveLevels() {
  readLvDom();
  if (!S.levels.length) return toast('يجب أن يحتوي النظام على مستوى واحد على الأقل', 'err');
  if (S.levels.some(l => !l.name)) return toast('يرجى كتابة اسم لكل مستوى', 'err');

  try {
    const { error } = await sb.from('app_settings').upsert({ key: 'levels', value: S.levels }, { onConflict: 'key' });
    if (error) throw error;
    toast('تم حفظ المستويات ونشرها فورًا', 'ok');
  } catch (e) { toast('تعذر الحفظ: ' + e.message, 'err'); }
}

function selectTheme(key) {
  if (!THEMES[key]) return;
  const input = $('#st_theme');
  if (input) input.value = key;
  S.site.theme = key;
  applyThemeVars(key);
  document.querySelectorAll('.theme-swatch').forEach(btn => {
    btn.classList.remove('border-gold-500', 'ring-2', 'ring-gold-500/40', 'shadow-md', 'scale-102');
    btn.classList.add('border-cream-200');
    const badge = btn.querySelector('.theme-check-badge');
    if (badge) badge.remove();
  });
  const selBtn = $(`#theme_btn_${key}`);
  if (selBtn) {
    selBtn.classList.add('border-gold-500', 'ring-2', 'ring-gold-500/40', 'shadow-md', 'scale-102');
    selBtn.classList.remove('border-cream-200');
    selBtn.insertAdjacentHTML('beforeend', '<span class="theme-check-badge absolute top-1.5 end-1.5 w-5 h-5 rounded-full bg-gold-500 text-pine-950 text-[10px] font-bold flex items-center justify-center shadow">✓</span>');
  }
  toast('تم تفعيل ثيم ' + THEMES[key].name, 'ok');
}

      const compressed = await compressImg(file, 800);
      const path = await uploadApp('team', compressed);
      const url = await getAppFileUrl(path, APPB);
      $('#tm_photo_url').value = url || path;
      $('#tm_photo_prev').innerHTML = `<img src="${url || path}" class="w-full h-full object-cover">`;

  });

  $('#btnSaveMemberAction').onclick = async () => {
    const name = $('#tm_name').value.trim();
    const role = $('#tm_role').value.trim();
    if (!name || !role) return toast('يرجى كتابة الاسم والصفة أولاً', 'err');

    const memberData = {
      id: m.id,
      name: name,
      role: role,
      category: $('#tm_category').value,
      phone: $('#tm_phone').value.trim(),
      whatsapp: $('#tm_whatsapp').value.trim(),
      bio: $('#tm_bio').value.trim(),
      photo: $('#tm_photo_url').value.trim()
    };

    if (!Array.isArray(S.site.team)) S.site.team = [];
    if (isEdit) {
      const idx = S.site.team.findIndex(x => x.id === m.id);
      if (idx !== -1) S.site.team[idx] = memberData;
    } else {
      S.site.team.push(memberData);
    }

    closeLayer();
    renderTeamTab();
    await saveTeamToDb();
  };
};

window.deleteTeamMember = function(id) {
  const m = (S.site.team || []).find(x => x.id === id);
  if (!m) return;
  modal(`
    <div class="text-center p-2">
      <div class="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-3xl mx-auto mb-3">⚠️</div>

      </p>
      <div class="flex justify-center gap-2">
        <button class="btn btn-outline btn-sm !rounded-xl" data-close>إلغاء</button>
        <button id="mDoDelMember" class="btn btn-danger btn-sm !rounded-xl !px-6">نعم، تأكيد الحذف</button>
      </div>
    </div>
  `);

  $('#mDoDelMember').onclick = async () => {
    S.site.team = (S.site.team || []).filter(x => x.id !== id);
    closeLayer();
    renderTeamTab();
    await saveTeamToDb();
  };
};

async function saveTeamToDb() {
  try {
    const { error } = await sb.from('app_settings').upsert([
      { key: 'site', value: S.site }
    ], { onConflict: 'key' });
    if (error) throw error;
    toast('تم حفظ وتحديث بيانات الفريق بنجاح', 'ok');
  } catch (e) { toast('تعذر الحفظ: ' + e.message, 'err'); }
}

        <div>
          <label class="label">عنوان أو وصف الصورة <span class="text-rose-600">*</span></label>
          <input id="gp_caption" class="input" placeholder="مثال: لقطة من اختبارات المستوى الأول برواية حفص">
        </div>

        <div>
          <label class="label">تاريخ الفعالية</label>
          <input id="gp_date" type="date" class="input" value="${todayISO()}">
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6 pt-3 border-t border-cream-200">
        <button class="btn btn-outline btn-sm !rounded-xl" data-close>إلغاء</button>
        <button id="btnSubmitAddPhoto" class="btn btn-primary btn-sm !rounded-xl !px-6 shadow-glow-pine">
          ➕ إضافة للمعرض
        </button>
      </div>
    </div>
  `);

  let currentPhotoUrl = '';

  $('#gp_file')?.addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      toast('جاري ضغط ورفع الصورة...', 'ok');
      const compressed = await compressImg(file, 1600);
      const path = await uploadApp('gallery', compressed);
      const url = await getAppFileUrl(path, APPB);
      currentPhotoUrl = url || path;
      $('#gp_url').value = currentPhotoUrl;
      $('#gp_preview').innerHTML = `<img src="${currentPhotoUrl}" class="w-full h-full object-contain">`;
      toast('تم رفع الصورة بنجاح', 'ok');
    } catch (err) {
      toast('تعذر رفع الصورة: ' + err.message, 'err');
    }
  });

  $('#gp_url')?.addEventListener('input', e => {
    currentPhotoUrl = e.target.value.trim();
    if (currentPhotoUrl) {
      $('#gp_preview').innerHTML = `<img src="${esc(currentPhotoUrl)}" class="w-full h-full object-contain">`;
    }
  });

  $('#btnSubmitAddPhoto').onclick = async () => {
    const url = currentPhotoUrl || $('#gp_url').value.trim();
    const caption = $('#gp_caption').value.trim();
    const date = $('#gp_date').value;

    if (!url) return toast('يرجى اختيار صورة أو إدخال رابطها أولاً', 'err');
    if (!caption) return toast('يرجى كتابة عنوان أو وصف للصورة', 'err');

    if (!Array.isArray(S.site.gallery)) S.site.gallery = [];
    S.site.gallery.unshift({
      id: 'g_' + Date.now(),
      url: url,
      caption: caption,
      date: date ? fmtDate(date) : ''
    });

    closeLayer();
    renderMediaTab();
    await saveMediaToDb();
  };
};

window.deleteGalleryPhoto = function(idx) {
  if (!confirm('هل تريد بالتأكيد حذف هذه الصورة من المعرض؟')) return;
  if (Array.isArray(S.site.gallery)) {
    S.site.gallery.splice(idx, 1);
    renderMediaTab();
    saveMediaToDb();
  }
};

async function saveMediaToDb() {
  try {
    const { error } = await sb.from('app_settings').upsert([
      { key: 'site', value: S.site }
    ], { onConflict: 'key' });
    if (error) throw error;
    toast('تم حفظ وتحديث البث المباشر ومعرض الصور بنجاح', 'ok');
  } catch (e) { toast('تعذر الحفظ: ' + e.message, 'err'); }
}

function exportRegsCsv() {
  const rows = filteredRegs();
  if (!rows.length) return toast('لا توجد بيانات لتصديرها', 'err');

  const headers = ['رقم التسجيل', 'الاسم الكامل', 'المستوى', 'الرقم القومي', 'الميلاد', 'السن', 'القرية', 'ولي الأمر', 'الهاتف', 'الحالة', 'الشفوي', 'التحريري', 'النتيجة', 'الممتحن الأول', 'الممتحن الثاني'];
  const csvRows = [headers.join(',')];

  rows.forEach(r => {
    const row = [
      `"${r.reg_no || ''}"`,
      `"${(r.full_name || '').replace(/"/g, '""')}"`,
      `"${(r.level_name || '').replace(/"/g, '""')}"`,
      `"${r.national_id || ''}"`,
      `"${r.birth_date || ''}"`,
      `"${r.age != null ? r.age : ''}"`,
      `"${(r.village || '').replace(/"/g, '""')}"`,
      `"${(r.guardian_name || '').replace(/"/g, '""')}"`,
      `"${r.guardian_phone || ''}"`,
      `"${STATUS[r.status] || r.status || ''}"`,
      `"${r.oral_score != null ? r.oral_score : ''}"`,
      `"${r.written_score != null ? r.written_score : ''}"`,
      `"${r.result_status === 'pass' ? 'ناجح' : (r.result_status === 'fail' ? 'راسب' : '')}"`,
      `"${(exName(r.examiner_id) || '').replace(/"/g, '""')}"`,
      `"${(exName(r.examiner_id_2) || '').replace(/"/g, '""')}"`
    ];
    csvRows.push(row.join(','));
  });

  const blob = new Blob(['\uFEFF' + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `متسابقو_المسابقة_${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('تم تصدير ملف CSV بنجاح', 'ok');
}

document.addEventListener('click', async e => {

  if (t.closest('[data-close]') || t.classList.contains('overlay')) {
    closeLayer(); return;
  }

  const btn = t.closest('button');
  if (!btn) return;

  if (btn.dataset.tab) {
    A.tab = btn.dataset.tab;
    renderDash();
    return;
  }
  if (btn.id === 'logoutBtn') {
    await sb.auth.signOut();
    renderAdmin();
    return;
  }
  if (btn.id === 'addExaminer') {
    readExDom();
    A.examiners.push({ name: '', level_id: null, phone: '', pin: '1234' });
    paintExaminers();
    return;
  }
  if (btn.classList.contains('js-exdel')) {
    readExDom();
    A.examiners.splice(+btn.dataset.i, 1);
    paintExaminers();
    return;
  }
  if (btn.id === 'saveExaminers') {
    saveExaminers();
    return;
  }
  if (btn.classList.contains('js-regdel')) {
    confirmDeleteReg(btn.dataset.id);
    return;
  }
  if (btn.classList.contains('js-view')) {
    openDetail(btn.dataset.id);
    return;
  }
  if (btn.classList.contains('aview2')) {
    openAdminFile(btn.dataset.path, APPB, 'file');
    return;
  }
  if (btn.id === 'adminAddRegBtn') {
    openAddRegModal();
    return;
  }
  if (btn.id === 'refreshRegs') {
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> تحديث…';
    try {
      await loadRegs();
      paintRows();
      toast('تم تحديث قائمة المتسابقين بنجاح', 'ok');
    } catch (e) { toast('تعذر التحديث: ' + e.message, 'err'); }
    btn.disabled = false;
    btn.innerHTML = 'تحديث';
    return;
  }
  if (btn.id === 'exportCsv') {
    exportRegsCsv();
    return;
  }
  if (btn.id === 'delSelectedRegs') {
    confirmDeleteSelectedRegs();
    return;
  }
  if (btn.classList.contains('js-lvdel')) {
    readLvDom();
    const idx = +btn.dataset.i;
    if (S.levels.length <= 1) return toast('لا يمكن حذف كل المستويات، يجب الإبقاء على مستوى واحد على الأقل', 'err');
    const lvlName = S.levels[idx]?.name || 'المستوى';
    if (confirm(`هل أنت متأكد من حذف ${lvlName}؟`)) {
      S.levels.splice(idx, 1);
      paintLevels();
      toast('تم حذف المستوى، اضغط "حفظ ونشر المستويات" لاعتماد التغيير', 'ok');
    }
    return;
  }
  if (btn.classList.contains('js-upload-file-btn')) {
    const type = btn.dataset.type;
    const inp = btn.closest('.file-row')?.querySelector(`.js-file-input[data-type="${type}"]`);
    if (inp) inp.click();
    return;
  }
  if (btn.classList.contains('js-del-file')) {
    const regId = btn.dataset.id;
    const type = btn.dataset.type;
    const path = btn.dataset.path;
    const label = type === 'photo' ? 'الصورة الشخصية' : (type === 'birthdoc' ? 'شهادة الميلاد' : 'فيديو الامتحان');
    if (!confirm(`هل أنت متأكد من حذف ${label} لهذا المتسابق نهائيًا؟`)) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>';
    try {
      const bucket = type === 'video' ? EXB : APPB;
      try { await sb.storage.from(bucket).remove([path]); } catch (e) {}

      const patch = {};
      if (type === 'photo') patch.photo_path = null;
      else if (type === 'birthdoc') patch.birthdoc_path = null;
      else if (type === 'video') patch.video_path = null;

      const { error } = await sb.from('registrations').update(patch).eq('id', regId);
      if (error) throw error;

      const r = (A.regs || []).find(x => String(x.id) === String(regId));
      if (r) Object.assign(r, patch);

      toast(`تم حذف ${label} بنجاح`, 'ok');
      openDetail(regId);
      paintRows();
    } catch (err) {
      toast('تعذر الحذف: ' + err.message, 'err');
      btn.disabled = false;
      btn.innerHTML = 'حذف';
    }
    return;
  }
  if (btn.id === 'dSaveAll') {
    const id = btn.dataset.id;
    const patch = {
      status: $('#dStatus').value,
      rejection_reason: $('#dRej').value.trim() || null,
      admin_notes: $('#dNote').value.trim() || null,
      examiner_id: +$('#dExm').value || null,
      examiner_id_2: +$('#dExm2').value || null,
      oral_score: $('#dOral').value !== '' ? +$('#dOral').value : null,
      written_score: $('#dWritten').value !== '' ? +$('#dWritten').value : null,
      result_status: $('#dRes').value || null
    };
    try {
      await sb.from('registrations').update(patch).eq('id', id);
      const r = (A.regs || []).find(x => x.id === id);
      if (r) Object.assign(r, patch);
      toast('تم حفظ كل التعديلات', 'ok');
      closeLayer();
      renderRegsTab();
    } catch (err) { toast(err.message, 'err'); }
    return;
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (!t) return;
  if (t.classList.contains('js-regchk')) {
    if (t.checked) SELECTED_REGS.add(t.dataset.id);
    else SELECTED_REGS.delete(t.dataset.id);
    updateSelectedBtn();
    return;
  }
  const sel = t.closest('select.js-status');
  if (sel) {
    const rid = sel.dataset.id, val = sel.value;
    try {
      await sb.from('registrations').update({ status: val }).eq('id', rid);
      const r = (A.regs || []).find(x => x.id === rid);
      if (r) r.status = val;
      toast('تم تحديث الحالة', 'ok');
    } catch (err) { toast(err.message, 'err'); }
    return;
  }
  if (t.classList.contains('js-file-input')) {
    const file = t.files && t.files[0];
    if (!file) return;
    const regId = t.dataset.id;
    const type = t.dataset.type;
    const label = type === 'photo' ? 'الصورة الشخصية' : 'شهادة الميلاد';

    toast(`جارٍ رفع ${label}…`);
    try {
      let uploadPayload = file;
      if (type === 'photo') {
        uploadPayload = await compressImg(file, 1200);
      } else if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name || '')) {
        uploadPayload = await compressImg(file, 1600);
      }

      const path = await uploadApp(type === 'photo' ? 'photo' : 'doc', uploadPayload);
      const patch = {};
      if (type === 'photo') patch.photo_path = path;
      else if (type === 'birthdoc') patch.birthdoc_path = path;

      const { error } = await sb.from('registrations').update(patch).eq('id', regId);
      if (error) throw error;

      const r = (A.regs || []).find(x => String(x.id) === String(regId));
      if (r) Object.assign(r, patch);

      toast(`تم حفظ وتحديث ${label} بنجاح`, 'ok');
      openDetail(regId);
      paintRows();
    } catch (err) {
      toast(`تعذر رفع الملف: ${err.message}`, 'err');
    }
    t.value = '';
    return;
  }
});

/* ══════════════════════════════════════════════════════════════════════════════
   7. مشغل القرآن العائم المطوّر (مع روابط CDN موثوقة 100% وتحكم فوري وتلقائي)
   ══════════════════════════════════════════════════════════════════════════════ */
(function() {
  const QCP_SURAHS = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

  const RECITERS = {
    husary: {
      name: 'محمود خليل الحصري (مرتل)',
      getUrl: n => `https://cdn.mp3quran.net/audio/mahmoud-husary/r1/${String(n).padStart(3, '0')}.mp3`,
      altUrl: n => `https://download.quranicaudio.com/qdc/khalil_al_husary/murattal/${n}.mp3`
    },
    alafasy: {
      name: 'مشاري بن راشد العفاسي',
      getUrl: n => `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${n}.mp3`,
      altUrl: n => `https://download.quranicaudio.com/qdc/mishari_al_afasy/murattal/${n}.mp3`
    },
    abdulbasit: {
      name: 'عبد الباسط عبد الصمد (مرتل)',
      getUrl: n => `https://download.quranicaudio.com/qdc/abdul_baset/murattal/${n}.mp3`,
      altUrl: n => `https://cdn.islamic.network/quran/audio-surah/128/ar.abdulbasitmurattal/${n}.mp3`
    }
  };

  let currentReciterKey = 'husary';
  let currentSurahNum = 1;
  let useAltSource = false;
  let isPlaying = false;

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <button class="qcp-btn" id="qcpBtn" title="القرآن الكريم صوتًا — اضغط للاستماع">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
      </svg>
    </button>
    <div class="qcp-panel" id="qcpPanel">
      <div class="qcp-head">
        <div class="flex items-center gap-2">
          <span class="text-xl">📖</span>
          <div>
            <h3>القرآن الكريم المرتل</h3>
            <small id="qcpReciterLabel">بصوت الشيخ محمود خليل الحصري</small>
          </div>
        </div>
        <button class="qcp-close" id="qcpClose" title="إغلاق">✕</button>
      </div>

      <!-- Reciter selector -->
      <div class="p-2.5 bg-cream-100 border-b border-cream-200 flex items-center justify-between text-xs">
        <span class="font-bold text-pine-900">القارئ:</span>
        <select id="qcpReciterSelect" class="input !py-1 text-xs !w-auto !rounded-lg font-semibold bg-white">
          <option value="husary">الشيخ محمود خليل الحصري (مرتل)</option>
          <option value="alafasy">الشيخ مشاري راشد العفاسي</option>
          <option value="abdulbasit">الشيخ عبد الباسط عبد الصمد</option>
        </select>
      </div>

      <!-- Quick Controls & Now Playing Card -->
      <div class="p-3 bg-white border-b border-cream-200">
        <div class="flex items-center justify-between mb-2">
          <div>
            <span class="text-xs text-pine-700 font-semibold block">السورة المحددة:</span>
            <div id="qcpSurahTitle" class="font-amiri text-lg font-bold text-pine-900">سورة الفاتحة</div>
          </div>
          <span id="qcpStatusBadge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-cream-200 text-pine-800">جاهز للاستماع</span>
        </div>

        <div class="flex items-center gap-2 mb-2">
          <button id="qcpPrevBtn" class="btn btn-outline !py-1.5 !px-2.5 text-xs flex-1" title="السورة السابقة">⏮ السابقة</button>
          <button id="qcpPlayToggle" class="btn btn-gold !py-1.5 !px-4 text-xs font-bold flex-[2] flex items-center justify-center gap-1.5">
            <span id="qcpPlayIcon">▶</span>
            <span id="qcpPlayLabel">تشغيل التلاوة</span>
          </button>
          <button id="qcpNextBtn" class="btn btn-outline !py-1.5 !px-2.5 text-xs flex-1" title="السورة التالية">التالية ⏭</button>
        </div>

        <!-- HTML5 Audio Container -->
        <audio id="qcpNativeAudio" controls class="w-full h-8 block rounded outline-none" preload="metadata"></audio>
      </div>

      <!-- Search Input -->
      <div class="px-2.5 pt-2 bg-cream-50">
        <input class="w-full px-3 py-1.5 text-xs border border-cream-200 rounded-lg outline-none focus:border-pine-600 bg-white" id="qcpSearch" type="search" placeholder="🔍 ابحث عن اسم السورة...">
      </div>
      
      <!-- Surahs List -->
      <div class="qcp-list" id="qcpList"></div>
    </div>
  `;
  document.body.appendChild(wrap);

  const audio = document.getElementById('qcpNativeAudio');
  const listEl = document.getElementById('qcpList');
  const surahTitleEl = document.getElementById('qcpSurahTitle');
  const statusBadgeEl = document.getElementById('qcpStatusBadge');
  const playToggleBtn = document.getElementById('qcpPlayToggle');
  const playIconEl = document.getElementById('qcpPlayIcon');
  const playLabelEl = document.getElementById('qcpPlayLabel');
  const qcpBtnEl = document.getElementById('qcpBtn');

  function getActiveUrl() {
    const reciter = RECITERS[currentReciterKey] || RECITERS.husary;
    return useAltSource ? reciter.altUrl(currentSurahNum) : reciter.getUrl(currentSurahNum);
  }

  function syncAudioSource() {
    const url = getActiveUrl();
    if (audio.src !== url) {
      audio.src = url;
      audio.load();
    }
    const reciter = RECITERS[currentReciterKey] || RECITERS.husary;
    surahTitleEl.textContent = `سورة ${QCP_SURAHS[currentSurahNum - 1]}`;
    document.getElementById('qcpReciterLabel').textContent = `بصوت الشيخ ${reciter.name}`;
  }

  function renderList(filter) {
    const f = (filter || '').trim();
    listEl.innerHTML = QCP_SURAHS.map((name, i) => {
      if (f && !name.includes(f)) return '';
      const num = i + 1;
      const isCur = currentSurahNum === num;
      return `<button class="qcp-item ${isCur ? 'active' : ''}" data-n="${num}">
        <span class="qcp-num">${arNum(num)}</span>
        <span class="font-medium">${name}</span>
        ${isCur && isPlaying ? '<span class="mr-auto text-xs text-gold-600 font-bold animate-pulse">🔊 استماع</span>' : ''}
      </button>`;
    }).join('');
  }

  function play(n) {
    currentSurahNum = n;
    useAltSource = false;
    syncAudioSource();
    statusBadgeEl.textContent = '⏳ جاري التحميل...';
    statusBadgeEl.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800';
    
    const p = audio.play();
    if (p !== undefined) {
      p.then(() => {
        setPlayingState(true);
      }).catch(err => {
        console.warn('Playback error, attempting fallback source:', err);
        if (!useAltSource) {
          useAltSource = true;
          syncAudioSource();
          audio.play().catch(() => {
            statusBadgeEl.textContent = 'اضغط زر التشغيل';
            statusBadgeEl.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-cream-200 text-pine-800';
          });
        }
      });
    }
    renderList(document.getElementById('qcpSearch')?.value || '');
  }

  function togglePlay() {
    if (audio.paused || audio.ended) {
      if (!audio.src) syncAudioSource();
      const p = audio.play();
      if (p !== undefined) {
        p.then(() => setPlayingState(true)).catch(() => {
          if (!useAltSource) {
            useAltSource = true;
            syncAudioSource();
            audio.play().catch(() => {});
          }
        });
      }
    } else {
      audio.pause();
      setPlayingState(false);
    }
  }

  function setPlayingState(playing) {
    isPlaying = playing;
    if (playing) {
      playIconEl.textContent = '⏸';
      playLabelEl.textContent = 'إيقاف مؤقت';
      qcpBtnEl.classList.add('playing');
      statusBadgeEl.textContent = '🔊 قيد التشغيل';
      statusBadgeEl.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800';
    } else {
      playIconEl.textContent = '▶';
      playLabelEl.textContent = 'تشغيل التلاوة';
      qcpBtnEl.classList.remove('playing');
      statusBadgeEl.textContent = '⏸ موقوف';
      statusBadgeEl.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-cream-200 text-pine-800';
    }
    renderList(document.getElementById('qcpSearch')?.value || '');
  }

  // Audio Events
  audio.addEventListener('play', () => setPlayingState(true));
  audio.addEventListener('pause', () => setPlayingState(false));
  audio.addEventListener('playing', () => setPlayingState(true));
  audio.addEventListener('waiting', () => {
    statusBadgeEl.textContent = '⏳ جاري التحميل...';
  });
  audio.addEventListener('ended', () => {
    if (currentSurahNum < 114) {
      play(currentSurahNum + 1);
    } else {
      setPlayingState(false);
    }
  });
  audio.addEventListener('error', () => {
    console.warn('Audio element error encountered. Trying fallback CDN...');
    if (!useAltSource) {
      useAltSource = true;
      syncAudioSource();
      audio.play().catch(() => {});
    } else {
      statusBadgeEl.textContent = 'تعذر المصدر، اختر قارئاً آخر';
      statusBadgeEl.className = 'text-[11px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-800';
    }
  });

  // UI Event Handlers
  playToggleBtn.addEventListener('click', togglePlay);

  document.getElementById('qcpPrevBtn').addEventListener('click', () => {
    if (currentSurahNum > 1) play(currentSurahNum - 1);
  });

  document.getElementById('qcpNextBtn').addEventListener('click', () => {
    if (currentSurahNum < 114) play(currentSurahNum + 1);
  });

  document.getElementById('qcpReciterSelect').addEventListener('change', e => {
    currentReciterKey = e.target.value;
    useAltSource = false;
    const wasPlaying = !audio.paused;
    syncAudioSource();
    if (wasPlaying) audio.play().catch(() => {});
    renderList(document.getElementById('qcpSearch')?.value || '');
  });

  qcpBtnEl.addEventListener('click', () => {
    const p = document.getElementById('qcpPanel');
    p.classList.toggle('open');
    if (p.classList.contains('open') && !listEl.children.length) {
      renderList('');
    }
  });

  document.getElementById('qcpClose').addEventListener('click', () => {
    document.getElementById('qcpPanel').classList.remove('open');
  });

  document.getElementById('qcpSearch').addEventListener('input', e => {
    renderList(e.target.value);
  });

  listEl.addEventListener('click', e => {
    const b = e.target.closest('.qcp-item');
    if (b) play(+b.dataset.n);
  });

  // Pre-load default surah (1: الفاتحة) on start
  syncAudioSource();
  renderList('');
})();

/* ══════════════════════════════════════════════════════════════════════════════
   Init
   ══════════════════════════════════════════════════════════════════════════════ */
(async function() {
  try { await loadPublic(); } catch (e) {}
  applyThemeVars(currentThemeKey());
  route();
})();
</script>
