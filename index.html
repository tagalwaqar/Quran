if(btn.classList.contains('js-lvup')){const i=+btn.dataset.i;if(i>0){readLevelsDom();const tmp=S.levels[i];S.levels[i]=S.levels[i-1];S.levels[i-1]=tmp;paintLevels();}return;}
if(btn.classList.contains('js-lvdown')){const i=+btn.dataset.i;if(i<S.levels.length-1){readLevelsDom();const tmp=S.levels[i];S.levels[i]=S.levels[i+1];S.levels[i+1]=tmp;paintLevels();}return;}
if(btn.id==='addExaminer'){readExDom();A.examiners.push({name:'',level_id:null,phone:''});paintExaminers();return;}
if(btn.classList.contains('js-exdel')){readExDom();A.examiners.splice(+btn.dataset.i,1);paintExaminers();return;}
if(btn.id==='saveExaminers'){saveExaminers();return;}
if(btn.classList.contains('aview2')){openAdminFile(btn.dataset.path,APPB,'file');return;}
if(btn.classList.contains('xup2')){EXUP={id:btn.dataset.id,kind:btn.dataset.kind};const inp=btn.dataset.kind==='paper'?$('#xfilePaper2'):$('#xfileVideo2');if(inp)inp.click();return;}
if(btn.classList.contains('xview2')){openAdminFile(btn.dataset.path,EXB,btn.dataset.kind);return;}
if(btn.id==='refreshRegs'){btn.disabled=true;try{await loadRegs();renderDash();toast('تم','ok');}catch(err){toast(err.message,'err');}return;}
if(btn.id==='exportCsv'){exportCsv();return;}
if(btn.classList.contains('js-view')){openDetail(btn.dataset.id);return;}
if(btn.id==='dSaveAll'){const id=btn.dataset.id;const st=$('#dStatus').value;const rej=$('#dRej').value.trim();
if(st==='rejected'&&!rej){toast('اكتب سبب الرفض','err');return;}
btn.disabled=true;btn.innerHTML='جارٍ…';
try{const patch={status:st,rejection_reason:st==='rejected'?rej:null,admin_notes:$('#dNote').value.trim(),examiner_id:+$('#dExm').value||null,examiner_id_2:+$('#dExm2').value||null,oral_score:$('#dOral').value!==''?+$('#dOral').value:null,written_score:$('#dWritten').value!==''?+$('#dWritten').value:null,result_status:$('#dRes').value||null,share_exams:$('#dShare').checked};
const{error}=await sb.from('registrations').update(patch).eq('id',id);if(error)throw error;
Object.assign(A.regs.find(x=>x.id===id),patch);toast('تم الحفظ','ok');closeLayer();renderTab();}
catch(err){toast(err.message,'err');btn.disabled=false;}return;}});
document.addEventListener('change',async e=>{const t=e.target;if(!t)return;
if(t.id==='xfilePaper2'||t.id==='xfileVideo2'){const f=t.files&&t.files[0],up=EXUP;
if(f&&up&&up.id){const isPaper=t.id==='xfilePaper2';const max=isPaper?15*1024*1024:100*1024*1024;
if(f.size>max){toast(isPaper?'الورقة أكبر من ١٥ ميجا':'الفيديو أكبر من ١٠٠ ميجا','err');}
else{toast(isPaper?'جارٍ رفع الورقة…':'جارٍ رفع الفيديو…');
try{const r=A.regs.find(x=>x.id===up.id)||{};const oldPath=isPaper?r.paper_path:r.video_path;
const path=await uploadExam(up.id,up.kind,f,oldPath);const patch={};patch[isPaper?'paper_path':'video_path']=path;
const{error}=await sb.from('registrations').update(patch).eq('id',up.id);if(error)throw error;
Object.assign(r,patch);toast('تم الرفع','ok');openDetail(up.id);}
catch(err){toast(err.message,'err');}}}
EXUP=null;t.value='';return;}
const sel=t.closest('select.js-status');
if(sel){const rid=sel.dataset.id,val=sel.value;const r=A.regs.find(x=>x.id===rid)||{};
if(val==='rejected'){sel.value=r.status||'pending';
modal('<div class="m-head">سبب الرفض</div><div class="m-body"><b>'+esc(r.full_name||'')+'</b></div><textarea id="mRej" rows="3" class="input mt-3"></textarea><div class="m-actions"><button class="btn btn-danger" id="mRejOk">رفض</button><button class="btn btn-outline" data-close>إلغاء</button></div>');
 $('#mRejOk').onclick=async()=>{const reason=$('#mRej').value.trim();if(!reason){toast('اكتب السبب','err');return;}
try{const{error}=await sb.from('registrations').update({status:'rejected',rejection_reason:reason}).eq('id',rid);if(error)throw error;
Object.assign(A.regs.find(x=>x.id===rid),{status:'rejected',rejection_reason:reason});toast('تم الرفض','ok');closeLayer();renderTab();}catch(err){toast(err.message,'err');}};return;}
sel.disabled=true;
try{const{error}=await sb.from('registrations').update({status:val}).eq('id',rid);if(error)throw error;
Object.assign(A.regs.find(x=>x.id===rid),{status:val});toast('تم','ok');renderTab();}catch(err){toast(err.message,'err');sel.disabled=false;}return;}
if(t.id==='logoFile'&&t.files&&t.files[0]){try{S.site.logo=await pickImage(t.files[0],280,true);updateLogoPrev();toast('اضغط حفظ ونشر','ok');}catch(err){toast('تعذر','err');}t.value='';return;}
const lvf=t.closest('.js-lvimgfile');
if(lvf&&lvf.files&&lvf.files[0]){const i=+lvf.dataset.i;toast('جارٍ معالجة الصورة…');
try{readLevelsDom();const f=lvf.files[0];
let imgUrl=null;
try{const blob=await compressImg(f,600);const path='level-'+(i+1)+'-'+Date.now()+'.jpg';
const up=await sb.storage.from('levelimg').upload(path,blob,{contentType:'image/jpeg',upsert:true});
if(!up.error)imgUrl=sb.storage.from('levelimg').getPublicUrl(path).data.publicUrl;}catch(storageErr){}
if(!imgUrl){imgUrl=await pickImage(f,600,false);}
S.levels[i].image=imgUrl;paintLevels();toast('تم تجهيز الصورة — اضغط «حفظ المستويات» للتثبيت','ok');
}catch(err){toast('تعذّر حفظ الصورة: '+(err.message||''),'err');}
lvf.value='';return;}});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')renderAdmin();});
(function(){
const QCP_SURAHS=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const QCP_SOURCES=[function(n){return'https://server8.mp3quran.net/hsary/'+String(n).padStart(3,'0')+'.mp3';},function(n){return'https://download.quranicaudio.com/quran/mahmoud_khalil_al-husary/'+String(n).padStart(3,'0')+'.mp3';},function(n){return'https://cdn.islamic.network/quran/audio-surah/128/ar.husary/'+n+'.mp3';}];
let QCP_TRY=0,current=0,lastSurah='الفاتحة';
const wrap=document.createElement('div');
wrap.innerHTML='<button class="qcp-btn" id="qcpBtn" title="القرآن الكريم"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></button><div class="qcp-panel" id="qcpPanel"><div class="qcp-head"><div><h3>القرآن الكريم</h3><small>بصوت الشيخ محمود خليل الحصري</small></div><button class="qcp-close" id="qcpClose">✕</button></div><div class="qcp-now" id="qcpNow"><b id="qcpNowName"></b></div><div id="qcpAudioWrap"></div><input class="qcp-search" id="qcpSearch" type="search" placeholder="ابحث…"><div class="qcp-list" id="qcpList"></div><button class="btn btn-gold btn-sm" id="qcpYt" style="margin:.4rem .8rem;display:flex;justify-content:center">▶ شغّل من يوتيوب</button></div>';
document.body.appendChild(wrap);
const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.className='qcp-audio';document.getElementById('qcpAudioWrap').appendChild(audio);
const listEl=document.getElementById('qcpList');
function renderList(filter){const f=(filter||'').trim();listEl.innerHTML=QCP_SURAHS.map((name,i)=>{if(f&&!name.includes(f))return'';return'<button class="qcp-item '+(current===i+1?'active':'')+'" data-n="'+(i+1)+'"><span class="qcp-num">'+arNum(i+1)+'</span><span>'+name+'</span></button>';}).join('');}
function play(n){current=n;lastSurah=QCP_SURAHS[n-1];tryNext(0);}
function tryNext(idx){if(idx>=QCP_SOURCES.length){document.getElementById('qcpNowName').textContent='تعذر — جرّب يوتيوب';return;}
QCP_TRY=idx;audio.src=QCP_SOURCES[idx](current);document.getElementById('qcpNow').classList.add('show');document.getElementById('qcpNowName').textContent='جارٍ: سورة '+QCP_SURAHS[current-1];audio.play().catch(()=>{});}
audio.addEventListener('playing',()=>{document.getElementById('qcpNowName').textContent='◄ '+QCP_SURAHS[current-1]+' — الحصري';document.getElementById('qcpBtn').classList.add('playing');});
audio.addEventListener('pause',()=>document.getElementById('qcpBtn').classList.remove('playing'));
audio.addEventListener('ended',()=>{if(current<114)play(current+1);});
audio.addEventListener('error',()=>{if(audio.src&&audio.src!==''){tryNext(QCP_TRY+1);}});
document.getElementById('qcpYt').addEventListener('click',()=>{window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(lastSurah+' الحصري كاملة'),'_blank');});
document.getElementById('qcpBtn').addEventListener('click',()=>{const p=document.getElementById('qcpPanel');p.classList.toggle('open');if(p.classList.contains('open')&&!listEl.children.length)renderList('');});
document.getElementById('qcpClose').addEventListener('click',()=>document.getElementById('qcpPanel').classList.remove('open'));
document.getElementById('qcpSearch').addEventListener('input',e=>renderList(e.target.value));
listEl.addEventListener('click',e=>{const b=e.target.closest('.qcp-item');if(b)play(+b.dataset.n);});
})();
(async function(){try{await loadPublic();}catch(e){}applyThemeVars(currentThemeKey());route();})();
</script>
