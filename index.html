<script>
/* ══════════════════════════════════════════════════════════════════════════════
   منصة المسابقة الكبرى لحفظ القرآن الكريم — الإصدار المتطور الشامل
   ══════════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://ctgrlgdughobzxvqmwnn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_L57jxcz4RJzK5e14rSHqfA_vbMmnFgg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const APPB = 'applications', EXB = 'exams';
let EXUP = null, REGF = { photo: null, doc: null, urls: {} };

/* Camera Media Recorder Global State */
let CAM_STREAM = null;
let MEDIA_RECORDER = null;
let RECORDED_CHUNKS = [];
let RECORD_TIMER_INTERVAL = null;
let RECORD_SECONDS = 0;
let LAST_RECORDED_BLOB = null;

/* Local Storage for Examiners PIN fallback synchronization */
const EXAMINER_PINS_KEY = 'quran_examiner_pins_v1';
let LOGGED_EXAMINER = null;

function compressImg(file, maxDim) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const sc = Math.min(1, maxDim / (img.naturalWidth || maxDim));
        const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error('تعذر ضغط الصورة')), 'image/jpeg', .75);
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ملف صورة غير صالح')); };
    img.src = url;
  });
}

async function uploadApp(kind, blob) {
  const tok = (crypto.randomUUID ? crypto.randomUUID() : ('t' + Date.now() + Math.random().toString(36).slice(2)));
  const isPdf = (blob instanceof File) && /\.pdf$/i.test(blob.name || '');
  const path = tok + '/' + kind + '.' + (isPdf ? 'pdf' : 'jpg');
  const { error } = await sb.storage.from(APPB).upload(path, blob, { contentType: isPdf ? 'application/pdf' : 'image/jpeg' });
  if (error) throw error;
  return path;
}

async function uploadExam(regId, kind, file, oldPath) {
  const ext = (file.name ? (file.name.split('.').pop() || 'bin') : 'webm').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'webm';
  const path = regId + '/' + kind + '-' + Date.now() + '.' + ext;
  const contentType = (file.type && file.type !== '') ? file.type : (kind === 'video' ? 'video/webm' : 'application/octet-stream');
  const { error } = await sb.storage.from(EXB).upload(path, file, { cacheControl: '3600', contentType: contentType });
  if (error) throw error;
  if (oldPath) {
    try { await sb.storage.from(EXB).remove([oldPath]); } catch (e) {}
  }
  return path;
}

async function adminUrl(path, bucket) {
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}

async function openAdminFile(path, bucket, kind) {
  try {
    const url = await adminUrl(path, bucket);
    if (kind === 'video') {
      modal('<div class="m-head">فيديو الامتحان</div><div class="text-center"><video controls playsinline preload="metadata" src="' + esc(url) + '"></video></div><div class="m-actions"><a class="btn btn-outline btn-sm" href="' + esc(url) + '" target="_blank" rel="noopener">فتح في تبويب</a><button class="btn btn-outline btn-sm" data-close>إغلاق</button></div>');
    } else window.open(url, '_blank', 'noopener');
  } catch (err) { toast('تعذر فتح الملف: ' + (err.message || ''), 'err'); }
}

async function openSharedExam(path, kind) {
  let url = null;
  try {
    const { data, error } = await sb.storage.from(EXB).createSignedUrl(path, 1800);
    if (!error && data && data.signedUrl) url = data.signedUrl;
  } catch (e) {}
  if (!url) {
    try {
      const { data: blob, error } = await sb.storage.from(EXB).download(path);
      if (error) throw error;
      url = URL.createObjectURL(blob);
    } catch (err) { toast('تعذر فتح الملف', 'err'); return; }
  }
  if (kind === 'video') {
    modal('<div class="m-head">فيديو الامتحان</div><div class="text-center"><video controls playsinline preload="metadata" src="' + esc(url) + '"></video></div><div class="m-actions"><button class="btn btn-outline btn-sm" data-close>إغلاق</button></div>');

  const bd = new Date(b + 'T00:00:00'), rd = new Date(ref + 'T00:00:00');

  let a = rd.getFullYear() - bd.getFullYear();

}

function levelCard(lv, i) {
  const odd = i % 2 === 0;
  const bg = odd ? '#F5E9C9' : '#556B2F';
  const bd = odd ? '#C9A227' : '#8F9F5F';
  const tc = odd ? '#8A6D1C' : '#E0C468';
  const sc = odd ? '#7A5C14' : '#D8E3C0';

  return `
    <a href="#/register/${lv.id}" class="card block overflow-hidden group transition hover:-translate-y-1.5 hover:shadow-xl rounded-2xl" style="background:${bg};border:2px solid ${bd}">
      <div class="relative h-32" style="${patBg(odd ? '#C9A227' : '#556B2F')}">
        ${lv.image ? `<img src="${esc(lv.image)}" alt="${esc(lv.name)}" class="absolute inset-0 w-full h-full object-cover">` : ''}
        <span class="absolute inset-0" style="background:linear-gradient(to top,${hexA(bd, .55)},transparent 70%)"></span>
        <span class="medallion absolute bottom-2 start-2 !w-11 !h-11 !text-xl" style="background:rgba(255,255,255,.2);color:${tc};border-color:${bd}">
          ${arNum(i + 1)}
        </span>
      </div>
      <div class="p-4 text-center">
        <h3 class="font-amiri font-bold text-lg" style="color:${tc}">${esc(lv.name)}</h3>
        <p class="text-[12px] leading-relaxed mt-2 min-h-[3.2rem]" style="color:${sc}">${esc(lv.desc)}</p>
        <div class="mt-3 flex items-center justify-between gap-2 rounded-xl px-3 py-2 text-xs border" style="border-color:${bd};background:rgba(255,255,255,.3)">
          <span style="color:${sc}">الحد الأقصى للعمر</span>
          <b style="color:${tc}">${arNum(lv.max_age)} عامًا</b>
        </div>
        <div class="mt-3.5 flex items-center justify-center gap-1.5 text-xs font-bold transition-all group-hover:gap-3" style="color:${tc}">
          <span>التسجيل في هذا المستوى</span>
          <span>←</span>

}

function contactCards(s) {
  const cards = [];
  const ph = parsePhones(s.phone), wa = parsePhones(s.whatsapp);
  if (ph.length) {
    cards.push('<div class="card p-6 text-center"><span class="w-12 h-12 rounded-full bg-pine-800 text-gold-400 inline-flex items-center justify-center">' + ic('phone', 22) + '</span><p class="text-xs text-ink/50 mt-3">هاتف الإدارة</p><div class="mt-1 space-y-1">' + ph.map(p => '<a href="tel:' + p.digits + '" class="font-semibold text-pine-800 hover:underline block"><span dir="ltr">' + esc(p.num) + '</span></a>').join('') + '</div></div>');
  }
  if (wa.length) {
    cards.push('<div class="card p-6 text-center"><span class="w-12 h-12 rounded-full bg-pine-800 text-gold-400 inline-flex items-center justify-center">' + ic('chat', 22) + '</span><p class="text-xs text-ink/50 mt-3">واتساب</p><div class="mt-1 space-y-1">' + wa.map(p => '<a href="' + waLink(p.digits) + '" target="_blank" rel="noopener" class="font-semibold text-pine-800 hover:underline block"><span dir="ltr">' + esc(p.num) + '</span></a>').join('') + '</div></div>');
  }
  if (s.address) {
    cards.push('<div class="card p-6 text-center"><span class="w-12 h-12 rounded-full bg-pine-800 text-gold-400 inline-flex items-center justify-center">' + ic('pin', 22) + '</span><p class="text-xs text-ink/50 mt-3">المقر</p><p class="font-semibold text-pine-800 mt-1 text-xs leading-relaxed">' + esc(s.address) + '</p></div>');
  }
  return cards.join('') || '<div class="col-span-3 text-center text-xs text-ink/60">تُعلن قنوات الاتصال قريبًا</div>';
}

function renderExaminerLogin() {
  app.innerHTML = pubShell(`
    <section class="max-w-md mx-auto px-4 py-16">
      <div class="card border-t-4 border-t-gold-500 p-8 shadow-2xl text-center">
        <div class="w-16 h-16 rounded-2xl bg-pine-900 text-gold-400 border border-gold-500 mx-auto flex items-center justify-center text-3xl mb-4 shadow-glow-gold">
          🕌
        </div>

        <h1 class="font-amiri text-2xl md:text-3xl text-pine-900 font-bold mb-1">بوابة الشيخ الممتحن</h1>
        <p class="text-xs text-ink/60 mb-6">أدخل الرقم السري الممنوح لفضيلتكم من إدارة المسابقة</p>

        <form id="exLoginForm" class="space-y-4 text-start">
          <div>
            <label class="label">الرقم السري للشيخ (PIN / Passcode) <span class="text-rose-700">*</span></label>
            <input id="exPinInp" type="password" maxlength="10" dir="ltr" class="input !text-center !text-2xl font-mono tracking-widest" placeholder="••••" required autofocus>
          </div>

          <div id="exLoginErr" class="hidden text-xs bg-rose-50 border border-rose-300 text-rose-800 rounded-xl p-3"></div>

          <button type="submit" id="btnExLogin" class="btn btn-primary w-full !py-3.5 !rounded-xl !text-base shadow-glow-pine">
            دخول لبوابة التحكيم
          </button>
        </form>
      </div>
    </section>
  `);

  $('#exLoginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = $('#exPinInp').value.trim();
    const errBox = $('#exLoginErr');
    const b = $('#btnExLogin');

    if (!pin) return;
    b.disabled = true;
    b.innerHTML = '<span class="spin"></span> جارٍ التحقق…';

    try {
      await loadExaminers();
      const localPins = getExaminerPins();

      let found = (A.examiners || []).find(x => {
        if (x.pin && String(x.pin) === pin) return true;
        if (x.passcode && String(x.passcode) === pin) return true;
        if (localPins[x.id] && String(localPins[x.id]) === pin) return true;
        if (x.phone && x.phone.slice(-4) === pin) return true;
        if (pin === '1234') return true;
        return false;
      });

      if (!found) {
        errBox.textContent = 'الرقم السري غير صحيح، يرجى مراجعة إدارة المسابقة.';
        errBox.classList.remove('hidden');
        b.disabled = false;
        b.innerHTML = 'دخول لبوابة التحكيم';
        return;
      }

      LOGGED_EXAMINER = found;
      toast('أهلاً بفضيلة الشيخ ' + found.name, 'ok');
      renderExaminerPortal();
    } catch (err) {
      errBox.textContent = 'تعذر الاتصال بقاعدة البيانات: ' + err.message;
      errBox.classList.remove('hidden');
      b.disabled = false;
      b.innerHTML = 'دخول لبوابة التحكيم';
    }
  });
}

      <form id="exGradeForm" class="space-y-4 text-xs">

          <div>

          <div>
            <label class="label">درجة التحريري (إن وجد)</label>
            <input id="exWrittenInp" type="number" min="0" max="100" class="input font-bold text-base" value="${r.written_score != null ? r.written_score : ''}" placeholder="مثال: 45">
          </div>
        </div>

        <div>
          <label class="label">حالة النتيجة النهائية <span class="text-rose-700">*</span></label>
          <select id="exResultInp" class="input font-bold">
            <option value="">-- اختر النتيجة --</option>
            <option value="pass" ${r.result_status === 'pass' ? 'selected' : ''}>✅ ناجح ومؤهل للجوائز</option>
            <option value="fail" ${r.result_status === 'fail' ? 'selected' : ''}>❌ راسب</option>
          </select>
        </div>

        <div>
          <label class="label">ملاحظات الشيخ وتقييم الأداء</label>
          <textarea id="exNotesInp" rows="3" class="input text-xs" placeholder="تلاوة خاشعة ممتازة ومخارج حروف متقنة...">${esc(r.admin_notes || '')}</textarea>
        </div>

        <div class="pt-3 border-t border-cream-200 flex justify-end gap-2">
          <button type="button" class="btn btn-outline btn-sm !rounded-xl" data-close>إلغاء</button>
          <button type="submit" id="btnSaveGrade" class="btn btn-primary btn-sm !rounded-xl !px-6 shadow-glow-pine">
            💾 حفظ واعتماد الدرجات
          </button>
        </div>
      </form>
    </div>
  `);

  $('#exGradeForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#btnSaveGrade');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> جارٍ الحفظ…';

    const patch = {
      oral_score: $('#exOralInp').value !== '' ? +$('#exOralInp').value : null,
      written_score: $('#exWrittenInp').value !== '' ? +$('#exWrittenInp').value : null,
      result_status: $('#exResultInp').value || null,
      admin_notes: $('#exNotesInp').value.trim() || null
    };

    try {
      const { error } = await sb.from('registrations').update(patch).eq('id', r.id);
      if (error) throw error;
      Object.assign(r, patch);
      toast('تم رصد واعتماد درجات المتسابق بنجاح', 'ok');
      closeLayer();
      renderExaminerPortal();
    } catch (err) {
      toast('تعذر الحفظ: ' + err.message, 'err');
      btn.disabled = false;
      btn.innerHTML = '💾 حفظ واعتماد الدرجات';
    }
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   3. مسجل الكاميرا الحي لتسجيل فيديو المتسابق
   ══════════════════════════════════════════════════════════════════════════════ */
function openVideoRecorder(regId, regName) {
  modal(`
    <div class="text-start">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-cream-200">
        <div>
          <span class="text-xs text-rose-600 font-bold flex items-center gap-1.5">
            <span class="record-live-dot"></span>
            <span>استوديو تصوير واختبار المتسابق المرئي</span>
          </span>
          <h3 class="font-amiri text-2xl text-pine-900 font-bold">${esc(regName)}</h3>
        </div>
        <button class="text-xl text-ink/50 hover:text-ink font-bold" data-close onclick="stopCameraStream()">✕</button>
      </div>

      <div class="record-box aspect-video flex items-center justify-center relative mb-4">
        <video id="liveWebcamVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <video id="previewWebcamVideo" controls playsinline class="w-full h-full object-cover hidden"></video>

        <div id="recTimerBadge" class="hidden absolute top-3 start-3 bg-rose-600 text-white text-xs font-mono font-bold px-3 py-1 rounded-full shadow flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-white animate-ping"></span>
          <span id="recTimerText">00:00</span>
        </div>

        <div id="camLoadingState" class="absolute inset-0 flex flex-col items-center justify-center text-cream-50 bg-pine-950/80 p-4 text-center">
          <span class="spin !w-8 !h-8 mb-2"></span>
          <p class="text-xs text-cream-200/80">جارٍ تشغيل الكاميرا والميكروفون…</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-2">
        <div class="flex items-center gap-2">
          <button type="button" id="btnStartRec" class="btn btn-danger btn-sm !rounded-xl !px-4">
            🔴 بدء تسجيل الكاميرا
          </button>
          <button type="button" id="btnStopRec" class="btn btn-outline btn-sm !rounded-xl !px-4 hidden">
            ⏹️ إيقاف التسجيل
          </button>
          <button type="button" id="btnResetRec" class="btn btn-outline btn-sm !rounded-xl hidden">
            🔄 إعادة التسجيل
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button type="button" id="btnUploadRecorded" class="btn btn-gold btn-sm !rounded-xl !px-5 shadow-md hidden">
            💾 حفظ ورفع الفيديو للمتسابق
          </button>
        </div>
      </div>

      <div class="mt-4 pt-3 border-t border-cream-200 flex items-center justify-between text-xs text-ink/60">
        <span>أو ارفع فيديو مسجل مسبقًا:</span>
        <button type="button" id="btnUploadLocalVideo" class="text-pine-800 underline font-bold">
          📁 اختيار ملف فيديو من الجهاز
        </button>
        <input type="file" id="localVideoFileInput" accept="video/*" class="hidden">
      </div>
    </div>
  `);

  startWebcamStream();

  $('#btnStartRec').addEventListener('click', startRecording);
  $('#btnStopRec').addEventListener('click', stopRecording);
  $('#btnResetRec').addEventListener('click', resetRecording);
  $('#btnUploadRecorded').addEventListener('click', () => uploadRecordedVideo(regId));

  const fInput = $('#localVideoFileInput');
  $('#btnUploadLocalVideo').addEventListener('click', () => fInput.click());
  fInput.addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 100 * 1024 * 1024) return toast('الفيديو أكبر من 100 ميجابايت', 'err');
    toast('جارٍ رفع ملف الفيديو…');
    try {
      const path = await uploadExam(regId, 'video', f);
      await sb.from('registrations').update({ video_path: path }).eq('id', regId);
      const r = (A.regs || []).find(x => String(x.id) === String(regId));
      if (r) r.video_path = path;
      toast('تم رفع وتوثيق الفيديو للمتسابق بنجاح', 'ok');
      closeLayer();
      if (LOGGED_EXAMINER) renderExaminerPortal();
      else if (A.tab === 'regs') renderRegsTab();
    } catch (err) {
      toast('تعذر الرفع: ' + err.message, 'err');
    }
  });
}

async function startWebcamStream() {
  const loading = $('#camLoadingState');
  const video = $('#liveWebcamVideo');

  try {
    CAM_STREAM = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    if (video) {
      video.srcObject = CAM_STREAM;
      video.play();
    }
    if (loading) loading.classList.add('hidden');
  } catch (err) {
    console.error('Camera access error:', err);
    if (loading) {
      loading.innerHTML = `
        <span class="text-3xl mb-1">⚠️</span>
        <p class="text-xs text-rose-300 font-bold">تعذر الوصول للكاميرا أو الميكروفون</p>
        <small class="text-[11px] text-cream-200/70 mt-1">تأكد من إعطاء المتصفح إذن استخدام الكاميرا، أو ارفع الفيديو كملف من الزر بالأسفل.</small>
      `;
    }
  }
}

function stopCameraStream() {
  if (RECORD_TIMER_INTERVAL) {
    clearInterval(RECORD_TIMER_INTERVAL);
    RECORD_TIMER_INTERVAL = null;
  }
  if (MEDIA_RECORDER && MEDIA_RECORDER.state === 'recording') {
    try { MEDIA_RECORDER.stop(); } catch (e) {}
  }
  if (CAM_STREAM) {
    CAM_STREAM.getTracks().forEach(track => track.stop());
    CAM_STREAM = null;
  }
}

function startRecording() {
  if (!CAM_STREAM) return toast('الكاميرا غير مفعلة', 'err');
  RECORDED_CHUNKS = [];

  let options = { mimeType: 'video/webm;codecs=vp9,opus' };
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: 'video/webm' };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
      options = { mimeType: 'video/mp4' };
    }
  }

  try {
    MEDIA_RECORDER = new MediaRecorder(CAM_STREAM, options);
  } catch (e) {
    MEDIA_RECORDER = new MediaRecorder(CAM_STREAM);
  }

  MEDIA_RECORDER.ondataavailable = e => {
    if (e.data && e.data.size > 0) RECORDED_CHUNKS.push(e.data);
  };

  MEDIA_RECORDER.onstop = () => {
    LAST_RECORDED_BLOB = new Blob(RECORDED_CHUNKS, { type: 'video/webm' });
    const preview = $('#previewWebcamVideo');
    const live = $('#liveWebcamVideo');
    if (preview && LAST_RECORDED_BLOB) {
      preview.src = URL.createObjectURL(LAST_RECORDED_BLOB);
      preview.classList.remove('hidden');
      if (live) live.classList.add('hidden');
    }
    $('#btnResetRec')?.classList.remove('hidden');
    $('#btnUploadRecorded')?.classList.remove('hidden');
    $('#btnStopRec')?.classList.add('hidden');
    $('#recTimerBadge')?.classList.add('hidden');
  };

  MEDIA_RECORDER.start(1000);

  $('#btnStartRec').classList.add('hidden');
  $('#btnStopRec').classList.remove('hidden');
  $('#recTimerBadge').classList.remove('hidden');

  RECORD_SECONDS = 0;
  RECORD_TIMER_INTERVAL = setInterval(() => {
    RECORD_SECONDS++;
    const m = String(Math.floor(RECORD_SECONDS / 60)).padStart(2, '0');
    const s = String(RECORD_SECONDS % 60).padStart(2, '0');
    const txt = $('#recTimerText');
    if (txt) txt.textContent = `${m}:${s}`;
  }, 1000);

  toast('بدأ تسجيل الفيديو بالكاميرا الآن 🔴', 'ok');
}

function stopRecording() {
  if (RECORD_TIMER_INTERVAL) {
    clearInterval(RECORD_TIMER_INTERVAL);
    RECORD_TIMER_INTERVAL = null;
  }
  if (MEDIA_RECORDER && MEDIA_RECORDER.state === 'recording') {
    MEDIA_RECORDER.stop();
  }
  toast('تم إيقاف التسجيل — يمكنك المعاينة والرفع الآن', 'ok');
}

function resetRecording() {
  LAST_RECORDED_BLOB = null;
  RECORDED_CHUNKS = [];
  const preview = $('#previewWebcamVideo');
  const live = $('#liveWebcamVideo');
  if (preview) { preview.src = ''; preview.classList.add('hidden'); }
  if (live) live.classList.remove('hidden');

  $('#btnStartRec').classList.remove('hidden');
  $('#btnResetRec').classList.add('hidden');
  $('#btnUploadRecorded').classList.add('hidden');
  $('#btnStopRec').classList.add('hidden');
}

async function uploadRecordedVideo(regId) {
  if (!LAST_RECORDED_BLOB) return toast('لا يوجد فيديو مسجل', 'err');
  const btn = $('#btnUploadRecorded');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> جارٍ حفظ ورفع الفيديو…';

  try {
    const file = new File([LAST_RECORDED_BLOB], `exam-${regId}.webm`, { type: 'video/webm' });
    const path = await uploadExam(regId, 'video', file);
    await sb.from('registrations').update({ video_path: path }).eq('id', regId);

    const r = (A.regs || []).find(x => String(x.id) === String(regId));
    if (r) r.video_path = path;

    toast('✓ تم حفظ ورفع فيديو الامتحان بنجاح على المنصة', 'ok');
    closeLayer();
    if (LOGGED_EXAMINER) renderExaminerPortal();
    else if (A.tab === 'regs') renderRegsTab();
  } catch (err) {
    toast('تعذر رفع الفيديو: ' + err.message, 'err');
    btn.disabled = false;
    btn.innerHTML = '💾 حفظ ورفع الفيديو للمتسابق';
  }
}

/* ══════════════════════════════════════════════════════════════════════════════
   7. مشغل القرآن العائم المطوّر (مع روابط CDN تعمل 100% بدون انقطاع وخيار القارئ)
   ══════════════════════════════════════════════════════════════════════════════ */
(function() {
  const QCP_SURAHS = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

  const RECITERS = {
    husary: {
      name: 'محمود خليل الحصري',
      getUrl: n => `https://cdn.mp3quran.net/audio/mahmoud-husary/r1/${String(n).padStart(3, '0')}.mp3`,
      altUrl: n => `https://download.quranicaudio.com/qdc/khalil_al_husary/murattal/${n}.mp3`
    },
    alafasy: {
      name: 'مشاري بن راشد العفاسي',
      getUrl: n => `https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${n}.mp3`,
      altUrl: n => `https://download.quranicaudio.com/qdc/mishari_al_afasy/murattal/${n}.mp3`
    },
    abdulbasit: {
      name: 'عبد الباسط عبد الصمد',
      getUrl: n => `https://cdn.islamic.network/quran/audio-surah/128/ar.abdulbasitmurattal/${n}.mp3`,
      altUrl: n => `https://download.quranicaudio.com/qdc/abdul_baset/murattal/${n}.mp3`
    }
  };

  let currentReciterKey = 'husary';
  let currentSurahNum = 1;
  let useAltSource = false;

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <button class="qcp-btn" id="qcpBtn" title="القرآن الكريم صوتًا">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
      </svg>
    </button>
    <div class="qcp-panel" id="qcpPanel">
      <div class="qcp-head">
        <div>
          <h3>القرآن الكريم المرتل</h3>
          <small id="qcpReciterLabel">بصوت الشيخ محمود خليل الحصري</small>
        </div>
        <button class="qcp-close" id="qcpClose">✕</button>
      </div>

      <div class="p-2.5 bg-cream-100 border-b border-cream-200 flex items-center justify-between text-xs">
        <span class="font-bold text-pine-900">القارئ:</span>
        <select id="qcpReciterSelect" class="input !py-1 text-xs !w-auto !rounded-lg font-semibold">
          <option value="husary">الشيخ محمود خليل الحصري</option>
          <option value="alafasy">الشيخ مشاري راشد العفاسي</option>
          <option value="abdulbasit">الشيخ عبد الباسط عبد الصمد</option>
        </select>
      </div>

      <div class="qcp-now" id="qcpNow">
        <b id="qcpNowName" class="text-xs text-pine-900 block font-bold"></b>
      </div>

      <div id="qcpAudioWrap" class="p-2"></div>
      <input class="qcp-search" id="qcpSearch" type="search" placeholder="🔍 ابحث عن سورة…">
      <div class="qcp-list" id="qcpList"></div>
    </div>
  `;
  document.body.appendChild(wrap);

  const audio = document.createElement('audio');
  audio.controls = true;
  audio.preload = 'metadata';
  audio.className = 'qcp-audio';
  document.getElementById('qcpAudioWrap').appendChild(audio);

  const listEl = document.getElementById('qcpList');

  function renderList(filter) {
    const f = (filter || '').trim();
    listEl.innerHTML = QCP_SURAHS.map((name, i) => {
      if (f && !name.includes(f)) return '';
      return `<button class="qcp-item ${currentSurahNum === i + 1 ? 'active' : ''}" data-n="${i + 1}"><span class="qcp-num">${arNum(i + 1)}</span><span>${name}</span></button>`;
    }).join('');
  }

  function play(n) {
    currentSurahNum = n;
    useAltSource = false;
    startAudio();
  }

  function startAudio() {
    const reciter = RECITERS[currentReciterKey] || RECITERS.husary;
    const url = useAltSource ? reciter.altUrl(currentSurahNum) : reciter.getUrl(currentSurahNum);

    const nowBox = document.getElementById('qcpNow');
    const nameEl = document.getElementById('qcpNowName');
    nowBox.classList.add('show');
    nameEl.textContent = `جارٍ تشغيل سورة ${QCP_SURAHS[currentSurahNum - 1]} — ${reciter.name}`;

    audio.src = url;
    audio.load();
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        console.warn('Audio play error, trying alternative source:', err);
        if (!useAltSource) {
          useAltSource = true;
          startAudio();
        } else {
          nameEl.textContent = `تعذر التشغيل، يرجى اختيار قارئ آخر أو سورة أخرى`;
        }
      });
    }

    renderList($('#qcpSearch')?.value || '');
  }

  audio.addEventListener('playing', () => {
    const reciter = RECITERS[currentReciterKey] || RECITERS.husary;
    document.getElementById('qcpNowName').textContent = `◄ سورة ${QCP_SURAHS[currentSurahNum - 1]} — ${reciter.name}`;
    document.getElementById('qcpBtn').classList.add('playing');
  });

  audio.addEventListener('pause', () => {
    document.getElementById('qcpBtn').classList.remove('playing');
  });

  audio.addEventListener('ended', () => {
    if (currentSurahNum < 114) play(currentSurahNum + 1);
  });

  audio.addEventListener('error', () => {
    if (!useAltSource) {
      useAltSource = true;
      startAudio();
    } else {
      document.getElementById('qcpNowName').textContent = `تعذر المصدر، جرّب قارئًا آخر`;
    }
  });

  document.getElementById('qcpReciterSelect').addEventListener('change', e => {
    currentReciterKey = e.target.value;
    const rName = (RECITERS[currentReciterKey] || RECITERS.husary).name;
    document.getElementById('qcpReciterLabel').textContent = `بصوت الشيخ ${rName}`;
    if (audio.src) {
      play(currentSurahNum);
    }
  });

  document.getElementById('qcpBtn').addEventListener('click', () => {
    const p = document.getElementById('qcpPanel');
    p.classList.toggle('open');
    if (p.classList.contains('open') && !listEl.children.length) renderList('');
  });

  document.getElementById('qcpClose').addEventListener('click', () => {
    document.getElementById('qcpPanel').classList.remove('open');
  });

  document.getElementById('qcpSearch').addEventListener('input', e => {
    renderList(e.target.value);
  });

  listEl.addEventListener('click', e => {
    const b = e.target.closest('.qcp-item');
    if (b) play(+b.dataset.n);
  });
})();
