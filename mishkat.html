            <span>عدم الإظهار مجددًا في هذه الجلسة</span>
          </label>
        </div>
      </div>
    </div>
  `;

  $('#enterMishkahBtn').addEventListener('click', dismissWelcome);
}

function dismissWelcome() {
  const chk = $('#skipWelcomeCheck');
  if (chk && chk.checked) {
    sessionStorage.setItem('mishkah_welcomed', 'true');
  } else {
    sessionStorage.setItem('mishkah_welcomed', 'true');
  }
  const box = $('#splashBox');
  if (box) {
    box.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    box.style.opacity = '0';
    box.style.transform = 'scale(1.05)';
    setTimeout(() => { box.remove(); }, 400);
  }
}

function setupJoinEvents() {
  fillTeachers();

  $('#jgender').addEventListener('change', () => {
    fillTeachers();
    resetSched();
  });

  $('#jteacher').addEventListener('change', () => {
    fillDaysAvail();
  });

  $('#addDay').addEventListener('click', () => {
    if (SCHED.length >= 5) {
      return toast('الحد الأقصى المسموح به هو خمسة أيام أسبوعيًا', 'err');
    }
    SCHED.push({ day: '', hour: '' });
    paintSched();
  });

  // Avatar upload handler
  const fAv = $('#fAvatar'), avBox = $('#avatarBox');
  avBox.addEventListener('click', (e) => {
    if (e.target.id === 'btnChangeAvatar') {
      fAv.click();
      return;
    }
    if (!$('#avatarActiveBox').classList.contains('hidden') && e.target.id !== 'btnChangeAvatar') return;
    fAv.click();
  });
  fAv.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('حجم الصورة كبير، الحد الأقصى 5 ميجابايت', 'err');
    const base64 = await readFileAsBase64(file);
    AVATAR_DATA = base64;
    $('#avatarImg').src = base64;
    $('#avatarPreviewBox').classList.add('hidden');
    $('#avatarActiveBox').classList.remove('hidden');
    toast('تم اختيار الصورة الشخصية بنجاح', 'ok');
  });
  $('#btnChangeAvatar')?.addEventListener('click', (e) => {
    e.stopPropagation();
    fAv.click();
  });

  // ID Card upload handler
  const fId = $('#fIdCard'), idBox = $('#idCardBox');
  idBox.addEventListener('click', (e) => {
    if (e.target.id === 'btnChangeIdCard') {
      fId.click();
      return;
    }
    if (!$('#idCardActiveBox').classList.contains('hidden') && e.target.id !== 'btnChangeIdCard') return;
    fId.click();
  });
  fId.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('حجم الملف كبير، الحد الأقصى 5 ميجابايت', 'err');
    const base64 = await readFileAsBase64(file);
    IDCARD_DATA = base64;
    $('#idCardImg').src = base64;
    $('#idCardPreviewBox').classList.add('hidden');
    $('#idCardActiveBox').classList.remove('hidden');
    toast('تم اختيار صورة البطاقة/الشهادة بنجاح', 'ok');
  });
  $('#btnChangeIdCard')?.addEventListener('click', (e) => {
    e.stopPropagation();
    fId.click();
  });

  $('#jForm').addEventListener('submit', submitJoin);
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function resetSched() {
  SCHED = [{ day: '', hour: '' }];
  paintSched();
}

function fillTeachers() {
  const g = $('#jgender').value;
  const list = (TEACHERS || []).filter(t => t.gender === g && t.active !== false);
  $('#jteacher').innerHTML = '<option value="">اختر المعلم…</option>' +
    list.map(t => `<option value="${t.id}">${esc(t.name)} — ${esc(t.track || '')}</option>`).join('');
  resetSched();
}

function curTeacher() {
  const v = $('#jteacher') ? $('#jteacher').value : null;
  return (TEACHERS || []).find(x => String(x.id) === String(v));
}

function fillDaysAvail() {
  const t = curTeacher();
  if (!t) return;
  resetSched();
  if (!(t.days || []).length) toast('هذا المعلم لم يحدد أيامه المتاحة بعد', 'err');
}

function paintSched() {
  const t = curTeacher();
  const days = (t && t.days) || DAYS;
  const hours = (t && t.hours) || SLOTS;

  $('#schedCount').textContent = `عدد الأيام المحجوزة: (${arNum(SCHED.length)} من ٥)`;
  $('#schedBox').innerHTML = SCHED.map((s, i) => `
    <div class="sched-row bg-white p-3 rounded-xl border border-cream-200">
      <div>
        <label class="label !text-[11px] !mb-1">اليوم ${arNum(i + 1)}</label>
        <select class="input !py-1.5 sday text-xs" data-i="${i}" ${days.length ? '' : 'disabled'}>
          <option value="">اختر اليوم…</option>
          ${days.map(d => `<option ${s.day === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="label !text-[11px] !mb-1">الساعة</label>
        <select class="input !py-1.5 shour text-xs" data-i="${i}" ${hours.length && s.day ? '' : 'disabled'}>
          <option value="">اختر الساعة…</option>
          ${hours.map(h => `<option ${s.hour === h ? 'selected' : ''}>${esc(h)}</option>`).join('')}
        </select>
      </div>
      <div>
        ${SCHED.length > 1 ? `<button type="button" class="btn btn-danger btn-sm !px-2.5 !py-2 sdel" data-i="${i}" title="حذف هذا اليوم">✕</button>` : ''}
      </div>
    </div>
  `).join('');

  $$('.sday').forEach(el => el.addEventListener('change', () => {
    SCHED[+el.dataset.i].day = el.value;
    SCHED[+el.dataset.i].hour = '';
    paintSched();
  }));

  $$('.shour').forEach(el => el.addEventListener('change', () => {
    SCHED[+el.dataset.i].hour = el.value;
  }));

  $$('.sdel').forEach(el => el.addEventListener('click', () => {
    SCHED.splice(+el.dataset.i, 1);
    paintSched();
  }));
}

async function submitJoin(e) {
  e.preventDefault();
  const v = id => (($('#' + id) || {}).value || '').trim();
  const errs = [];

  const name = v('jname');
  if (!name || name.split(/\s+/).length < 2) errs.push('يرجى كتابة الاسم كاملًا (رباعيًا أو ثلاثيًا على الأقل).');

  const natId = v('jnatid');
  if (!/^\d{14}$/.test(natId)) errs.push('الرقم القومي يجب أن يتكون من 14 رقمًا دقيقًا.');

  const phone = v('jphone');
  if (!/^01[0125]\d{8}$/.test(phone)) errs.push('رقم الجوال يجب أن يبدأ بـ 01 ويتكون من 11 رقمًا صحيحًا.');

  const email = v('jemail');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errs.push('يرجى إدخال بريد إلكتروني صحيح.');

  const teacherId = v('jteacher');
  if (!teacherId) errs.push('يرجى اختيار المعلم / المعلمة.');

  const validSched = SCHED.filter(s => s.day && s.hour);
  if (!validSched.length) errs.push('يرجى تحديد يوم واحد على الأقل وساعته.');
  if (SCHED.some(s => (s.day && !s.hour) || (s.hour && !s.day))) errs.push('يرجى استكمال اختيار اليوم والساعة لكل صف تم إضافته.');

  const errEl = $('#jErr');
  if (errs.length) {
    errEl.innerHTML = errs.map(x => `• ${esc(x)}`).join('<br>');
    errEl.classList.remove('hidden');
    window.scrollTo({ top: errEl.offsetTop - 80, behavior: 'smooth' });
    return;
  }
  errEl.classList.add('hidden');

  const b = $('#jGo');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span> جارٍ تسجيل البيانات وحفظ المستندات…';

  const newCode = 'MSK-' + Math.floor(100000 + Math.random() * 900000);
  const studentPayload = {
    code: newCode,
    name: name,
    national_id: natId,
    phone: phone,
    email: email,
    age: v('jage') ? parseInt(v('jage')) : null,
    gender: v('jgender'),
    track: v('jtrack'),
    teacher_id: teacherId,
    schedule: validSched,
    avatar_url: AVATAR_DATA,
    id_card_url: IDCARD_DATA,
    status: 'pending',
    created_at: new Date().toISOString()
  };

  try {
    let studentCode = newCode;
    // Attempt RPC or Supabase direct insert
    try {
      const { data, error } = await sb.rpc('msk_register', {
        s: {
          name: name,
          phone: phone,
          age: studentPayload.age,
          gender: studentPayload.gender,
          track: studentPayload.track,
          teacher_id: teacherId,
          schedule: validSched,
          national_id: natId,
          email: email,
          avatar_url: AVATAR_DATA,
          id_card_url: IDCARD_DATA
        }
      });
      if (!error && data) studentCode = data;
    } catch (rpcErr) {
      console.warn('RPC register warning, falling back to direct table insert:', rpcErr);
      const { data, error } = await sb.from('msk_students').insert([{
        code: newCode,
        name: name,
        phone: phone,
        age: studentPayload.age,
        gender: studentPayload.gender,
        track: studentPayload.track,
        teacher_id: teacherId,
        schedule: validSched,
        national_id: natId,
        email: email,
        avatar_url: AVATAR_DATA,
        id_card_url: IDCARD_DATA,
        status: 'pending'
      }]).select();
      if (error) {
        console.warn('Table insert schema issue, will save locally and continue:', error);
      }
    }

    // Always cache locally so the admin and tracking page immediately sees it
    saveStudentLocally(studentPayload);

    window.scrollTo({ top: 0, behavior: 'smooth' });
    const t = curTeacher();
    const schedHtml = validSched.map(s => `
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-gold-500 inline-block"></span>
        <span class="font-bold">${esc(s.day)}</span> — <span class="text-pine-800 font-bold">${esc(s.hour)}</span>
      </div>
    `).join('');

    app.innerHTML = shell(`
      <section class="max-w-xl mx-auto px-4 py-16">
        <div class="card-lux border-t-4 border-t-gold-500 p-8 text-center shadow-2xl">
          
          <div class="w-20 h-20 mx-auto rounded-full bg-emerald-50 text-emerald-600 border border-emerald-200 flex items-center justify-center text-4xl mb-4">
            🎉
          </div>

          <h1 class="font-amiri text-2xl md:text-3xl text-pine-900 font-bold">
            مُبَارَك! تَمَّ تَسْجِيلُكَ بِنَجَاحٍ
          </h1>
          <p class="text-xs text-ink-muted mt-2">أهلاً بك في رحاب مشكاة القرآن الكريم</p>

          <div class="bg-cream-100/90 border border-cream-200 rounded-2xl p-5 mt-6 text-start text-sm space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-ink-muted text-xs">اسم الطالب:</span>
              <b class="text-pine-900 text-base">${esc(name)}</b>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-ink-muted text-xs">الرقم القومي:</span>
              <span class="font-mono text-xs font-bold text-pine-800" dir="ltr">${esc(natId)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-ink-muted text-xs">رقم الجوال:</span>
              <span class="font-mono text-xs font-bold text-pine-800" dir="ltr">${esc(phone)}</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-ink-muted text-xs">المعلم:</span>
              <b class="text-olive-700 font-bold">${esc(t ? t.name : '—')}</b>
            </div>
            <div class="pt-2 border-t border-cream-200/80 space-y-1">
              <span class="text-xs text-ink-muted block mb-1">المواعيد المحجوزة:</span>
              ${schedHtml}
            </div>
          </div>

          <p class="text-xs text-ink-muted mt-6">كود المتابعة الخاص بك:</p>
          <div class="font-mono text-2xl font-bold text-gold-600 bg-gold-50 border-2 border-dashed border-gold-500 rounded-2xl py-2 px-6 inline-block mt-1 select-all">
            ${esc(studentCode)}
          </div>

          <p class="text-xs text-ink-muted mt-5 leading-relaxed max-w-md mx-auto">
            طلبك قيد الاعتماد من المشرف. يمكنك الدخول فورًا لصفحة <b>«متابعتي»</b> برقم هاتفك أو رقمك القومي للاطلاع على تعليمات معلمك والدخول للمقرأة المرئية.
          </p>

          <div class="flex gap-3 justify-center mt-7 flex-wrap">

              العودة للرئيسية
            </a>

        </div>
      </section>

    toast('تم استلام طلب التسجيل بنجاح', 'ok');

    b.innerHTML = 'إتمام التسجيل وحجز المواعيد';
    toast('تعذر التسجيل، يرجى مراجعة البيانات', 'err');

function saveStudentLocally(student) {
  try {
    let local = JSON.parse(localStorage.getItem(LOCAL_STUDS_KEY) || '[]');
    // remove if exists
    local = local.filter(s => s.phone !== student.phone && s.national_id !== student.national_id);
    local.unshift(student);
    localStorage.setItem(LOCAL_STUDS_KEY, JSON.stringify(local));
  } catch (e) {
    console.warn('Local storage error:', e);
  }
}

function getLocalStudents() {
  try {
    return JSON.parse(localStorage.getItem(LOCAL_STUDS_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

async function doLookup() {
  const query = $('#tPhone').value.trim();
  const out = $('#tOut'), b = $('#tGo');

  if (!query || (query.length !== 11 && query.length !== 14)) {
    out.innerHTML = `
      <div class="text-sm bg-amber-50 border border-amber-300 text-amber-900 rounded-xl px-4 py-3">
        يرجى إدخال رقم جوال صحيح (11 رقم) أو رقم قومي (14 رقم).
      </div>`;
    return;

function initJitsiCall(roomId) {
  const container = $('#jitsiContainer');
  if (!container) return;

  if (typeof JitsiMeetExternalAPI === 'undefined') {
    $('#videoFallback')?.classList.remove('hidden');
    return;
  }

  try {
    const domain = 'meet.jit.si';
    const options = {
      roomName: roomId,
      width: '100%',
      height: '100%',
      parentNode: container,
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: false,
        disableDeepLinking: true
      },
      interfaceConfigOverwrite: {
        TOOLBAR_BUTTONS: [
          'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
          'fodeviceselection', 'hangup', 'chat', 'raisehand',
          'videoquality', 'filmstrip', 'tileview'
        ],
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false
      }
    };

    if (jitsiApiInstance) {
      try { jitsiApiInstance.dispose(); } catch (e) {}
    }

    jitsiApiInstance = new JitsiMeetExternalAPI(domain, options);
  } catch (err) {
    console.warn('Jitsi initialization fallback:', err);
    $('#videoFallback')?.classList.remove('hidden');
  }
}

function setupClassroomEvents() {
  const btn = $('#toggleQuranBtn');
  const qCol = $('#quranCol');

  btn?.addEventListener('click', () => {

      vCol.className = 'lg:col-span-12 transition-all duration-300';
      $('#quranBtnText').textContent = 'إظهار المصحف الشريف';

  });

    const num = sSelect.value;

    try {
      const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}/ar.alafasy`);
      const data = await res.json();
      if (data && data.data && data.data.ayahs) {

      txtEl.textContent = 'تعذر تحميل نص السورة، يرجى التحقق من اتصال الإنترنت.';

async function admin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();

  app.innerHTML = shell(`
    <div class="min-h-[60vh] flex flex-col items-center justify-center gap-3">
      <span class="spin dark !w-10 !h-10"></span>
      <p class="text-xs text-pine-800 font-semibold">جارٍ تحميل بيانات لوحة الإدارة…</p>
    </div>
  `);

  try {
    const a = await sb.from('msk_teachers').select('*').order('id');
    if (!a.error) TEACHERS = a.data || [];

    const s = await sb.from('msk_students').select('*').order('created_at', { ascending: false });
    if (!s.error) STUDS = s.data || [];
  } catch (e) {
    console.warn('Admin load error, using local fallback:', e);
  }

  // Merge with local storage students to guarantee new students are visible
  const locals = getLocalStudents();
  if (!STUDS) STUDS = [];
  locals.forEach(ls => {
    if (!STUDS.some(s => s.phone === ls.phone || (ls.id && s.id === ls.id))) {
      STUDS.unshift(ls);
    }
  });

  dash();
}

function readT() {
  $$('.tk').forEach(el => {
    const i = +el.dataset.i, k = el.dataset.k;
    const t = TEACHERS[i];
    if (!t) return;
    if (k === 'active') t.active = el.checked;
    else t[k] = el.value.trim();
  });
}

async function saveAllT() {
  readT();
  if (TEACHERS.some(t => !t.name)) return toast('يرجى كتابة اسم كل معلم بشكل سليم', 'err');
  TEACHERS.forEach(t => {
    if (!Array.isArray(t.days)) t.days = [];
    if (!Array.isArray(t.hours)) t.hours = [];
  });

  const b = $('#saveT');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span> حفظ…';

  try {
    const cur = await sb.from('msk_teachers').select('id');
    if (!cur.error) {
      const keep = TEACHERS.filter(t => t.id).map(t => t.id);
      const del = (cur.data || []).map(x => x.id).filter(id => !keep.includes(id));
      if (del.length) await sb.from('msk_teachers').delete().in('id', del);
    }

    for (const t of TEACHERS.filter(t => t.id)) {
      await sb.from('msk_teachers').update({
        name: t.name,
        gender: t.gender,
        track: t.track,
        meeting_link: t.meeting_link || null,
        days: t.days,
        hours: t.hours,
        active: t.active !== false
      }).eq('id', t.id);
    }

    const news = TEACHERS.filter(t => !t.id).map(t => ({
      name: t.name,
      gender: t.gender,
      track: t.track,
      meeting_link: t.meeting_link || null,
      days: t.days,
      hours: t.hours,
      active: t.active !== false
    }));

    if (news.length) await sb.from('msk_teachers').insert(news);

    const a = await sb.from('msk_teachers').select('*').order('id');
    if (!a.error) TEACHERS = a.data;

    toast('تم حفظ بيانات المعلمين بنجاح', 'ok');
    tTab();
  } catch (e) {
    toast('تعذر الحفظ: ' + e.message, 'err');
  } finally {
    b.disabled = false;
    b.innerHTML = '💾 حفظ التغييرات';
  }
}

        <div class="p-4 rounded-2xl bg-gradient-to-r from-pine-900 to-pine-800 text-cream-50 border border-gold-500/40 flex items-center justify-between">
          <div>
            <b class="text-sm block font-bold text-gold-300">بدء المقرأة المرئية المباشرة</b>
            <span class="text-[11px] text-cream-200/70">الاتصال المباشر مع الطالب بالفيديو والمصحف</span>
          </div>
          <a href="#/classroom/${roomId}" class="btn btn-gold btn-sm !rounded-xl !px-4">
            📹 بدء الجلسة
          </a>
        </div>

        <!-- Documents preview card -->
        <div class="card-lux p-4">
          <p class="text-xs font-bold text-olive-700 mb-2">المستندات والصور المرفوعة:</p>
          <div class="grid grid-cols-2 gap-3 text-center">
            <div class="p-2 border border-cream-200 rounded-xl bg-white">
              <span class="text-[11px] text-ink-muted block mb-1">الصورة الشخصية</span>
              ${s.avatar_url ? `
                <img src="${esc(s.avatar_url)}" class="w-16 h-16 rounded-full mx-auto object-cover border border-gold-400 mb-1 cursor-pointer" onclick="previewDocument('${esc(s.avatar_url)}', 'الصورة الشخصية: ${esc(s.name)}')">
                <button class="text-[10px] text-pine-800 underline" onclick="previewDocument('${esc(s.avatar_url)}', 'الصورة الشخصية: ${esc(s.name)}')">تكبير 🔍</button>
              ` : '<span class="text-[10px] text-ink-faint block py-4">غير مرفوعة</span>'}
            </div>

            <div class="p-2 border border-cream-200 rounded-xl bg-white">
              <span class="text-[11px] text-ink-muted block mb-1">صورة الهوية / الشهادة</span>
              ${s.id_card_url ? `
                <img src="${esc(s.id_card_url)}" class="w-20 h-12 rounded-lg mx-auto object-cover border border-gold-400 mb-1 cursor-pointer" onclick="previewDocument('${esc(s.id_card_url)}', 'صورة المستند: ${esc(s.name)}')">
                <button class="text-[10px] text-pine-800 underline" onclick="previewDocument('${esc(s.id_card_url)}', 'صورة المستند: ${esc(s.name)}')">معاينة المستند 🔍</button>
              ` : '<span class="text-[10px] text-ink-faint block py-4">غير مرفوعة</span>'}
            </div>
          </div>
        </div>

        <!-- Teacher and Sched details -->
        <div class="card-lux p-4 text-xs">
          <div class="flex items-center justify-between mb-1">
            <span class="text-ink-muted">المعلم المشرف:</span>
            <b class="text-pine-900">${esc(t ? t.name : '—')}</b>
          </div>
          <div class="flex items-center justify-between mb-1">
            <span class="text-ink-muted">المسار:</span>
            <b class="text-olive-700">${esc(s.track || '—')}</b>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-ink-muted">المواعيد:</span>
            <span class="font-bold">${esc(sch || '—')}</span>
          </div>
        </div>

        <!-- Status & Level -->
        <div class="card-lux p-4 grid grid-cols-2 gap-3">
          <div>
            <label class="label !text-xs !mb-1">حالة القبول</label>
            <select id="eSt" class="input text-xs">
              ${Object.entries(MST).map(([k, v]) => `<option value="${k}" ${s.status === k ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="label !text-xs !mb-1">المستوى</label>
            <select id="eLv" class="input text-xs">
              <option value="">غير محدد</option>
              ${LVL.map(l => `<option ${s.level === l ? 'selected' : ''}>${l}</option>`).join('')}
            </select>
          </div>
        </div>

        <!-- Progress -->
        <div class="card-lux p-4">
          <label class="label !text-xs !mb-1">حفظ الطالب وتقدمه الحالي</label>
          <textarea id="ePr" rows="3" class="input text-xs" placeholder="مثال: أتم حفظ جزء عمّ بامتياز، وبدأ في سورة البقرة...">${esc(s.progress || '')}</textarea>
        </div>

        <!-- Instructions -->
        <div class="card-lux p-4">
          <label class="label !text-xs !mb-1">تعليمات وواجبات المعلم للطالب</label>
          <textarea id="eIn" rows="3" class="input text-xs" placeholder="مثال: مراجعة أحكام النون الساكنة والتسميع الأربعاء القادم...">${esc(s.instructions || '')}</textarea>
          
          <label class="label !text-xs !mb-1 mt-3">رابط لقاء خارجي مخصص (اختياري)</label>
          <input id="eLk" dir="ltr" class="input text-xs" value="${esc(s.link || '')}" placeholder="https://meet.google.com/...">
        </div>

        <!-- Action buttons -->
        <div class="space-y-2 pt-2">
          <button id="eSave" data-id="${s.id || s.code}" class="btn btn-primary w-full !py-3 !rounded-xl shadow-glow-pine text-sm font-bold">
            💾 حفظ التعديلات وتحديث صفحة الطالب
          </button>
          <button id="btnDeleteStudentDrawer" data-id="${s.id || s.code}" class="btn btn-danger w-full !py-2.5 !rounded-xl text-xs">
            🗑️ حذف هذا الطالب نهائيًا
          </button>
        </div>

      </div>
    </aside>
  `;

  $('#eSave').addEventListener('click', () => saveStudentChanges(s.id || s.code));
  $('#btnDeleteStudentDrawer').addEventListener('click', () => confirmDeleteStudent(s.id || s.code, s.name));
}

async function saveStudentChanges(id) {
  const b = $('#eSave');
  b.disabled = true;
  b.innerHTML = '<span class="spin"></span> جارٍ الحفظ…';

  const patch = {
    status: $('#eSt').value,
    level: $('#eLv').value || null,
    progress: $('#ePr').value.trim() || null,
    instructions: $('#eIn').value.trim() || null,
    link: $('#eLk').value.trim() || null
  };

  try {
    // 1. Try Supabase update
    await sb.from('msk_students').update(patch).or(`id.eq.${id},code.eq.${id}`);
  } catch (err) {
    console.warn('Update db fallback:', err);
  }

  // Update in local memory and local storage
  const s = (STUDS || []).find(x => String(x.id) === String(id) || String(x.code) === String(id));
  if (s) {
    Object.assign(s, patch);
    saveStudentLocally(s);
  }

  toast('تم حفظ التعديلات وظهرت في صفحة الطالب فورًا', 'ok');
  closeL();
  sTab();
}

/* ─── حذف الطالب مع التأكيد الأمني ─── */
function confirmDeleteStudent(id, name) {
  modal(`
    <div class="text-center p-2">
      <div class="w-16 h-16 rounded-full bg-rose-100 text-rose-600 border border-rose-300 flex items-center justify-center text-3xl mx-auto mb-3">
        ⚠️
      </div>
      <h3 class="font-amiri text-2xl text-pine-900 font-bold mb-2">تأكيد حذف الطالب</h3>
      <p class="text-sm text-ink-muted leading-relaxed mb-6">
        هل أنت متأكد من رغبتك في حذف الطالب <b class="text-pine-900">«${esc(name)}»</b> من المنصة؟
        <br><span class="text-xs text-rose-700">سيتم حذف بياناته وسجل مواعيده بالكامل ولا يمكن التراجع.</span>
      </p>

      <div class="flex justify-center gap-3">
        <button class="btn btn-outline btn-sm !rounded-xl !px-6" data-close>إلغاء</button>
        <button id="btnConfirmDeleteFinal" class="btn btn-danger btn-sm !rounded-xl !px-6">
          نعم، احذف الطالب
        </button>
      </div>
    </div>
  `);

  $('#btnConfirmDeleteFinal').addEventListener('click', async () => {
    const btn = $('#btnConfirmDeleteFinal');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> جارٍ الحذف…';

    try {
      // 1. Try Supabase delete
      await sb.from('msk_students').delete().or(`id.eq.${id},code.eq.${id}`);
    } catch (e) {
      console.warn('Supabase delete error:', e);
    }

    // 2. Remove from local storage and memory
    try {
      let local = getLocalStudents();
      local = local.filter(x => String(x.id) !== String(id) && String(x.code) !== String(id));
      localStorage.setItem(LOCAL_STUDS_KEY, JSON.stringify(local));
    } catch (e) {}

    STUDS = (STUDS || []).filter(x => String(x.id) !== String(id) && String(x.code) !== String(id));

    toast(`تم حذف الطالب «${name}» بنجاح`, 'ok');
    closeL();
    sTab();
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   أحداث الصفحة العامة (Delegated Click Handlers)
   ══════════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  const t = e.target;

  if (t.closest('[data-close]') || t.classList.contains('overlay')) {
    closeL();
    return;
  }

  // Teacher Schedule Chips
  const chip = e.target.closest('.chip2');
  if (chip) {
    const i = +chip.dataset.ci, arr = chip.dataset.arr, v = chip.dataset.v;
    const tc = (TEACHERS || [])[i];
    if (tc) {
      if (!tc[arr]) tc[arr] = [];
      const ix = tc[arr].indexOf(v);
      if (ix > -1) tc[arr].splice(ix, 1);
      else tc[arr].push(v);
      chip.classList.toggle('on');
    }
    return;
  }

  if (!btn) return;

  // Tabs on dashboard
  if (btn.dataset.tab) {
    TAB = btn.dataset.tab;
    dash();
    return;
  }

  // Logout
  if (btn.id === 'lOut') {
    await sb.auth.signOut();
    TEACHERS = null;
    STUDS = null;
    admin();
    return;
  }

  // Teacher actions
  if (btn.id === 'addT') {
    readT();
    (TEACHERS = TEACHERS || []).push({
      name: '',
      gender: 'ذكر',
      track: TRACKS[0].name,
      days: [],
      hours: [],
      active: true
    });
    paintT();
    return;
  }

  if (btn.id === 'saveT') {
    saveAllT();
    return;
  }

  if (btn.classList.contains('delT')) {
    readT();
    TEACHERS.splice(+btn.dataset.i, 1);
    paintT();
    return;
  }

  // Student actions
  if (btn.classList.contains('editS')) {
    openS(btn.dataset.id);
    return;
  }

  if (btn.classList.contains('delS')) {
    const s = (STUDS || []).find(x => String(x.id) === String(btn.dataset.id) || String(x.code) === String(btn.dataset.id));
    confirmDeleteStudent(btn.dataset.id, s ? s.name : 'الطالب');
    return;
  }
});

/* ══════════════════════════════════════════════════════════════════════════════
   التوجيه والراوتر (Hash Routing)
   ══════════════════════════════════════════════════════════════════════════════ */
async function route() {
  const raw = (location.hash || '#/').slice(2).split('/');
  const page = raw[0] || 'home';
  const param = raw[1] ? decodeURIComponent(raw[1]) : null;

  window.scrollTo(0, 0);
  document.title = ({
    join: 'التسجيل في الحلقات — ',
    track: 'متابعتي والمقرأة — ',
    classroom: 'المقرأة المرئية المباشرة — ',
    admin: 'لوحة الإدارة — '
  }[page] || '') + SITE.name + ' — منصة تعليم القرآن الكريم';

  if (page === 'join') return join(param);
  if (page === 'track') return track();
  if (page === 'classroom') return classroom(param);
  if (page === 'admin') return admin();
  return home();
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => {
  initWelcomeScreen();
  route();
});
(function() {
  initWelcomeScreen();
  route();
})();
</script>
