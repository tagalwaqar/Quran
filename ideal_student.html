const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arNum = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

function toast(msg, type = 'info') {
  const container = $('#toasts');
  if (!container) return;
  const t = document.createElement('div');
  t.className = `toast-msg ${type === 'err' || type === 'error' ? 'error' : (type === 'ok' || type === 'success' ? 'success' : '')}`;
  t.innerHTML = `
    <span class="text-xl">${type === 'err' || type === 'error' ? '⚠️' : (type === 'ok' || type === 'success' ? '✨' : 'ℹ️')}</span>
    <span class="font-medium">${esc(msg)}</span>
  `;
  container.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 400);
  }, 4000);
}

// ===== بصمة الجهاز ومنع التكرار =====
function getVoterFingerprint() {
  let fp = localStorage.getItem('ideal_voter_fp');
  if (!fp) {
    const parts = [
      navigator.userAgent,
      screen.width + 'x' + screen.height,
      new Date().getTimezoneOffset(),
      navigator.language,
      Date.now() + '_' + Math.random().toString(36).slice(2)
    ];
    fp = btoa(parts.join('|')).slice(0, 48);
    localStorage.setItem('ideal_voter_fp', fp);
  }
  return fp;
}

function hasVoted() {
  return localStorage.getItem('ideal_voted') === '1' || S.voterVoted;
}

function markVoted(candidateId, phone) {
  localStorage.setItem('ideal_voted', '1');
  S.voterVoted = true;
  if (candidateId) {
    S.votedCandidateId = candidateId;
    localStorage.setItem('ideal_voted_for', String(candidateId));
  }

}

// ===== تحميل وحفظ الإعدادات من Supabase =====
async function loadSettings() {
  try {
    const { data, error } = await sb.from('ideal_student_settings').select('key,value');
    if (error) throw error;
    (data || []).forEach(r => {
      const v = r.value;
      if (r.key === 'phase') S.phase = (typeof v === 'string' ? v : (v && v.toString ? v.toString() : 'registration')) || 'registration';
      else if (r.key === 'registration_open') S.registration_open = (v === true || v === 'true' || v === 1);
      else if (r.key === 'voting_open') S.voting_open = (v === true || v === 'true' || v === 1);
      else if (r.key === 'results_visible') S.results_visible = (v === true || v === 'true' || v === 1);
      else if (r.key === 'phase_deadline') {
        if (v) { try { S.phaseDeadline = new Date(typeof v === 'string' ? v : v).getTime(); } catch(e){} }
      }
      else if (r.key === 'competition_rules') {
        try {
          const parsed = typeof v === 'string' ? JSON.parse(v) : v;
          if (Array.isArray(parsed) && parsed.length > 0) {
            S.rules = parsed;
          }
        } catch(e) {
          if (typeof v === 'string' && v.trim()) {
            S.rules = v.split('\n').map(s => s.trim()).filter(Boolean);
          }
        }
      }
    });
    if (!S.phaseDeadline) S.phaseDeadline = Date.now() + 7 * 86400000;
  } catch (e) {
    console.warn('loadSettings:', e);
    S.phaseDeadline = S.phaseDeadline || (Date.now() + 7 * 86400000);
  }
}

async function saveSetting(key, value) {
  try {
    const jsonValue = (typeof value === 'object') ? JSON.stringify(value) : (typeof value === 'string' ? value : JSON.stringify(value));
    const { error } = await sb.from('ideal_student_settings')
      .upsert({ key: key, value: jsonValue }, { onConflict: 'key' });
    if (error) throw error;
    return true;
  } catch (e) {
    console.error('saveSetting failed for', key, ':', e);
    throw e;
  }
}

async function loadCandidates() {
  try {
    const { data, error } = await sb.from('ideal_student_applications')
      .select('*')
      .eq('status', 'approved')
      .order('created_at', { ascending: true });
    if (error) throw error;
    S.candidates = data || [];
  } catch (e) {
    console.error('loadCandidates:', e);
    S.candidates = [];
  }
}

async function loadVoteCounts() {
  if (!S.candidates.length) { S.voteCounts = {}; return; }
  try {
    const { data, error } = await sb.from('ideal_student_votes')
      .select('candidate_id')
      .in('candidate_id', S.candidates.map(c => c.id));
    if (error) throw error;
    const counts = {};
    (data || []).forEach(v => { counts[v.candidate_id] = (counts[v.candidate_id] || 0) + 1; });
    S.voteCounts = counts;
  } catch (e) { console.error('loadVoteCounts:', e); }
}

// ضغط الصور ورفعها
function compressImg(file, maxDim) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const sc = Math.min(1, maxDim / (img.naturalWidth || maxDim));
        const w = Math.max(1, Math.round(img.naturalWidth * sc));
        const h = Math.max(1, Math.round(img.naturalHeight * sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? res(b) : rej(new Error('تعذر ضغط الصورة')), 'image/jpeg', 0.82);
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ملف صورة غير صالح')); };
    img.src = url;
  });
}

async function uploadPhoto(blob) {
  const tok = crypto.randomUUID ? crypto.randomUUID() : ('t' + Date.now() + Math.random().toString(36).slice(2));
  const path = tok + '/ideal-student.jpg';

  if (error) throw error;
  return SUPABASE_URL + '/storage/v1/object/public/' + APPB + '/' + path;
}

// الاحتفال بالنتائج
function loadConfettiLib() {
  if (window.confetti || confettiLoaded) return Promise.resolve();
  confettiLoaded = true;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js';
    s.onload = () => resolve();
    s.onerror = () => { confettiLoaded = false; reject(new Error('confetti load failed')); };
    document.head.appendChild(s);
  });
}

async function fireConfetti() {
  try { await loadConfettiLib(); } catch (e) { return; }
  if (!window.confetti) return;
  const colors = ['#d4af37','#f1d77e','#0b2b1f','#ffffff','#23906a'];
  window.confetti({ particleCount: 160, spread: 100, startVelocity: 45, origin: { y: 0.6 }, colors });
}

// العد التنازلي
function startCountdown() {
  if (countdownInterval) clearInterval(countdownInterval);
  updateCountdown();
  countdownInterval = setInterval(updateCountdown, 1000);
}

function updateCountdown() {
  const daysEl = $('#cd-days');
  if (!daysEl) return;
  const deadline = S.phaseDeadline || (Date.now() + 7 * 86400000);
  let diff = Math.max(0, deadline - Date.now());
  const days = Math.floor(diff / 86400000); diff -= days * 86400000;
  const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
  const mins = Math.floor(diff / 60000); diff -= mins * 60000;
  const secs = Math.floor(diff / 1000);
  const pad = n => arNum(String(n).padStart(2, '0'));

  daysEl.textContent = pad(days);
  const hEl = $('#cd-hours'); if (hEl) hEl.textContent = pad(hours);
  const mEl = $('#cd-mins');  if (mEl) mEl.textContent = pad(mins);
  const sEl = $('#cd-secs');  if (sEl) sEl.textContent = pad(secs);
}

function wireRegForm() {
  const photoFile = $('#photoFile');
  let photoBlob = null;

  if (photoFile) {
    photoFile.addEventListener('change', async e => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        photoBlob = await compressImg(f, 800);
        const url = URL.createObjectURL(photoBlob);
        $('#photoPrev').innerHTML = `<img src="${url}" class="w-full h-full object-cover">`;
      } catch (err) { toast(err.message || 'تعذر معالجة الصورة', 'err'); }
    });
  }

  const natInput = $('#national_id');
  if (natInput) {
    natInput.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '').slice(0, 14);
      e.target.value = v;
      if (v.length === 14 && /^[23]/.test(v)) {
        const yy = +v.slice(1, 3), mm = +v.slice(3, 5), dd = +v.slice(5, 7);
        const year = (v[0] === '2' ? 1900 : 2000) + yy;
        const bd = $('#birth_date');
        if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31 && bd && !bd.value) {
          bd.value = `${year}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
        }
      }
    });
  }

  const form = $('#regForm');
  if (!form) return;
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const v = id => (($('#'+id) || {}).value || '').trim();
    const errs = {};

    if (!v('full_name') || v('full_name').split(/\s+/).length < 3) errs.full_name = 'يرجى كتابة الاسم ثلاثياً أو رباعياً';
    if (!v('national_id') || !/^[23]\d{13}$/.test(v('national_id'))) errs.national_id = 'الرقم القومي يجب أن يتكون من 14 رقم صحيح';
    if (!v('birth_date')) errs.birth_date = 'تاريخ الميلاد مطلوب';
    if (!v('guardian_name')) errs.guardian_name = 'اسم ولي الأمر مطلوب';
    if (!/^01[0125]\d{8}$/.test(v('guardian_phone'))) errs.guardian_phone = 'رقم الهاتف يجب أن يكون مصرياً صحيحاً (11 رقم)';
    if (!v('memorized')) errs.memorized = 'مقدار الحفظ مطلوب';
    if (!$('#agree1').checked) errs.agree1 = 'يجب الموافقة والإقرار بصحة البيانات والشروط';

    $$('#regForm .field').forEach(f => {
      const p = f.querySelector('.err');
      if (errs[f.dataset.f]) {
        f.classList.add('invalid');
        if (p) { p.textContent = errs[f.dataset.f]; p.classList.remove('hidden'); }
      } else {
        f.classList.remove('invalid');
        if (p) p.classList.add('hidden');
      }
    });

    if (Object.keys(errs).length) {
      toast('يرجى مراجعة الحقول المطلوبة والموافقة على الشروط', 'err');
      return;
    }

    const btn = $('#submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loader-spinner"></span> جارٍ حفظ الطلب وإرساله…';

    try {
      const bd = new Date(v('birth_date') + 'T00:00:00');
      const age = new Date().getFullYear() - bd.getFullYear();

      let photoPath = null;
      if (photoBlob) photoPath = await uploadPhoto(photoBlob);

      const payload = {
        full_name: v('full_name'),
        national_id: v('national_id'),
        birth_date: v('birth_date'),
        age: age,
        level_id: null,
        level_name: '',
        village: 'كفر يوسف حنس',
        guardian_name: v('guardian_name'),
        guardian_phone: v('guardian_phone'),
        memorized: v('memorized'),
        bio: v('bio'),
        photo_path: photoPath,
        status: 'pending'
      };

      const { error } = await sb.from('ideal_student_applications').insert([payload]);
      if (error) throw error;

      toast('تم تقديم طلب الترشح بنجاح! سيتم مراجعته من الإدارة.', 'ok');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => location.hash = '#/', 1500);
    } catch (err) {
      const msg = err.message || '';
      if (msg.includes('duplicate') || msg.includes('national_id')) {
        $('#formErr').textContent = 'تم تسجيل طلب ترشح مسبق بهذا الرقم القومي.';
      } else {
        $('#formErr').textContent = 'تعذّر إرسال الطلب: ' + msg;
      }
      $('#formErr').classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '✨ إرسال طلب الترشح للمراجعة';
    }
  });
}

function renderVotingPhase() {
  if (!S.voting_open) {
    return `
      <section class="max-w-2xl mx-auto px-4 py-12">
        <div class="card-elevation p-10 text-center border-t-4 border-t-goldTheme-500">
          <span class="text-5xl block mb-3">⏳</span>

        </div>
      </section>
    `;
  }

  if (!S.candidates.length) {
    return `
      <section class="max-w-2xl mx-auto px-4 py-12">
        <div class="card-elevation p-10 text-center">
          <span class="text-5xl block mb-3">👥</span>

      </section>
    `;
  }

  const voted = hasVoted();
  const storedVotedFor = +localStorage.getItem('ideal_voted_for');

  const cards = S.candidates.map((c, idx) => {
    const isVoted = voted && (S.votedCandidateId === c.id || storedVotedFor === c.id);
    let actionBtn;
    if (isVoted) {
      actionBtn = '<div class="w-full mt-4 py-2.5 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-xl font-bold text-xs">✓ تم تصويتك لهذا المرشح</div>';
    } else if (voted) {
      actionBtn = '<div class="w-full mt-4 py-2.5 bg-sandTheme-100 text-sandTheme-800/60 rounded-xl font-medium text-xs">لقد صوّت بالفعل</div>';
    } else {
      actionBtn = `<button class="btn-action btn-gold-royal w-full mt-4 vote-btn !py-2.5 !rounded-xl !text-sm" data-id="${c.id}">🗳️ تصويت للمرشح</button>`;
    }

    return `
      <div class="candidate-card-royal ${isVoted ? '!border-emerald-500 ring-2 ring-emerald-400' : ''}">
        <span class="candidate-index-pill">${arNum(idx + 1)}</span>
        <div class="candidate-avatar-wrap">
          ${c.photo_path 
            ? `<img src="${esc(c.photo_path)}" class="candidate-avatar" alt="${esc(c.full_name)}" onerror="this.remove()">` 
            : `<div class="w-full h-full flex items-center justify-center text-4xl text-goldTheme-300">👤</div>`
          }
        </div>
        <h3 class="font-amiri text-xl font-bold text-emeraldTheme-950 mt-4 leading-tight">${esc(c.full_name)}</h3>
        <p class="text-xs text-sandTheme-800/80 mt-2 min-h-[2.5rem] line-clamp-2 font-tajawal">${esc(c.bio || 'مرشح متميز في مسابقة الطالب المثالي')}</p>
        
        <div class="flex flex-wrap justify-center gap-1.5 mt-3 text-[11px] text-emeraldTheme-900 font-medium font-tajawal">
          <span class="bg-sandTheme-100 px-2.5 py-1 rounded-md">📍 كفر يوسف حنس</span>
          ${c.age != null ? `<span class="bg-sandTheme-100 px-2.5 py-1 rounded-md">🎯 ${arNum(c.age)} سنة</span>` : ''}
          ${c.memorized ? `<span class="bg-sandTheme-100 px-2.5 py-1 rounded-md">📖 ${esc(c.memorized)}</span>` : ''}
        </div>

        ${actionBtn}
      </div>
    `;
  }).join('');

  return `
    <section class="max-w-6xl mx-auto px-4 py-8">
      <div class="text-center mb-10">
        <span class="tag-badge tag-badge-green mb-2">🗳️ مرحلة الجمهور</span>
        <h2 class="font-amiri text-3xl sm:text-4xl text-emeraldTheme-900 font-bold">قائمة المرشحين للتصويت</h2>
        <div class="w-24 h-1 bg-gold-metallic mx-auto mt-3 rounded-full"></div>
        <p class="text-sm text-sandTheme-800/80 mt-3 font-tajawal">لكل جهاز ومستخدم صوت واحد فقط للمرشح الذي تراه جديراً باللقب</p>
      </div>

      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        ${cards}
      </div>
    </section>
  `;
}

function wireVotingPhase() {
  if (!S.voting_open || !S.candidates.length) return;
  if (hasVoted()) return;

  $$('.vote-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = +btn.dataset.id;
      const candidate = S.candidates.find(c => c.id === id);
      if (!candidate) return;

      if (!confirm(`هل ترغب بالتأكيد في منح صوتك للمرشح: "${candidate.full_name}"؟`)) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="loader-spinner"></span> جارٍ تسجيل الصوت…';

      try {
        const fp = getVoterFingerprint();
        const { error } = await sb.from('ideal_student_votes').insert([{
          candidate_id: id,
          voter_fingerprint: fp,
          voter_phone: null
        }]);

        if (error) {
          if (error.message.includes('duplicate') || error.code === '23505') {
            markVoted(id);
            toast('لقد قمت بالتصويت مسبقاً من هذا الجهاز', 'err');
            render();
            return;
          }
          throw error;
        }

        markVoted(id);
        toast(`تم تسجيل صوتك بنجاح للمرشح: ${candidate.full_name}`, 'ok');
        render();
        loadStats().then(renderStats);
      } catch (err) {
        toast('تعذر تسجيل الصوت: ' + err.message, 'err');
        btn.disabled = false;
        btn.innerHTML = '🗳️ تصويت للمرشح';
      }
    });
  });
}

// ===== تصدير بيانات المتقدمين إلى ملف Excel =====
async function exportApplicantsToExcel() {
  try {
    toast('جارٍ تحضير ملف الإكسيل...', 'info');

    // إذا لم تكن البيانات محملة بعد، نجلبها مباشرة من Supabase
    let apps = S.allApps;
    if (!apps || apps.length === 0) {
      const { data, error } = await sb.from('ideal_student_applications')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;
      apps = data || [];
      S.allApps = apps;
    }

    if (!apps || apps.length === 0) {
      toast('لا توجد بيانات متقدمين لتصديرها حالياً', 'err');
      return;
    }

    // تجهيز صفوف البيانات بعناوين عربية وتنسيق واضح
    const excelRows = apps.map((app, index) => {
      let statusAr = 'قيد المراجعة';
      if (app.status === 'approved') statusAr = 'معتمد';
      else if (app.status === 'rejected') statusAr = 'مرفوض';

      return {
        'م': index + 1,
        'الاسم الرباعي': app.full_name || '',
        'الرقم القومي': app.national_id ? String(app.national_id) : '',
        'تاريخ الميلاد': app.birth_date ? String(app.birth_date).slice(0, 10) : '',
        'السن (بالسنوات)': app.age != null ? app.age : '',
        'القرية': app.village || 'كفر يوسف حنس',
        'اسم ولي الأمر': app.guardian_name || '',
        'هاتف ولي الأمر': app.guardian_phone ? String(app.guardian_phone) : '',
        'مقدار الحفظ': app.memorized || '',
        'حالة الطلب': statusAr,
        'تاريخ التسجيل': app.created_at ? new Date(app.created_at).toLocaleString('ar-EG') : '',
        'نبذة عن المتسابق': app.bio || '',
        'رابط الصورة الشخصية': app.photo_path || 'لا يوجد'
      };
    });

    // استخدام مكتبة SheetJS لتوليد ملف XLSX حقيقي
    if (window.XLSX) {
      const ws = XLSX.utils.json_to_sheet(excelRows);

      // ضبط اتجاه الورقة من اليمين لليسار (RTL)
      ws['!views'] = [{ rightToLeft: true }];

      // تحديد عرض مناسب للأعمدة ليظهر الإكسيل منظم ومريح للقراءة
      ws['!cols'] = [
        { wch: 6 },   // م
        { wch: 28 },  // الاسم الرباعي
        { wch: 18 },  // الرقم القومي
        { wch: 14 },  // تاريخ الميلاد
        { wch: 14 },  // السن
        { wch: 16 },  // القرية
        { wch: 24 },  // اسم ولي الأمر
        { wch: 16 },  // هاتف ولي الأمر
        { wch: 30 },  // مقدار الحفظ
        { wch: 15 },  // حالة الطلب
        { wch: 22 },  // تاريخ التسجيل
        { wch: 40 },  // نبذة
        { wch: 45 }   // رابط الصورة
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'المتقدمين للمسابقة');

      const fileName = `بيانات_المتقدمين_مسابقة_الطالب_المثالي_${todayISO()}.xlsx`;
      XLSX.writeFile(wb, fileName);

      toast('تم تحميل شيت الإكسيل بنجاح! 📊', 'ok');
    } else {
      // بديل احتياطي فائق التوافق (CSV مع UTF-8 BOM لفتح العربي بسلاسة)
      exportApplicantsToCSVFallback(excelRows);
    }
  } catch (err) {
    console.error('Export Excel Error:', err);
    toast('تعذر تصدير الملف: ' + err.message, 'err');
  }
}
window.exportApplicantsToExcel = exportApplicantsToExcel;

// تصدير احتياطي CSV مع دعم كامل للغة العربية (BOM)
function exportApplicantsToCSVFallback(rows) {
  if (!rows || !rows.length) return;
  const headers = Object.keys(rows[0]);
  const csvContent = [
    headers.join(','),
    ...rows.map(row => headers.map(h => `"${String(row[h] || '').replace(/"/g, '""')}"`).join(','))
  ].join('\r\n');

  // \uFEFF يضمن أن مايكروسوفت إكسيل يفتح الملف بالترميز العربي دون رموز غريبة
  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `بيانات_المتقدمين_${todayISO()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('تم تحميل ملف المتقدمين (CSV)', 'ok');
}

      msgEl.className = 'text-xs bg-rose-50 border border-rose-300 text-rose-800 rounded-xl p-3 font-tajawal';
      msgEl.classList.remove('hidden');

  }

  try {
    await saveSetting('competition_rules', rulesArray);
    S.rules = rulesArray;
    toast('تم حفظ الشروط بنجاح وتحديث الواجهة الرئيسية', 'ok');
    
    if (msgEl) {
      msgEl.textContent = '✅ تم حفظ الشروط بنجاح! يتم الآن عرضها في الواجهة الرئيسية للموقع.';
      msgEl.className = 'text-xs bg-emerald-50 border border-emerald-300 text-emerald-800 rounded-xl p-3 font-tajawal';
      msgEl.classList.remove('hidden');
    }
  } catch (e) {
    toast('تعذر حفظ الشروط: ' + e.message, 'err');
    if (msgEl) {
      msgEl.textContent = '❌ تعذر حفظ الشروط في قاعدة البيانات: ' + e.message;
      msgEl.className = 'text-xs bg-rose-50 border border-rose-300 text-rose-800 rounded-xl p-3 font-tajawal';
      msgEl.classList.remove('hidden');
    }
  }
}
window.saveCompetitionRules = saveCompetitionRules;

function resetDefaultRules() {
  if (!confirm('هل تريد استعادة الشروط النموذجية الافتراضية؟')) return;
  const input = $('#rulesInput');
  if (input) input.value = DEFAULT_RULES.join('\n');
}
window.resetDefaultRules = resetDefaultRules;

// تحديث مرحلة المسابقة
async function setPhase(phase) {
  const updates = { phase };
  if (phase === 'registration') { updates.registration_open = true; updates.voting_open = false; updates.results_visible = false; }
  if (phase === 'voting') { updates.registration_open = false; updates.voting_open = true; updates.results_visible = false; }
  if (phase === 'results') { updates.registration_open = false; updates.voting_open = false; updates.results_visible = true; }
  updates.phase_deadline = new Date(Date.now() + 7 * 86400000).toISOString();

  try {
    await Promise.all(Object.entries(updates).map(([k, v]) => saveSetting(k, v)));
    Object.assign(S, updates);
    S.phaseDeadline = new Date(updates.phase_deadline).getTime();
    toast('تم تغيير مرحلة المسابقة بنجاح', 'ok');
    if (phase === 'results') {
      await loadCandidates();
      await loadVoteCounts();
    }
    render();
    startCountdown();
    if (S.adminLogged) loadAllApps();
    loadStats().then(renderStats);
  } catch (e) {
    toast('تعذر التحديث: ' + e.message, 'err');
  }
}
window.setPhase = setPhase;

function adminLogout() {
  S.adminLogged = false;
  location.hash = '#/';
  render();
}
window.adminLogout = adminLogout;

// ===== إدارة طلبات الترشح في لوحة الإدارة =====
async function loadAllApps() {
  try {
    const { data, error } = await sb.from('ideal_student_applications')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) throw error;

    const allApps = data || [];
    S.allApps = allApps;
    const box = $('#appsList');
    if (!box) return;

    if (!allApps.length) {
      box.innerHTML = '<p class="text-center text-sandTheme-800/60 py-8 font-tajawal">لا توجد طلبات ترشح مسجلة حتى الآن</p>';
      return;
    }

    box.innerHTML = allApps.map(a => {
      const isAppr = a.status === 'approved';
      return `
        <div class="border border-sandTheme-200 rounded-xl p-4 bg-white flex items-start justify-between gap-4 flex-wrap">
          <div class="flex items-start gap-3">
            <div class="w-12 h-12 rounded-xl bg-emeraldTheme-900 overflow-hidden shrink-0 border border-goldTheme-300">
              ${a.photo_path ? `<img src="${esc(a.photo_path)}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-goldTheme-200">👤</div>`}
            </div>
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <h4 class="font-amiri text-lg font-bold text-emeraldTheme-950">${esc(a.full_name)}</h4>
                <span class="tag-badge ${isAppr ? 'tag-badge-green' : 'tag-badge-gold'} text-[10px]">${isAppr ? 'معتمد' : 'بانتظار الاعتماد'}</span>
              </div>
              <p class="text-xs text-sandTheme-800/70 font-tajawal mt-1">
                قرية كفر يوسف حنس • الحفظ: ${esc(a.memorized || 'غير محدد')} • هاتف: <span dir="ltr" class="font-mono">${esc(a.guardian_phone || '')}</span>
              </p>
              ${a.bio ? `<p class="text-xs text-sandTheme-800/90 mt-1 line-clamp-1 font-tajawal">${esc(a.bio)}</p>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-2">
            ${isAppr 
              ? `<button onclick="rejectApp(${a.id})" class="btn-action btn-outline-gold !py-1.5 !px-3 !text-xs">إلغاء الاعتماد</button>`
              : `<button onclick="approveApp(${a.id})" class="btn-action btn-emerald-royal !py-1.5 !px-3 !text-xs">✓ اعتماد المرشح</button>`
            }
            <button onclick="deleteApp(${a.id})" class="btn-action !bg-rose-50 !text-rose-700 !border-rose-200 !py-1.5 !px-3 !text-xs hover:!bg-rose-100">حذف</button>
          </div>
        </div>
      `;
    }).join('');
  } catch (e) {
    const box = $('#appsList');
    if (box) box.innerHTML = '<p class="text-center text-rose-600 py-6">تعذر تحميل البيانات: ' + esc(e.message) + '</p>';
  }
}
window.loadAllApps = loadAllApps;

async function approveApp(id) {
  try {
    const { error } = await sb.from('ideal_student_applications').update({ status: 'approved' }).eq('id', id);
    if (error) throw error;
    toast('تم اعتماد المرشح بنجاح', 'ok');
    loadAllApps();
    loadCandidates();
    loadStats().then(renderStats);
  } catch (e) { toast('تعذر الاعتماد: ' + e.message, 'err'); }
}
window.approveApp = approveApp;

async function rejectApp(id) {
  try {
    const { error } = await sb.from('ideal_student_applications').update({ status: 'pending' }).eq('id', id);
    if (error) throw error;
    toast('تم تحويل المرشح إلى قيد المراجعة', 'ok');
    loadAllApps();
    loadCandidates();
    loadStats().then(renderStats);
  } catch (e) { toast('تعذر التعديل: ' + e.message, 'err'); }
}
window.rejectApp = rejectApp;

async function deleteApp(id) {
  if (!confirm('هل أنت متأكد من حذف هذا الطلب نهائياً؟')) return;
  try {
    const { error } = await sb.from('ideal_student_applications').delete().eq('id', id);
    if (error) throw error;
    toast('تم حذف الطلب', 'ok');
    loadAllApps();
    loadCandidates();
    loadStats().then(renderStats);
  } catch (e) { toast('تعذر الحذف: ' + e.message, 'err'); }
}
window.deleteApp = deleteApp;

// ===== الراوتر والعرض العام =====
async function route() {
  const hash = (location.hash || '#/').replace(/^#\/?/, '');
  const page = hash.split('?')[0].split('/')[0] || 'home';
  window.scrollTo(0, 0);

  await loadSettings();

  if (page === 'admin') {
    if (S.adminLogged) {
      renderAdmin();
      loadAllApps();
      loadStats().then(renderStats);
    } else {
      renderAdminLogin();
    }
    return;
  }

  // الصفحة الرئيسية
  if (S.phase === 'voting' || S.phase === 'results') {
    await loadCandidates();
    if (S.phase === 'results') await loadVoteCounts();
  }

  loadStats().then(renderStats);
  renderHome();
  startCountdown();

  if (S.phase === 'registration' && S.registration_open) wireRegForm();
  else if (S.phase === 'voting' && S.voting_open && !hasVoted()) wireVotingPhase();
  else if (S.phase === 'results' && S.results_visible) setTimeout(fireConfetti, 400);
}

function render() {
  if (location.hash.startsWith('#/admin')) {
    if (S.adminLogged) {
      renderAdmin();
      loadAllApps();
      loadStats().then(renderStats);
    } else {
      renderAdminLogin();
    }
  } else {
    renderHome();
    startCountdown();
    if (S.phase === 'registration' && S.registration_open) wireRegForm();
    else if (S.phase === 'voting' && S.voting_open && !hasVoted()) wireVotingPhase();
  }
}

window.addEventListener('hashchange', route);

// الانطلاق
(async function init() {
  await loadSettings();
  await route();
})();
